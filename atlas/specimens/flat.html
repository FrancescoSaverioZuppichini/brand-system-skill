<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=block">
<style>
:root {
  color-scheme: light;
  --white: oklch(0.99 0 0);
  --turquoise: oklch(0.72 0.12 180);
  --turquoise-dark: oklch(0.62 0.11 180);
  --coral: oklch(0.68 0.17 30);
  --blue: oklch(0.60 0.15 250);
  --sun: oklch(0.84 0.16 85);
  --midnight: oklch(0.30 0.04 260);
  --muted: oklch(0.52 0.03 260);
  --cloud: oklch(0.95 0.008 250);
  --sans: "Lato", sans-serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
body { position: relative; font-family: var(--sans); color: var(--midnight); }
p, h1 { margin: 0; }

nav { height: 64px; padding: 0 40px; display: flex; align-items: center; gap: 12px; background: var(--midnight); color: var(--white); font: 700 20px/1 var(--sans); }
nav .mark { width: 30px; height: 30px; border-radius: 4px; background: var(--turquoise); display: grid; place-items: center; }
nav .burger { margin-left: auto; width: 22px; height: 16px; background: linear-gradient(var(--white) 0 3px, transparent 3px 6.5px, var(--white) 6.5px 9.5px, transparent 9.5px 13px, var(--white) 13px); }

.hero { position: absolute; left: 40px; top: 118px; width: 380px; }
.eyebrow { font: 900 13px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--coral); }
h1 { margin: 16px 0 18px; font: 300 48px/1.08 var(--sans); letter-spacing: -.01em; }
h1 b { font-weight: 900; }
.sub { font: 400 16px/1.6 var(--sans); color: var(--muted); }
.btn { display: inline-block; margin-top: 28px; padding: 16px 28px; border-radius: 4px; background: var(--coral); color: var(--white); font: 700 16px/1 var(--sans); }

.art { position: absolute; left: 470px; top: 96px; }
.tile {
  position: absolute; left: 430px; top: 308px; width: 210px; padding: 22px 24px; box-sizing: border-box;
  border-radius: 4px; background: var(--blue); color: var(--white);
}
.tile .label { font: 900 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.tile .num { margin: 10px 0 6px; font: 900 46px/1 var(--sans); }
.tile .cap { font: 400 14px/1.3 var(--sans); }
</style>
</head>
<body>
  <nav>
    <span class="mark"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2h4v12H2zM8 7l6-5v5l-3 1 3 1v5L8 9z" fill="white"/></svg></span>
    Keep
    <span class="burger"></span>
  </nav>

  <section class="hero">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something<br><b>people keep</b></h1>
    <p class="sub">Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
    <a class="btn">Start a project</a>
  </section>

  <!-- [Agent] The long shadow: the icon's outline dragged 45° out to the circle's edge, clipped by the circle. -->
  <svg class="art" width="290" height="290" viewBox="0 0 290 290">
    <defs><clipPath id="c"><circle cx="145" cy="125" r="115"/></clipPath></defs>
    <circle cx="145" cy="125" r="115" fill="oklch(0.72 0.12 180)"/>
    <polygon clip-path="url(#c)" points="185,85 385,285 305,365 105,165" fill="oklch(0.62 0.11 180)"/>
    <rect x="105" y="85" width="80" height="80" rx="3" fill="oklch(0.99 0 0)"/>
    <rect x="137" y="85" width="16" height="80" fill="oklch(0.68 0.17 30)"/>
    <rect x="105" y="85" width="80" height="18" fill="oklch(0.93 0.01 250)"/>
    <rect x="137" y="85" width="16" height="18" fill="oklch(0.60 0.16 30)"/>
    <circle cx="262" cy="30" r="18" fill="oklch(0.84 0.16 85)"/>
    <rect x="248" y="198" width="34" height="34" rx="3" fill="oklch(0.68 0.17 30)" transform="rotate(12 265 215)"/>
    <circle cx="16" cy="40" r="9" fill="oklch(0.60 0.15 250)"/>
  </svg>

  <aside class="tile">
    <p class="label">Still in use</p>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
  </aside>
</body>
</html>
