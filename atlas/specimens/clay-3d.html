<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D clay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(0.95 0.02 260);
  --blue: oklch(0.70 0.13 255);
  --blue-hi: oklch(0.88 0.06 255);
  --blue-lo: oklch(0.50 0.14 260);
  --coral: oklch(0.75 0.13 30);
  --coral-hi: oklch(0.90 0.06 40);
  --coral-lo: oklch(0.58 0.14 28);
  --yellow: oklch(0.88 0.13 90);
  --yellow-hi: oklch(0.97 0.05 95);
  --yellow-lo: oklch(0.72 0.13 75);
  --shadow: oklch(0.75 0.03 260);
  --ink: oklch(0.30 0.05 265);
  --white: oklch(0.99 0.005 260);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body { font-family: "Nunito", sans-serif; color: var(--ink); position: relative; }

.copy { position: absolute; left: 56px; top: 80px; width: 340px; }
.eyebrow { font: 500 12px/1 "DM Mono", monospace; letter-spacing: .06em; color: var(--blue-lo); text-transform: uppercase; }
h1 { font: 700 50px/1.02 "Fredoka", sans-serif; letter-spacing: -.01em; margin: 14px 0 16px; }
p { font-size: 15px; line-height: 1.55; margin: 0 0 28px; opacity: .75; }
.btn { display: inline-block; font: 600 16px/1 "Fredoka", sans-serif; color: var(--white); padding: 16px 28px; border-radius: 99px; background: var(--blue); box-shadow: inset 0 -5px 10px var(--blue-lo), inset 0 4px 8px var(--blue-hi), 0 10px 20px -6px var(--shadow); }

.card { position: absolute; left: 56px; bottom: 34px; display: flex; align-items: baseline; gap: 10px; background: var(--white); border-radius: 22px; padding: 14px 20px; box-shadow: 0 12px 28px -12px var(--shadow); }
.card small { font: 600 12px/1 "Fredoka", sans-serif; color: var(--coral-lo); }
.card b { font: 700 28px/1 "Fredoka", sans-serif; }
.card span { font-size: 12px; opacity: .7; }

.obj, .shade { position: absolute; }
/* [Agent] Every object = a radial highlight up-left + a dark inset down-right (soft occlusion) + its own blurred contact shadow on the floor. */
.shade { border-radius: 50%; background: var(--shadow); filter: blur(10px); opacity: .7; }

.jar { left: 500px; top: 196px; width: 170px; height: 170px; border-radius: 52px 52px 64px 64px; background: radial-gradient(circle at 30% 26%, var(--coral-hi), var(--coral) 46%, var(--coral-lo) 100%); box-shadow: inset -16px -22px 36px oklch(0.50 0.13 28 / .55), inset 12px 10px 20px oklch(1 0 0 / .35); }
.lid { left: 486px; top: 166px; width: 198px; height: 52px; border-radius: 30px; background: radial-gradient(ellipse at 34% 20%, var(--blue-hi), var(--blue) 50%, var(--blue-lo)); box-shadow: inset -8px -10px 18px oklch(0.45 0.14 260 / .5), 0 10px 14px -8px oklch(0.45 0.10 30 / .6); }
.knob { left: 560px; top: 128px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, var(--yellow-hi), var(--yellow) 45%, var(--yellow-lo)); box-shadow: inset -6px -8px 12px oklch(0.60 0.12 75 / .5); }
.jar-shade { left: 488px; top: 360px; width: 200px; height: 30px; }

.ball { left: 690px; top: 70px; width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, var(--blue-hi), var(--blue) 45%, var(--blue-lo)); box-shadow: inset -8px -10px 16px oklch(0.45 0.14 260 / .5); }
.ball-shade { left: 700px; top: 160px; width: 60px; height: 14px; opacity: .45; }

.ring { left: 418px; top: 58px; width: 104px; height: 104px; border-radius: 50%; transform: rotate(-24deg) scaleY(.62); background: radial-gradient(circle, transparent 30%, var(--yellow-lo) 31%, var(--yellow) 40%, var(--yellow-hi) 50%, var(--yellow) 60%, var(--yellow-lo) 70%, transparent 71%); }
.ring-shade { left: 428px; top: 150px; width: 90px; height: 14px; opacity: .4; }

.pill { left: 676px; top: 296px; width: 104px; height: 44px; border-radius: 22px; transform: rotate(-32deg); background: linear-gradient(90deg, transparent 50%, oklch(0 0 0 / 0) 50%), linear-gradient(180deg, var(--coral-hi), var(--coral) 45%, var(--coral-lo)); box-shadow: inset 0 -6px 10px oklch(0.50 0.13 28 / .4); }
.pill::after { content: ""; position: absolute; inset: 0 0 0 50%; border-radius: 0 22px 22px 0; background: linear-gradient(180deg, var(--white), oklch(0.90 0.02 260) 50%, oklch(0.78 0.03 260)); }
.pill-shade { left: 684px; top: 372px; width: 84px; height: 14px; opacity: .45; }
</style>
</head>
<body>
<div class="copy">
  <div class="eyebrow">Introducing Keep</div>
  <h1>Make something people keep</h1>
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn">Start a project</span>
</div>

<div class="shade jar-shade"></div>
<div class="obj jar"></div>
<div class="obj lid"></div>
<div class="obj knob"></div>
<div class="shade ball-shade"></div>
<div class="obj ball"></div>
<div class="shade ring-shade"></div>
<div class="obj ring"></div>
<div class="shade pill-shade"></div>
<div class="obj pill"></div>

<div class="card">
  <small>Still in use</small>
  <b>1,284</b>
  <span>projects made since 2019</span>
</div>
</body>
</html>
