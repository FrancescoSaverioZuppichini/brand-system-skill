<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dithered 1-bit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Silkscreen&family=IBM+Plex+Mono:wght@400&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: oklch(0.95 0.01 90);
  --ink: oklch(0.18 0.01 260);
  --sans: "Space Grotesk", sans-serif;
  --pixel: "Silkscreen", monospace;
  --mono: "IBM Plex Mono", monospace;
  /* [Agent] A 2x2 checker is the 50% level of an ordered dither: the only "shadow" a two-colour screen can draw. */
  --dither-50: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 4px 4px;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--paper); }
body { position: relative; font-family: var(--sans); color: var(--ink); }
body > * { position: absolute; margin: 0; }
canvas { image-rendering: pixelated; }

.strip { left: 0; top: 0; width: 800px; height: 18px; }
.eyebrow { left: 48px; top: 64px; font: 16px/1 var(--pixel); text-transform: uppercase; }
.eyebrow::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 10px; background: var(--ink); }
h1 { left: 46px; top: 96px; width: 360px; font-size: 52px; font-weight: 600; line-height: .98; letter-spacing: -0.035em; }
.sub { left: 48px; top: 276px; width: 380px; font: 400 11.5px/1.75 var(--mono); }
.cta { left: 48px; top: 350px; padding: 13px 20px; background: var(--ink); color: var(--paper); font: 16px/1 var(--pixel); text-decoration: none; }
.cta-shadow { left: 54px; top: 356px; width: 200px; height: 42px; background: var(--dither-50); }

.scene { left: 434px; top: 46px; width: 328px; height: 420px; outline: 2px solid var(--ink); }
.card-shadow { left: 404px; top: 368px; width: 196px; height: 96px; background: var(--dither-50); }
.card { left: 398px; top: 362px; width: 164px; padding: 12px 16px; background: var(--paper); border: 2px solid var(--ink); }
.card .label { display: block; font: 16px/1 var(--pixel); text-transform: uppercase; }
.card .num { display: block; margin: 6px 0 2px; font-size: 34px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
.card .cap { font: 400 11px/1.3 var(--mono); }
</style>
</head>
<body>
<canvas class="strip" id="strip" width="400" height="9"></canvas>

<p class="eyebrow">Introducing Keep</p>
<h1>Make something people keep</h1>
<p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<div class="cta-shadow"></div>
<a class="cta" href="#">Start a project</a>

<canvas class="scene" id="scene" width="82" height="105"></canvas>
<div class="card-shadow"></div>
<aside class="card">
  <span class="label">Still in use</span>
  <span class="num">1,284</span>
  <span class="cap">projects made since 2019</span>
</aside>

<script>
const css = getComputedStyle(document.documentElement);
const PAPER = css.getPropertyValue("--paper").trim(), INK = css.getPropertyValue("--ink").trim();

// [Agent] Paint a two-colour canvas from a 0..1 grey buffer: paper first, then one ink rect per dark pixel.
function paint(canvas, dark) {
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = INK;
  for (let y = 0; y < canvas.height; y++) for (let x = 0; x < canvas.width; x++) if (dark(x, y)) ctx.fillRect(x, y, 1, 1);
}

// [Agent] Ordered dither: compare each pixel's grey with the 8x8 Bayer threshold at that spot, which gives the cross-hatched gradient.
const B = [[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],
           [3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
const strip = document.getElementById("strip");
paint(strip, (x, y) => 1 - x / (strip.width - 1) > (B[y % 8][x % 8] + 0.5) / 64);

// [Agent] Shade a small studio scene (lit sphere, pebble, floor, contact shadow) as grey values, then Atkinson-dither it like MacPaint.
const scene = document.getElementById("scene"), W = scene.width, H = scene.height, HORIZON = 69;
const L = (() => { const v = [-0.55, -0.65, 0.52], n = Math.hypot(...v); return v.map(c => c / n); })();
const Hv = (() => { const v = [L[0], L[1], L[2] + 1], n = Math.hypot(...v); return v.map(c => c / n); })();
function sphere(x, y, cx, cy, r) {
  const nx = (x - cx) / r, ny = (y - cy) / r, d = nx * nx + ny * ny;
  if (d > 1) return null;
  const n = [nx, ny, Math.sqrt(1 - d)];
  const diff = Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);
  const spec = Math.pow(Math.max(0, n[0] * Hv[0] + n[1] * Hv[1] + n[2] * Hv[2]), 40);
  return 0.05 + 0.85 * diff + 0.6 * spec;
}
const g = new Float32Array(W * H);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  let v;
  if (y < HORIZON) v = 0.14 + 0.2 * (y / HORIZON);
  else {
    v = 0.55 + 0.4 * ((y - HORIZON) / (H - HORIZON));
    const s1 = ((x - 58) / 26) ** 2 + ((y - 77) / 6) ** 2, s2 = ((x - 22) / 8) ** 2 + ((y - 76) / 2.5) ** 2;
    v *= Math.min(1, 0.25 + 0.75 * Math.min(s1, s2));
  }
  v = sphere(x, y, 44, 52, 24) ?? sphere(x, y, 18, 71, 7) ?? v;
  g[y * W + x] = Math.min(1, Math.max(0, v));
}
const spread = [[1, 0], [2, 0], [-1, 1], [0, 1], [1, 1], [0, 2]];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x, old = g[i], out = old < 0.5 ? 0 : 1, err = (old - out) / 8;
  g[i] = out;
  for (const [dx, dy] of spread) { const X = x + dx, Y = y + dy; if (X >= 0 && X < W && Y < H) g[Y * W + X] += err; }
}
paint(scene, (x, y) => g[y * W + x] === 0);
</script>
</body>
</html>
