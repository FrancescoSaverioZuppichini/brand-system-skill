<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frutiger Aero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=block">
<style>
:root {
  color-scheme: light;
  --sky: oklch(0.80 0.10 230);
  --sky-deep: oklch(0.58 0.14 245);
  --aqua: oklch(0.85 0.10 200);
  --grass: oklch(0.72 0.17 140);
  --grass-deep: oklch(0.52 0.15 145);
  --white: oklch(0.99 0 0);
  --deep: oklch(0.40 0.14 255);
  --text: oklch(0.32 0.05 250);
  --sans: "Source Sans 3", "Segoe UI", sans-serif;
  /* [Agent] The Aero gloss: bright white on the top half that stops at a hard edge, then the colour shows through. */
  --gloss: linear-gradient(180deg, oklch(1 0 0 / .85), oklch(1 0 0 / .35) 49%, oklch(1 0 0 / 0) 50%);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--sky); }
body {
  position: relative; font-family: var(--sans); color: var(--text);
  background:
    radial-gradient(40% 50% at 82% 8%, oklch(1 0 0 / .9), transparent 70%),
    linear-gradient(180deg, var(--sky-deep), var(--sky) 55%, oklch(0.93 0.05 205) 78%);
}
p, h1 { margin: 0; }
.scene { position: absolute; inset: 0; }
.bubble {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 50% 55%, oklch(1 0 0 / 0) 55%, oklch(1 0 0 / .55) 72%, oklch(0.95 0.06 200 / .9) 100%);
  box-shadow: inset 0 0 0 1px oklch(1 0 0 / .6);
}
.bubble::after { content: ""; position: absolute; left: 18%; top: 10%; width: 40%; height: 26%; border-radius: 50%; background: linear-gradient(180deg, white, oklch(1 0 0 / 0)); transform: rotate(-24deg); }

/* Windows 7 Aero glass window */
.window {
  position: absolute; left: 40px; top: 44px; width: 452px; padding: 0 7px 7px; border-radius: 9px;
  background:
    linear-gradient(115deg, oklch(1 0 0 / 0) 0 24%, oklch(1 0 0 / .22) 24% 30%, oklch(1 0 0 / 0) 30% 52%, oklch(1 0 0 / .16) 52% 55%, oklch(1 0 0 / 0) 55%),
    linear-gradient(180deg, oklch(0.88 0.06 220 / .62), oklch(0.78 0.08 225 / .5));
  backdrop-filter: blur(6px) saturate(140%);
  box-shadow: 0 0 0 1px oklch(0.25 0.06 250 / .7), inset 0 0 0 1px oklch(1 0 0 / .7), 0 14px 34px oklch(0.25 0.10 250 / .45);
}
.titlebar { height: 30px; display: flex; align-items: center; gap: 7px; padding-left: 4px; font: 400 14px/1 var(--sans); color: oklch(0.15 0.02 250); text-shadow: 0 0 8px white, 0 0 4px white; }
.titlebar .logo { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, white, var(--grass) 50%, var(--grass-deep)); }
.caps { margin-left: auto; display: flex; align-self: flex-start; }
.caps i { width: 27px; height: 19px; background: var(--gloss), linear-gradient(180deg, oklch(0.85 0.05 220 / .7), oklch(0.70 0.07 230 / .7)); box-shadow: inset 0 0 0 1px oklch(1 0 0 / .6), 0 0 0 .5px oklch(0.25 0.06 250 / .8); display: grid; place-items: center; }
.caps i:first-child { border-radius: 0 0 0 5px; }
.caps i.x { width: 46px; border-radius: 0 0 5px 0; background: var(--gloss), linear-gradient(180deg, oklch(0.70 0.18 30), oklch(0.52 0.20 28)); }
.caps svg { display: block; }
.client {
  padding: 28px 30px 30px; border-radius: 2px;
  background: linear-gradient(180deg, var(--white), oklch(0.96 0.02 220) 70%, oklch(0.92 0.04 215));
  box-shadow: 0 0 0 1px oklch(0.30 0.06 250 / .55);
}
.eyebrow { font: 600 13px/1 var(--sans); letter-spacing: .04em; color: oklch(0.55 0.12 200); }
h1 { margin: 10px 0 12px; font: 300 40px/1.06 var(--sans); color: var(--deep); letter-spacing: -.01em; }
.sub { font: 400 15px/1.5 var(--sans); }
.btn {
  display: inline-block; margin-top: 22px; padding: 11px 26px; border-radius: 999px;
  font: 700 15px/1 var(--sans); color: white; text-shadow: 0 1px 1px oklch(0.35 0.12 150);
  background: var(--gloss), linear-gradient(180deg, oklch(0.80 0.17 140), var(--grass) 50%, oklch(0.58 0.16 145) 51%, oklch(0.74 0.17 140));
  box-shadow: 0 0 0 1px oklch(0.45 0.13 150), inset 0 -4px 8px oklch(0.90 0.14 130 / .7), 0 4px 10px oklch(0.45 0.13 150 / .35);
}

/* Vista sidebar gadget */
.gadget {
  position: absolute; left: 540px; top: 92px; width: 210px; padding: 22px 20px 24px; box-sizing: border-box; border-radius: 12px;
  background:
    linear-gradient(180deg, oklch(1 0 0 / .42), oklch(1 0 0 / .08) 48%, oklch(1 0 0 / 0) 49%),
    linear-gradient(180deg, oklch(0.45 0.13 245), oklch(0.25 0.09 255));
  box-shadow: 0 0 0 1px oklch(0.20 0.06 255), inset 0 0 0 1px oklch(1 0 0 / .45), 0 12px 26px oklch(0.25 0.10 250 / .5);
  color: white; text-align: center;
}
.gadget .label { font: 600 13px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--aqua); }
.gadget .num { margin: 12px 0 8px; font: 300 56px/1 var(--sans); text-shadow: 0 0 14px oklch(0.85 0.10 200 / .8); }
.gadget .cap { font: 400 14px/1.3 var(--sans); color: oklch(0.90 0.03 220); }
.gadget .orb { width: 34px; height: 34px; margin: 16px auto 0; border-radius: 50%; background: var(--gloss), radial-gradient(circle at 50% 70%, oklch(0.90 0.12 195), oklch(0.62 0.13 215)); box-shadow: 0 0 0 1px oklch(0.85 0.06 210 / .8), 0 0 14px oklch(0.85 0.10 200 / .7); }
</style>
</head>
<body>
  <svg class="scene" width="800" height="500" viewBox="0 0 800 500">
    <defs>
      <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.84 0.18 135)"/><stop offset=".35" stop-color="oklch(0.72 0.17 140)"/><stop offset="1" stop-color="oklch(0.50 0.15 145)"/></linearGradient>
      <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.78 0.16 140)"/><stop offset="1" stop-color="oklch(0.45 0.14 148)"/></linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <path d="M-40 260 C 160 200, 380 300, 860 150" fill="none" stroke="white" stroke-width="10" opacity=".35" filter="url(#soft)"/>
    <path d="M-40 290 C 200 230, 420 330, 860 190" fill="none" stroke="white" stroke-width="3" opacity=".7"/>
    <path d="M-40 320 C 220 270, 440 360, 860 230" fill="none" stroke="oklch(0.92 0.08 200)" stroke-width="2" opacity=".6"/>
    <ellipse cx="620" cy="560" rx="460" ry="150" fill="url(#hill2)"/>
    <ellipse cx="180" cy="580" rx="520" ry="170" fill="url(#hill)"/>
    <ellipse cx="150" cy="440" rx="300" ry="18" fill="white" opacity=".35" filter="url(#soft)"/>
  </svg>
  <i class="bubble" style="left:504px;top:30px;width:46px;height:46px"></i>
  <i class="bubble" style="left:760px;top:250px;width:30px;height:30px"></i>
  <i class="bubble" style="left:470px;top:400px;width:64px;height:64px"></i>
  <i class="bubble" style="left:16px;top:420px;width:22px;height:22px"></i>
  <i class="bubble" style="left:700px;top:400px;width:40px;height:40px"></i>

  <section class="window">
    <div class="titlebar">
      <i class="logo"></i>Keep
      <span class="caps">
        <i><svg width="10" height="10"><rect x="1" y="7" width="8" height="2" fill="white" stroke="oklch(0.3 0.05 250)" stroke-width=".5"/></svg></i>
        <i><svg width="10" height="10"><rect x="1" y="1" width="8" height="7" fill="none" stroke="white" stroke-width="2"/></svg></i>
        <i class="x"><svg width="12" height="12"><path d="M2 2l8 8M10 2l-8 8" stroke="white" stroke-width="2.4"/></svg></i>
      </span>
    </div>
    <div class="client">
      <p class="eyebrow">Introducing Keep</p>
      <h1>Make something<br>people keep</h1>
      <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
      <a class="btn">Start a project</a>
    </div>
  </section>

  <aside class="gadget">
    <p class="label">Still in use</p>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
    <div class="orb"></div>
  </aside>
</body>
</html>
