<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food & beverage craft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Young+Serif&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=block">
<style>
  :root {
    color-scheme: light;
    --cream: oklch(0.95 0.03 85);
    --tomato: oklch(0.60 0.19 32);
    --mustard: oklch(0.78 0.14 80);
    --kraft: oklch(0.66 0.07 65);
    --bottle: oklch(0.35 0.06 160);
    --bottle-hi: oklch(0.45 0.07 160);
    --serif: "Fraunces", serif;
    --badge: "Young Serif", serif;
    --sans: "Bricolage Grotesque", sans-serif;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cream); }
  body { position: relative; font-family: var(--sans); color: var(--bottle); }
  svg.layer { position: absolute; inset: 0; }

  .copy { position: absolute; left: 50px; top: 82px; }
  .eyebrow { font-family: var(--serif); font-style: italic; font-weight: 500; font-variation-settings: "WONK" 1, "SOFT" 100; font-size: 24px; color: var(--tomato); }
  h1 { font-family: var(--serif); font-weight: 850; font-variation-settings: "WONK" 1, "SOFT" 100, "opsz" 144; font-size: 60px; line-height: 0.95; letter-spacing: -0.02em; margin: 12px 0 18px; }
  p { margin: 0; font-size: 15px; line-height: 1.5; white-space: nowrap; }
  .cta { display: inline-block; margin-top: 24px; padding: 13px 24px; border-radius: 8px; background: var(--tomato); color: var(--cream); border: 2px solid var(--bottle); font-weight: 700; font-size: 16px; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <svg class="layer" width="800" height="500" viewBox="0 0 800 500">
    <defs>
      <pattern id="awning" width="56" height="44" patternUnits="userSpaceOnUse"><rect width="28" height="44" fill="var(--tomato)"/><rect x="28" width="28" height="44" fill="var(--cream)"/></pattern>
      <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.15  0 0 0 0.22 0"/></filter>
      <!-- [Agent] Ink-stamp roughness: displace the badge edges with noise so it reads printed, not vector-perfect. -->
      <filter id="stamp"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="2.2"/></filter>
      <path id="top" d="M -70 0 A 70 70 0 0 1 70 0"/>
      <path id="bottom" d="M -81 0 A 81 81 0 0 0 81 0"/>
    </defs>

    <!-- awning with scalloped edge -->
    <rect width="800" height="30" fill="url(#awning)"/>
    <path d="M0 30 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 Z" fill="url(#awning)"/>
    <path d="M0 30 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0 q14 22 28 0" fill="none" stroke="var(--bottle)" stroke-width="2"/>

    <!-- squeeze bottle -->
    <g transform="translate(690 0)">
      <path d="M-6 74 L-3 54 h6 L6 74 Z" fill="var(--mustard)" stroke="var(--bottle)" stroke-width="2"/>
      <rect x="-22" y="74" width="44" height="40" rx="6" fill="var(--mustard)" stroke="var(--bottle)" stroke-width="2"/>
      <path d="M-26 114 h52 C 50 124 62 140 62 168 V 470 q0 14 -14 14 H -48 q-14 0 -14 -14 V 168 C -62 140 -50 124 -26 114 Z" fill="var(--bottle)"/>
      <rect x="-46" y="170" width="12" height="290" rx="6" fill="var(--bottle-hi)"/>
      <rect x="-62" y="236" width="124" height="170" fill="var(--cream)"/>
      <rect x="-62" y="236" width="124" height="16" fill="var(--tomato)"/>
      <rect x="-62" y="390" width="124" height="16" fill="var(--tomato)"/>
      <g fill="none" stroke="var(--bottle)" stroke-width="2" stroke-linecap="round">
        <path d="M-2 372 C 0 330 8 300 22 276"/>
        <path d="M2 344 C -18 340 -28 326 -28 310 C -12 314 0 326 2 344 Z" fill="var(--mustard)"/>
        <path d="M8 316 C 24 310 32 296 30 282 C 16 288 8 300 8 316 Z" fill="var(--mustard)"/>
      </g>
      <circle cx="-30" cy="282" r="3" fill="var(--tomato)"/><circle cx="34" cy="350" r="3" fill="var(--tomato)"/>
    </g>

    <!-- the badge -->
    <g transform="translate(568 318) rotate(-12) scale(0.9)" filter="url(#stamp)">
      <polygon points="112.0,0.0 99.4,11.2 109.2,24.9 94.4,33.0 100.9,48.6 84.7,53.2 87.6,69.8 70.7,70.7 69.8,87.6 53.2,84.7 48.6,100.9 33.0,94.4 24.9,109.2 11.2,99.4 0.0,112.0 -11.2,99.4 -24.9,109.2 -33.0,94.4 -48.6,100.9 -53.2,84.7 -69.8,87.6 -70.7,70.7 -87.6,69.8 -84.7,53.2 -100.9,48.6 -94.4,33.0 -109.2,24.9 -99.4,11.2 -112.0,0.0 -99.4,-11.2 -109.2,-24.9 -94.4,-33.0 -100.9,-48.6 -84.7,-53.2 -87.6,-69.8 -70.7,-70.7 -69.8,-87.6 -53.2,-84.7 -48.6,-100.9 -33.0,-94.4 -24.9,-109.2 -11.2,-99.4 -0.0,-112.0 11.2,-99.4 24.9,-109.2 33.0,-94.4 48.6,-100.9 53.2,-84.7 69.8,-87.6 70.7,-70.7 87.6,-69.8 84.7,-53.2 100.9,-48.6 94.4,-33.0 109.2,-24.9 99.4,-11.2" fill="var(--mustard)" stroke="var(--bottle)" stroke-width="2" stroke-linejoin="round"/>
      <circle r="94" fill="var(--tomato)" stroke="var(--bottle)" stroke-width="2"/>
      <circle r="88" fill="none" stroke="var(--cream)" stroke-width="1.5" stroke-dasharray="3 4"/>
      <circle r="58" fill="var(--cream)" stroke="var(--bottle)" stroke-width="2"/>
      <text font-family="Bricolage Grotesque" font-weight="700" font-size="14" letter-spacing="3" fill="var(--cream)"><textPath href="#top" startOffset="50%" text-anchor="middle">STILL IN USE</textPath></text>
      <text font-family="Bricolage Grotesque" font-weight="700" font-size="11.5" letter-spacing="1.6" fill="var(--cream)"><textPath href="#bottom" startOffset="50%" text-anchor="middle">PROJECTS MADE SINCE 2019</textPath></text>
      <path d="M-76 0 l3 -7 l3 7 l-3 7 Z M70 0 l3 -7 l3 7 l-3 7 Z" fill="var(--mustard)"/>
      <text y="12" text-anchor="middle" font-family="Young Serif" font-size="34" fill="var(--bottle)">1,284</text>
      <path d="M-30 24 q30 8 60 0" fill="none" stroke="var(--tomato)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <rect width="800" height="500" filter="url(#paper)" style="mix-blend-mode:multiply"/>
  </svg>

  <div class="copy">
    <div class="eyebrow">Introducing Keep</div>
    <h1>Make<br>something<br>people keep</h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project</span>
  </div>
</body>
</html>
