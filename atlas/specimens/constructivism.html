<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Constructivism</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Space+Mono:wght@400;700&display=block">
<style>
:root {
  color-scheme: light;
  --cream: oklch(0.93 0.03 85);
  --black: oklch(0.17 0.01 40);
  --red: oklch(0.55 0.21 29);
  --grey: oklch(0.60 0.01 60);
  --display: "Anton", sans-serif;
  --heavy: "Archivo Black", sans-serif;
  --mono: "Space Mono", monospace;
  --angle: -14deg;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cream); color: var(--black); }
body { font-family: var(--mono); position: relative; }

/* [Agent] A halftone screen over the red disc stands in for the photomontage faces of the originals: dots grow toward the lower edge through a mask. */
.sun { position: absolute; left: 520px; top: -40px; width: 270px; height: 270px; border-radius: 50%; background: var(--red); overflow: hidden; }
.sun::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle, var(--black) 34%, transparent 36%) 0 0 / 9px 9px;
  mask-image: linear-gradient(200deg, transparent 35%, #000 95%);
}

/* [Agent] Everything display sits on one shared angle; the reading text in the two corner triangles stays level. */
.diag { position: absolute; left: -80px; top: 192px; width: 980px; transform: rotate(var(--angle)); transform-origin: 50% 50%; }
h1 { margin: 0; font-weight: 400; }
.band, .under { display: block; }
.band { background: var(--black); color: var(--cream); height: 118px; display: flex; align-items: center; padding-left: 150px; font: 400 96px/1 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
.under { color: var(--red); font: 400 98px/0.95 var(--display); text-transform: uppercase; padding-left: 112px; margin-top: 6px; }
.rule { position: absolute; left: 0; right: 0; top: -22px; height: 10px; background: var(--red); }

.eyebrow { position: absolute; left: 40px; top: 40px; background: var(--red); color: var(--cream); font: 400 18px/1 var(--heavy); text-transform: uppercase; letter-spacing: 0.04em; padding: 9px 14px; }
.sub { position: absolute; left: 40px; top: 92px; margin: 0; width: 420px; font-size: 12px; line-height: 1.55; }
.btn {
  position: absolute; left: 40px; top: 146px; border: 0; border-radius: 0;
  background: var(--black); color: var(--cream); font: 400 15px var(--heavy); text-transform: uppercase; letter-spacing: 0.04em;
  padding: 11px 44px 11px 16px; clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
}

.card { position: absolute; right: 32px; bottom: 28px; width: 180px; background: var(--black); color: var(--cream); padding: 14px 18px 16px; }
.card .label { font: 700 12px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--red); }
.card .num { font: 400 68px/1 var(--display); margin: 6px 0 4px; }
.card .cap { font-size: 12px; }
</style>
</head>
<body>
<div class="sun"></div>
<div class="diag">
  <div class="rule"></div>
  <h1><span class="band">Make something</span><span class="under">People keep</span></h1>
</div>
<div class="eyebrow">Introducing Keep</div>
<p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<button class="btn">Start a project</button>
<div class="card">
  <div class="label">Still in use</div>
  <div class="num">1,284</div>
  <div class="cap">projects made since 2019</div>
</div>
</body>
</html>
