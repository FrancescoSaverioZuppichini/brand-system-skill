<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liquid blob</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --cream: oklch(0.96 0.02 85);
  --tangerine: oklch(0.72 0.18 50);
  --berry: oklch(0.52 0.20 355);
  --ink: oklch(0.25 0.03 300);
  --lilac: oklch(0.82 0.08 300);
  --blob: 42% 58% 63% 37% / 41% 44% 56% 59%;
  --display: "Bricolage Grotesque", sans-serif;
  --sans: "DM Sans", sans-serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cream); }
body { position: relative; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
svg { position: absolute; overflow: visible; }

.big { left: 420px; top: 36px; width: 372px; }
.berry { left: 384px; top: 6px; width: 104px; }
.drop { left: 290px; top: 404px; width: 64px; }
.lilac { left: 456px; top: 300px; width: 280px; }

.text { position: absolute; left: 52px; top: 58px; width: 390px; }
.eyebrow { display: inline-block; margin: 0 0 18px; padding: 8px 16px; border-radius: var(--blob); background: var(--lilac); font-size: 14px; font-weight: 700; }
h1 { margin: 0; font: 800 64px/.92 var(--display); letter-spacing: -0.035em; }
.sub { margin: 20px 0 0; font-size: 15px; font-weight: 500; line-height: 1.55; }
.cta { display: inline-block; margin-top: 26px; padding: 18px 30px; border-radius: var(--blob); background: var(--berry); color: var(--cream);
  font-size: 16px; font-weight: 700; text-decoration: none; }

.card { position: absolute; left: 504px; top: 336px; width: 190px; text-align: center; }
.card .label { font-size: 13px; font-weight: 700; }
.card .num { display: block; font: 800 46px/1 var(--display); letter-spacing: -0.03em; color: var(--berry); }
.card .cap { font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<svg class="big" viewBox="-10 25 380 365"><path fill="var(--tangerine)" d="M359,187 C363,230 335,293 305,324 C276,355 232,385 184,374 C135,364 36,305 15,262 C-6,219 32,154 57,116 C82,79 126,44 164,35 C203,27 255,40 287,66 C320,91 356,144 359,187Z"/>
  <g fill="var(--ink)"><ellipse cx="160" cy="160" rx="9" ry="13"/><ellipse cx="236" cy="156" rx="9" ry="13"/></g>
  <path d="M168 206 Q 200 236 232 204" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
  <g fill="var(--berry)" opacity=".35"><ellipse cx="128" cy="196" rx="18" ry="10"/><ellipse cx="270" cy="190" rx="18" ry="10"/></g>
</svg>
<svg class="berry" viewBox="15 5 96 112"><path fill="var(--berry)" d="M109,59 C112,75 107,100 95,108 C84,116 54,117 41,108 C28,100 18,71 17,55 C16,39 23,19 34,12 C44,6 66,6 79,14 C91,22 107,44 109,59Z"/></svg>
<svg class="drop" viewBox="2 5 76 67"><path fill="var(--tangerine)" d="M76,40 C75,50 57,64 48,68 C38,72 24,71 17,63 C10,55 2,29 8,20 C14,10 41,4 53,7 C64,10 77,30 76,40Z"/></svg>
<svg class="lilac" viewBox="12 -12 211 194"><path fill="var(--lilac)" d="M221,72 C220,99 199,153 175,167 C150,181 99,168 72,156 C45,144 14,121 13,96 C12,70 39,18 67,3 C96,-13 156,-9 182,2 C207,14 222,45 221,72Z"/></svg>

<section class="text">
  <p class="eyebrow">Introducing Keep</p>
  <h1>Make something people keep</h1>
  <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
  <a class="cta" href="#">Start a project</a>
</section>

<aside class="card">
  <span class="label">Still in use</span>
  <span class="num">1,284</span>
  <span class="cap">projects made since 2019</span>
</aside>
</body>
</html>
