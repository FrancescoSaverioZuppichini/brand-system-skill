<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blueprint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Mono&display=block">
<style>
:root {
  color-scheme: dark;
  --cyanotype: oklch(0.38 0.11 255);
  --line: oklch(0.95 0.02 240);
  --grid: oklch(0.48 0.09 255);
  --highlight: oklch(0.85 0.14 90);
  --dim: oklch(0.80 0.05 245);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cyanotype); }
/* [Agent] Graph paper: 8 px minor squares, a stronger rule every 40 px. */
body { font-family: "Barlow Semi Condensed", sans-serif; color: var(--line); position: relative;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(oklch(0.48 0.09 255 / .45) 1px, transparent 1px), linear-gradient(90deg, oklch(0.48 0.09 255 / .45) 1px, transparent 1px);
  background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px; }

.copy { position: absolute; left: 40px; top: 40px; width: 340px; }
.eyebrow { font: 500 11px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--highlight); }
h1 { font-size: 52px; font-weight: 600; line-height: .96; text-transform: uppercase; letter-spacing: .01em; margin: 14px 0 16px; }
p { font: 400 13px/1.55 "IBM Plex Mono", monospace; color: var(--dim); margin: 0 0 22px; }
.btn { display: inline-block; font: 500 12px/1 "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; border: 1.5px solid var(--line); padding: 12px 16px; background: var(--cyanotype); }
.btn::before { content: "\2192  "; color: var(--highlight); }

.titleblock { position: absolute; left: 40px; top: 384px; width: 360px; display: grid; grid-template-columns: 1fr 1fr 64px; border: 1.5px solid var(--line); background: var(--cyanotype); font-family: "IBM Plex Mono", monospace; }
.titleblock > div { border-right: 1px solid var(--line); padding: 6px 8px; }
.titleblock > div:last-child { border-right: 0; }
.titleblock small { display: block; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.titleblock b { display: block; font: 500 26px/1.1 "Barlow Semi Condensed", sans-serif; margin-top: 4px; }
.titleblock span { display: block; font-size: 10px; line-height: 1.3; margin-top: 6px; }
.titleblock .row { grid-column: 1 / -1; border-right: 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }

.drawing { position: absolute; inset: 0; width: 800px; height: 500px; }
.drawing .ln { fill: none; stroke: var(--line); stroke-width: 1.6; }
.drawing .thin { fill: none; stroke: var(--line); stroke-width: 1; }
.drawing .hid { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 4; }
.drawing .ctr { fill: none; stroke: var(--dim); stroke-width: 1; stroke-dasharray: 14 3 2 3; }
.drawing .hatch { stroke: var(--line); stroke-width: .8; }
.drawing .hi { stroke: var(--highlight); }
.drawing text { font: 400 11px "Space Mono", monospace; fill: var(--line); }
.drawing text.hi { fill: var(--highlight); stroke: none; }
</style>
</head>
<body>
<svg class="drawing" viewBox="0 0 800 500" aria-hidden="true">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1.5L10 5 0 8.5z" fill="var(--line)"/></marker>
    <pattern id="sec" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern>
    <clipPath id="half"><rect x="535" y="100" width="100" height="320"/></clipPath>
  </defs>

  <path class="ctr" d="M535 104V424"/>
  <path class="ln" d="M470 184H600V384Q600 400 584 400H486Q470 400 470 384Z"/>
  <path class="ln" d="M462 152H608V184H462Z"/>
  <path class="ln" d="M522 136H548V152H522Z"/>
  <!-- [Agent] Right half drawn as a section: the cut walls are hatched, the left half stays an elevation with the hidden inner wall dashed. -->
  <g clip-path="url(#half)">
    <path d="M592 184V392H535V400H584Q600 400 600 384V184Z" fill="url(#sec)"/>
    <path d="M535 152H608V184H600V164H535Z" fill="url(#sec)"/>
  </g>
  <path class="thin" d="M535 392H592V184"/>
  <path class="hid" d="M478 188V392H535"/>

  <path class="thin" d="M470 404V446M600 404V446"/>
  <path class="thin" d="M470 438H600" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="520" y="432">130</text>
  <path class="thin" d="M466 184H430M466 400H430"/>
  <path class="thin" d="M438 184V400" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="428" y="300" transform="rotate(-90 428 300)" text-anchor="middle">216</text>
  <path class="thin" d="M462 148V108M608 148V108"/>
  <path class="thin hi" d="M462 116H608" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="514" y="110" class="hi">&#216;146</text>

  <path class="ctr" d="M612 300H800M706 206V394"/>
  <circle class="thin" cx="706" cy="300" r="86" stroke-dasharray="2 4"/>
  <circle class="ln" cx="706" cy="300" r="73"/>
  <circle class="hid" cx="706" cy="300" r="65"/>
  <circle class="ln" cx="706" cy="300" r="13"/>
  <path class="thin" d="M706 300L758 248H796"/>
  <text x="768" y="243">R73</text>

  <path class="thin" d="M608 168L650 140H676"/>
  <circle class="thin hi" cx="688" cy="140" r="11"/>
  <text x="684" y="144" class="hi">A</text>
</svg>

<div class="copy">
  <div class="eyebrow">Introducing Keep</div>
  <h1>Make something people keep</h1>
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn">Start a project</span>
</div>

<div class="titleblock">
  <div><small>Still in use</small><b>1,284</b></div>
  <div><span>projects made since 2019</span></div>
  <div><small>Sheet</small><span>1/1</span></div>
  <div class="row"><span>Keep</span><span>Fig. 1</span><span>Scale 1:2</span></div>
</div>
</body>
</html>
