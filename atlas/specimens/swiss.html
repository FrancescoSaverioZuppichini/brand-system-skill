<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiss / International Typographic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter+Tight:wght@600;700&family=Inter:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --paper: oklch(0.98 0 0);
  --ink: oklch(0.16 0 0);
  --grey: oklch(0.52 0 0);
  --red: oklch(0.58 0.23 28);
  --display: "Inter Tight", sans-serif;
  --text: "Inter", sans-serif;
  --mono: "IBM Plex Mono", monospace;
  --m: 40px;
  --gut: 20px;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--paper); color: var(--ink); }
body { font-family: var(--text); position: relative; }

/* [Agent] Six columns on a 40 px margin; every block below starts on one of these column lines, nothing is centred. */
.grid {
  position: absolute; inset: 0 var(--m);
  display: grid; grid-template-columns: repeat(6, 1fr); column-gap: var(--gut);
  grid-template-rows: 64px 1fr 150px;
}

.top { grid-column: 1 / 5; display: grid; grid-template-columns: subgrid; align-items: end; padding-bottom: 10px; border-bottom: 1px solid var(--ink); font-size: 13px; font-weight: 500; }
.top span:first-child { grid-column: 1 / 3; }
.top .no { grid-column: 4; font-family: var(--mono); font-weight: 400; color: var(--grey); }

h1 {
  grid-column: 1 / 6; grid-row: 2; align-self: start;
  margin: 28px 0 0; font-family: var(--display); font-weight: 700;
  font-size: 86px; line-height: 0.92; letter-spacing: -0.045em;
}
h1 span { color: var(--red); }

.field { position: absolute; top: 0; right: 0; width: 267px; height: 350px; background: var(--red); }
.card { position: absolute; top: 88px; left: 553px; width: 207px; color: var(--paper); }
.card .label { font-family: var(--mono); font-size: 12px; }
.card .num { font-family: var(--display); font-weight: 600; font-size: 64px; line-height: 1; letter-spacing: -0.04em; margin: 12px 0 8px; }
.card .cap { font-size: 13px; line-height: 1.35; }

.foot { grid-column: 1 / 7; grid-row: 3; display: grid; grid-template-columns: subgrid; border-top: 1px solid var(--ink); padding-top: 16px; }
.sub { grid-column: 1 / 5; margin: 0; font-size: 15px; line-height: 1.45; }
.btn {
  grid-column: 5 / 7; align-self: start; justify-self: start;
  background: var(--ink); color: var(--paper); font: 500 14px var(--text);
  padding: 13px 18px; border: 0; border-radius: 0;
}
.btn::after { content: "  →"; }
</style>
</head>
<body>
<div class="field"></div>
<div class="grid">
  <div class="top"><span>Introducing Keep</span><span class="no">No. 01</span></div>
  <h1>Make something people keep<span>.</span></h1>
  <div class="foot">
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <button class="btn">Start a project</button>
  </div>
</div>
<div class="card">
  <div class="label">Still in use</div>
  <div class="num">1,284</div>
  <div class="cap">projects made since 2019</div>
</div>
</body>
</html>
