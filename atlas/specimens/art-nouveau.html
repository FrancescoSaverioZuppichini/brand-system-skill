<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Art Nouveau</title>
<link href="https://fonts.googleapis.com/css2?family=Federant&family=Cormorant:ital,wght@0,500;0,600;1,500&family=Marcellus+SC&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --cream: oklch(0.94 0.03 90);
  --sage: oklch(0.66 0.06 140);
  --sage-pale: oklch(0.88 0.035 140);
  --rose: oklch(0.72 0.07 20);
  --rose-pale: oklch(0.88 0.04 30);
  --gold: oklch(0.74 0.11 85);
  --ink: oklch(0.28 0.03 60);
  --display: "Federant", serif;
  --text: "Cormorant", serif;
  --label: "Marcellus SC", serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cream); }
body { position: relative; font-family: var(--text); color: var(--ink); }
.ornament { position: absolute; inset: 0; }

.arch {
  position: absolute; left: 200px; top: 110px; width: 400px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.eyebrow { margin: 0; font: 15px var(--label); letter-spacing: .24em; color: var(--ink); }
h1 { margin: 14px 0 0; font: 400 40px/1.08 var(--display); color: var(--ink); }
.sub { margin: 16px 0 0; font: 500 16px/1.4 var(--text); }
.button {
  margin-top: 20px; padding: 9px 26px; border: 1.5px solid var(--ink); border-radius: 22px 22px 4px 4px;
  background: var(--rose); color: var(--ink); font: 14px var(--label); letter-spacing: .14em;
}
.plinth {
  position: absolute; left: 180px; top: 424px; width: 440px; height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 14px; color: var(--ink);
}
.plinth .label { font: 12px var(--label); letter-spacing: .16em; }
.plinth .num { font: 30px var(--display); }
.plinth .cap { font: italic 500 15px/1.1 var(--text); width: 96px; text-align: left; }
</style>
</head>
<body>
  <svg class="ornament" viewBox="0 0 800 500" aria-hidden="true">
    <defs>
      <!-- [Agent] One side of whiplash stems and lilies; the right side is the same group mirrored, so the poster stays symmetrical. -->
      <g id="side" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path fill="none" d="M150 500 C150 420 92 400 96 330 C100 262 170 262 166 200 C162 142 92 150 98 104 C102 72 140 70 140 96 C140 112 120 114 118 102"/>
        <path fill="none" d="M176 500 C176 430 128 410 132 350 C136 296 196 286 196 230 C196 176 150 160 158 120"/>
        <path fill="none" d="M120 500 C116 450 60 440 52 380 C44 310 104 300 92 236 C84 196 40 196 44 228 C46 244 64 244 64 230"/>
        <path fill="var(--sage)" d="M96 330 C70 320 52 290 58 262 C80 274 96 300 96 330Z"/>
        <path fill="var(--sage)" d="M132 350 C156 336 176 310 172 282 C150 296 134 320 132 350Z"/>
        <path fill="var(--sage)" d="M52 380 C34 360 30 330 40 310 C56 330 58 356 52 380Z"/>
        <path fill="var(--sage-pale)" d="M166 200 C190 186 208 160 204 136 C184 150 168 172 166 200Z"/>
        <!-- lily -->
        <g transform="translate(158 120)">
          <path fill="var(--rose)" d="M0 0 C-14 -10 -20 -34 -10 -54 C-2 -38 2 -18 0 0Z"/>
          <path fill="var(--rose)" d="M0 0 C14 -10 20 -34 10 -54 C2 -38 -2 -18 0 0Z"/>
          <path fill="var(--rose-pale)" d="M0 0 C-6 -16 -6 -40 0 -60 C6 -40 6 -16 0 0Z"/>
        </g>
        <circle cx="64" cy="230" r="4" fill="var(--gold)"/>
        <circle cx="118" cy="102" r="4" fill="var(--gold)"/>
      </g>
      <radialGradient id="halo" cx=".5" cy=".5" r=".5">
        <stop offset=".6" stop-color="var(--rose-pale)"/>
        <stop offset="1" stop-color="var(--cream)"/>
      </radialGradient>
    </defs>

    <use href="#side" transform="translate(-22 0)"/>
    <use href="#side" transform="translate(822 0) scale(-1 1)"/>

    <!-- arch with halo, the Mucha frame -->
    <path d="M180 500 V240 A220 220 0 0 1 620 240 V500" fill="var(--sage-pale)" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="400" cy="240" r="196" fill="url(#halo)"/>
    <circle cx="400" cy="240" r="196" fill="none" stroke="var(--gold)" stroke-width="10"/>
    <circle cx="400" cy="240" r="196" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="2 14"/>
    <circle cx="400" cy="240" r="186" fill="none" stroke="var(--ink)" stroke-width="1"/>
    <circle cx="400" cy="240" r="202" fill="none" stroke="var(--ink)" stroke-width="1"/>
    <path d="M190 500 V240 A210 210 0 0 1 610 240 V500" fill="none" stroke="var(--ink)" stroke-width="1"/>
    <!-- keystone and plinth -->
    <path d="M386 8 H414 L407 26 H393Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.4"/>
    <rect x="180" y="418" width="440" height="64" fill="var(--cream)" stroke="var(--ink)" stroke-width="2"/>
    <rect x="188" y="426" width="424" height="48" fill="none" stroke="var(--ink)" stroke-width="1"/>
    <g fill="var(--gold)" stroke="var(--ink)" stroke-width="1"><rect x="180" y="410" width="16" height="16"/><rect x="604" y="410" width="16" height="16"/></g>
  </svg>

  <div class="arch">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <button class="button">Start a project</button>
  </div>
  <div class="plinth">
    <span class="label">Still in use</span>
    <span class="num">1,284</span>
    <span class="cap">projects made since 2019</span>
  </div>
</body>
</html>
