<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bauhaus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Jost:wght@400;500&family=League+Spartan:wght@700;800&display=block">
<style>
:root {
  color-scheme: light;
  --paper: oklch(0.95 0.015 85);
  --black: oklch(0.18 0 0);
  --red: oklch(0.57 0.20 30);
  --yellow: oklch(0.84 0.16 88);
  --blue: oklch(0.45 0.15 258);
  --display: "League Spartan", sans-serif;
  --text: "Jost", sans-serif;
  --mono: "DM Mono", monospace;
  --bar: 6px;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--paper); color: var(--black); }
body { font-family: var(--text); position: relative; }

/* [Agent] The right half is a 2 × 3 kit of near-square 165 × 167 tiles: every shape is a circle, half, quarter, triangle or square cut to the tile, which is the construction rule that keeps it Bauhaus and not clip art. */
.kit {
  position: absolute; top: 0; right: 0; width: 330px; height: 500px;
  display: grid; grid-template-columns: repeat(2, 165px); grid-template-rows: repeat(3, 1fr);
  border-left: var(--bar) solid var(--black);
}
.kit > div { position: relative; overflow: hidden; }
.t1 { background: var(--yellow); }
.t1::after { content: ""; position: absolute; left: 0; bottom: 0; width: 200%; height: 200%; border-radius: 50%; background: var(--black); transform: translate(-50%, 50%); }
.t2::after { content: ""; position: absolute; inset: 18px; border-radius: 50%; background: var(--blue); }
.t3 { background: var(--black); }
.t3::after { content: ""; position: absolute; inset: -50% 0 50%; border-radius: 50%; background: var(--red); }
.t4 { background: var(--red); }
.t4::after { content: ""; position: absolute; inset: 0; background: var(--paper); clip-path: polygon(0 100%, 100% 100%, 50% 0); }
.t5 { background: var(--blue); }
.t5::after { content: ""; position: absolute; left: 0; top: 0; width: 200%; height: 200%; border-radius: 50%; background: var(--yellow); transform: translate(-50%, -50%); }
.t6 { background: var(--paper); }

.circle { position: absolute; left: 250px; top: 36px; width: 300px; height: 300px; border-radius: 50%; background: var(--red); }

.eyebrow {
  position: absolute; left: 0; top: 40px; width: 300px; height: 40px;
  background: var(--black); color: var(--paper);
  display: flex; align-items: center; padding-left: 40px; box-sizing: border-box;
  font: 500 15px var(--text); letter-spacing: 0.06em; text-transform: lowercase;
}
h1 {
  position: absolute; left: 40px; top: 108px; margin: 0; width: 460px;
  font: 800 70px/0.9 var(--display); letter-spacing: -0.02em; text-transform: lowercase;
}
.sub { position: absolute; left: 40px; top: 352px; margin: 0; width: 400px; font-size: 15px; line-height: 1.45; text-transform: lowercase; }
.btn {
  position: absolute; left: 40px; top: 418px;
  background: var(--blue); color: var(--paper); border: 0; border-radius: 999px;
  font: 500 15px var(--text); padding: 12px 24px; text-transform: lowercase;
}
.card {
  position: absolute; right: 20px; bottom: 20px; width: 210px; height: 126px; box-sizing: border-box;
  background: var(--paper); border: var(--bar) solid var(--black); padding: 12px 16px;
}
.card .label { font: 400 12px var(--mono); text-transform: lowercase; }
.card .num { font: 800 52px/1 var(--display); margin-top: 8px; }
.card .cap { font-size: 13px; text-transform: lowercase; }
</style>
</head>
<body>
<div class="circle"></div>
<div class="kit"><div class="t1"></div><div class="t2"></div><div class="t3"></div><div class="t4"></div><div class="t5"></div><div class="t6"></div></div>
<div class="eyebrow">Introducing Keep</div>
<h1>Make something people keep</h1>
<p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<button class="btn">Start a project</button>
<div class="card">
  <div class="label">Still in use</div>
  <div class="num">1,284</div>
  <div class="cap">projects made since 2019</div>
</div>
</body>
</html>
