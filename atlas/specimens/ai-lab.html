<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI lab (humanist)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=block">
<style>
  :root {
    color-scheme: light;
    --stone: oklch(0.96 0.012 80);
    --ink: oklch(0.20 0.01 60);
    --clay: oklch(0.62 0.13 40);
    --grey: oklch(0.50 0.01 60);
    --line: oklch(0.88 0.01 80);
    --serif: "Newsreader", serif;
    --sans: "Instrument Sans", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--stone); }
  body { position: relative; font-family: var(--sans); color: var(--ink); }

  .copy { position: absolute; left: 48px; top: 96px; width: 380px; }
  .eyebrow { font-size: 14px; font-weight: 500; color: var(--grey); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 58px; line-height: 1.04; letter-spacing: -0.02em; margin: 14px 0 22px; }
  p { margin: 0; font-size: 15px; line-height: 1.6; color: oklch(0.36 0.01 60); white-space: nowrap; }
  .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; padding: 12px 18px; border-radius: 6px; background: var(--ink); color: var(--stone); font-size: 15px; font-weight: 500; }

  .rule { position: absolute; left: 48px; right: 40px; top: 44px; border-top: 1px solid var(--line); }
  .art { position: absolute; left: 470px; top: 64px; width: 290px; height: 250px; border-radius: 6px; background: var(--clay); overflow: hidden; }
  .figure { position: absolute; left: 470px; top: 330px; width: 290px; display: grid; grid-template-columns: auto 1fr; column-gap: 18px; border-top: 1px solid var(--ink); padding-top: 12px; }
  .fig { font-family: var(--mono); font-size: 11px; color: var(--grey); padding-top: 3px; }
  .label { font-size: 13px; font-weight: 500; }
  .num { font-family: var(--serif); font-size: 40px; line-height: 1.1; letter-spacing: -0.01em; }
  .cap { font-size: 13px; color: var(--grey); }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="copy">
    <div class="eyebrow">Introducing Keep</div>
    <h1>Make something people keep</h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </span>
  </div>

  <!-- [Agent] Hand-drawn stand-in: a paper cut-out held by two loose ink loops; a noise displacement wobbles every stroke like a brush pen. -->
  <svg class="art" width="290" height="250" viewBox="0 0 290 250">
    <defs>
      <filter id="hand" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/></filter>
    </defs>
    <g filter="url(#hand)">
      <path d="M92 70 C 130 52 196 58 214 96 C 232 134 206 186 156 192 C 108 198 70 170 70 128 C 70 98 76 80 92 70 Z" fill="oklch(0.96 0.012 80)"/>
      <path d="M40 190 C 30 120 90 60 150 74 C 210 88 236 150 200 186 C 170 216 110 204 104 160 C 98 118 150 104 172 132 C 188 152 170 176 150 170" fill="none" stroke="oklch(0.20 0.01 60)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M150 170 C 136 166 132 150 142 144" fill="none" stroke="oklch(0.20 0.01 60)" stroke-width="6" stroke-linecap="round"/>
      <path d="M232 44 C 248 60 256 84 252 108" fill="none" stroke="oklch(0.20 0.01 60)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="58" cy="58" r="7" fill="oklch(0.20 0.01 60)"/>
      <circle cx="244" cy="206" r="4" fill="oklch(0.20 0.01 60)"/>
      <path d="M30 226 L74 226 M196 226 L262 226" stroke="oklch(0.20 0.01 60)" stroke-width="3" stroke-linecap="round"/>
    </g>
  </svg>

  <div class="figure">
    <div class="fig">Fig. 1</div>
    <div>
      <div class="label">Still in use</div>
      <div class="num">1,284</div>
      <div class="cap">projects made since 2019</div>
    </div>
  </div>
</body>
</html>
