<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Healthcare</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=block">
<style>
  :root {
    color-scheme: light;
    --white: oklch(0.99 0 0);
    --mist: oklch(0.96 0.015 200);
    --mist-2: oklch(0.92 0.03 195);
    --teal: oklch(0.52 0.09 195);
    --deep: oklch(0.30 0.05 230);
    --muted: oklch(0.45 0.03 230);
    --coral: oklch(0.72 0.12 30);
    --coral-soft: oklch(0.92 0.04 35);
    --shadow: 0 4px 16px oklch(0.30 0.05 230 / 0.10);
    --font: "Figtree", sans-serif;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
  body { position: relative; font-family: var(--font); color: var(--deep); }

  .copy { position: absolute; left: 52px; top: 76px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--mist); color: var(--teal); font-size: 14px; font-weight: 600; }
  h1 { font-weight: 700; font-size: 50px; line-height: 1.06; letter-spacing: -0.02em; margin: 20px 0 16px; }
  h1 span { color: var(--teal); }
  p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--muted); white-space: nowrap; }
  .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; padding: 15px 26px; border-radius: 999px; background: var(--teal); color: var(--white); font-size: 16px; font-weight: 600; }
  .assure { display: flex; gap: 10px; margin-top: 26px; }
  .assure span { width: 38px; height: 38px; border-radius: 50%; background: var(--mist); display: grid; place-items: center; }

  .panel { position: absolute; left: 470px; top: 36px; width: 300px; height: 428px; border-radius: 28px; background: var(--mist); overflow: hidden; }
  .card { position: absolute; left: 410px; top: 360px; display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px 16px 16px; border-radius: 16px; background: var(--white); box-shadow: var(--shadow); }
  .card .icon { width: 42px; height: 42px; border-radius: 12px; background: var(--coral-soft); display: grid; place-items: center; flex: none; }
  .card .label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .card .num { font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
  .card .cap { font-size: 13px; color: var(--muted); }
  .chip { position: absolute; left: 650px; top: 66px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 999px; background: var(--white); box-shadow: var(--shadow); }
  .chip i { display: block; height: 6px; width: 46px; border-radius: 3px; background: var(--mist-2); }
</style>
</head>
<body>
  <div class="copy">
    <span class="eyebrow">
      <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="var(--teal)"/><path d="m6 10.2 2.7 2.6L14 7.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Introducing Keep
    </span>
    <h1>Make something<br>people <span>keep</span></h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </span>
    <div class="assure">
      <span><svg width="18" height="20" viewBox="0 0 22 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linejoin="round"><path d="M11 2 3 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z"/><path d="m7.5 12 2.5 2.5 4.5-5" stroke-linecap="round"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
    </div>
  </div>

  <div class="panel">
    <!-- [Agent] Soft flat clinician illustration standing in for the category's smiling-doctor photo. -->
    <svg width="300" height="428" viewBox="0 0 300 428"><g transform="translate(0 -28)">
      <circle cx="160" cy="176" r="118" fill="var(--mist-2)"/>
      <circle cx="160" cy="176" r="84" fill="var(--coral-soft)"/>
      <path d="M40 470 C 44 330 90 296 160 292 C 230 296 276 330 280 470 Z" fill="var(--white)" stroke="var(--mist-2)" stroke-width="2"/>
      <path d="M128 296 L160 360 L192 296 C 180 292 140 292 128 296 Z" fill="var(--teal)"/>
      <path d="M128 296 L112 312 L150 392 L160 360 Z M192 296 L208 312 L170 392 L160 360 Z" fill="oklch(0.95 0.008 200)"/>
      <rect x="146" y="246" width="28" height="50" rx="12" fill="oklch(0.74 0.07 55)"/>
      <ellipse cx="160" cy="206" rx="46" ry="52" fill="oklch(0.80 0.07 60)"/>
      <path d="M112 206 C 106 150 140 136 166 140 C 196 144 214 166 208 206 C 204 184 190 172 172 170 C 150 168 124 178 112 206 Z" fill="var(--deep)"/>
      <circle cx="143" cy="210" r="3.2" fill="var(--deep)"/><circle cx="177" cy="210" r="3.2" fill="var(--deep)"/>
      <path d="M146 230 q14 11 28 0" fill="none" stroke="var(--deep)" stroke-width="3" stroke-linecap="round"/>
      <path d="M134 300 C 128 336 140 354 156 356 M186 300 C 192 336 178 354 162 356" fill="none" stroke="var(--deep)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="210" cy="356" r="9" fill="none" stroke="var(--deep)" stroke-width="3.5"/>
      <path d="M159 356 C 170 372 196 376 202 362" fill="none" stroke="var(--deep)" stroke-width="3.5" stroke-linecap="round"/>
    </g></svg>
  </div>

  <div class="chip">
    <svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="var(--mist)"/><path d="M6 13.5h3.5l2-4 3 8 2-4H20" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <i></i>
  </div>

  <div class="card">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 21s-9-5.6-9-12A5 5 0 0 1 12 6a5 5 0 0 1 9 3c0 6.4-9 12-9 12Z" fill="var(--coral)"/></svg></div>
    <div>
      <div class="label">Still in use</div>
      <div class="num">1,284</div>
      <div class="cap">projects made since 2019</div>
    </div>
  </div>
</body>
</html>
