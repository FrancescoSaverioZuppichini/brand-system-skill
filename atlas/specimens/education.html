<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Education</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=block">
<style>
  :root {
    color-scheme: light;
    --paper: oklch(0.98 0.005 90);
    --white: oklch(1 0 0);
    --primary: oklch(0.45 0.15 265);
    --primary-soft: oklch(0.93 0.03 265);
    --warm: oklch(0.78 0.14 75);
    --warm-soft: oklch(0.92 0.07 85);
    --green: oklch(0.62 0.14 150);
    --ink: oklch(0.25 0.02 265);
    --muted: oklch(0.45 0.02 265);
    --line: oklch(0.92 0.01 265);
    --shadow: 0 2px 4px oklch(0.25 0.02 265 / 0.05), 0 12px 28px oklch(0.25 0.02 265 / 0.10);
    --font: "Lexend", sans-serif;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--paper); }
  body { position: relative; font-family: var(--font); color: var(--ink); }

  .copy { position: absolute; left: 50px; top: 80px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--primary); }
  .eyebrow b { width: 28px; height: 28px; border-radius: 8px; background: var(--primary-soft); display: grid; place-items: center; }
  h1 { font-weight: 600; font-size: 46px; line-height: 1.12; letter-spacing: -0.02em; margin: 18px 0 16px; }
  /* [Agent] Marker-pen highlight: a gradient band under the lower half of the word. */
  h1 mark { color: inherit; background: linear-gradient(transparent 58%, var(--warm-soft) 58%, var(--warm-soft) 92%, transparent 92%); padding: 0 4px; margin: 0 -4px; }
  p { margin: 0; font-size: 14.5px; font-weight: 300; line-height: 1.65; color: var(--muted); white-space: nowrap; }
  .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; padding: 14px 24px; border-radius: 10px; background: var(--primary); color: var(--white); font-size: 15px; font-weight: 500; }

  .course { position: absolute; left: 468px; top: 40px; width: 290px; border-radius: 16px; background: var(--white); box-shadow: var(--shadow); overflow: hidden; }
  .cover { height: 104px; background: var(--primary); position: relative; overflow: hidden; }
  .body { padding: 16px 18px 18px; }
  .step { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .step i { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; box-sizing: border-box; }
  .step i.done { background: var(--green); }
  .step i.now { border: 3px solid var(--primary); }
  .step i.next { border: 2px solid var(--line); }
  .step s { height: 8px; border-radius: 4px; background: var(--line); }
  .progress { margin-top: 12px; height: 10px; border-radius: 999px; background: var(--line); }
  .progress div { width: 66%; height: 100%; border-radius: inherit; background: var(--green); }

  .stat { position: absolute; left: 426px; top: 336px; display: flex; gap: 14px; align-items: center; padding: 16px 22px 16px 16px; border-radius: 14px; background: var(--white); box-shadow: var(--shadow); }
  .stat .label { font-size: 12.5px; font-weight: 500; color: var(--primary); }
  .stat .num { font-size: 32px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
  .stat .cap { font-size: 12.5px; font-weight: 300; color: var(--muted); }
</style>
</head>
<body>
  <div class="copy">
    <span class="eyebrow"><b><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M1.5 9 12 4l10.5 5L12 14Z"/><path d="M6 11.2V16c3.5 2.6 8.5 2.6 12 0v-4.8M21 9.5v6"/></svg></b>Introducing Keep</span>
    <h1>Make something<br>people <mark>keep</mark></h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </span>
  </div>

  <div class="course">
    <div class="cover">
      <svg width="290" height="104" viewBox="0 0 290 104">
        <circle cx="236" cy="30" r="44" fill="var(--warm)"/>
        <rect x="160" y="54" width="70" height="70" rx="8" fill="oklch(0.62 0.14 150)" transform="rotate(-12 195 89)"/>
        <path d="M20 104 L70 40 L120 104 Z" fill="oklch(0.60 0.13 265)"/>
        <circle cx="70" cy="26" r="7" fill="var(--white)"/>
        <path d="M250 88 h28 M250 96 h18" stroke="var(--white)" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="body">
      <div class="step"><i class="done"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 6.2 2.3 2.3 4.7-5"/></svg></i><s style="width:150px"></s></div>
      <div class="step"><i class="done"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 6.2 2.3 2.3 4.7-5"/></svg></i><s style="width:120px"></s></div>
      <div class="step"><i class="now"></i><s style="width:170px; background: var(--primary-soft)"></s></div>
      <div class="step"><i class="next"></i><s style="width:100px"></s></div>
      <div class="progress"><div></div></div>
    </div>
  </div>

  <div class="stat">
    <svg width="40" height="52" viewBox="0 0 40 52"><path d="M10 26 4 50l9-5 5 7 5-22Z" fill="var(--primary)"/><path d="M30 26l6 24-9-5-5 7-5-22Z" fill="oklch(0.55 0.15 265)"/><circle cx="20" cy="20" r="18" fill="var(--warm)"/><circle cx="20" cy="20" r="12" fill="none" stroke="oklch(0.95 0.06 85)" stroke-width="2"/><path d="m20 12 2.4 5 5.4.6-4 3.7 1.1 5.3-4.9-2.7-4.9 2.7 1.1-5.3-4-3.7 5.4-.6Z" fill="oklch(0.97 0.04 85)"/></svg>
    <div>
      <div class="label">Still in use</div>
      <div class="num">1,284</div>
      <div class="cap">projects made since 2019</div>
    </div>
  </div>
</body>
</html>
