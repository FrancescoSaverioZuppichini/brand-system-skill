<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel 8-bit</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&family=VT323&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --night: oklch(0.22 0.05 280);
  --panel: oklch(0.30 0.08 270);
  --red: oklch(0.60 0.22 20);
  --yellow: oklch(0.90 0.17 100);
  --green: oklch(0.72 0.18 145);
  --blue: oklch(0.60 0.15 255);
  --white: oklch(0.97 0 0);
  --orange: oklch(0.75 0.16 60);
  --brown: oklch(0.45 0.08 50);
  --dirt: oklch(0.38 0.06 45);
  --skin: oklch(0.85 0.06 60);
  --display: "Press Start 2P", monospace;
  --ui: "Silkscreen", monospace;
  --text: "VT323", monospace;
  /* [Agent] A border drawn with four offset shadows leaves the corner pixels empty, which gives the stepped pixel corner. */
  --pixel-border: 0 -4px 0 0 var(--white), 0 4px 0 0 var(--white), -4px 0 0 0 var(--white), 4px 0 0 0 var(--white);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--night); }
body { position: relative; font-family: var(--text); color: var(--white); -webkit-font-smoothing: none; }
body > * { position: absolute; margin: 0; }
svg { shape-rendering: crispEdges; image-rendering: pixelated; }

.dots { inset: 0 0 64px; opacity: .55;
  background: radial-gradient(var(--white) 0 0) 92px 70px / 4px 4px no-repeat, radial-gradient(var(--white) 0 0) 380px 40px / 4px 4px no-repeat,
    radial-gradient(var(--white) 0 0) 452px 120px / 4px 4px no-repeat, radial-gradient(var(--white) 0 0) 700px 168px / 4px 4px no-repeat,
    radial-gradient(var(--white) 0 0) 600px 300px / 4px 4px no-repeat, radial-gradient(var(--white) 0 0) 744px 260px / 4px 4px no-repeat,
    radial-gradient(var(--white) 0 0) 480px 228px / 4px 4px no-repeat; }
.star { width: 20px; } .s1 { left: 428px; top: 60px; } .s2 { left: 664px; top: 216px; } .s3 { left: 540px; top: 176px; }
.hearts { left: 40px; top: 32px; display: flex; gap: 8px; }
.hearts svg { width: 28px; position: static; }

.eyebrow { left: 40px; top: 104px; font: 16px/1 var(--display); color: var(--yellow); }
h1 { left: 40px; top: 140px; font: 32px/48px var(--display); text-shadow: 4px 4px 0 var(--red); }
.dialog { left: 44px; top: 264px; width: 488px; padding: 12px 16px 14px; background: var(--panel); box-shadow: var(--pixel-border);
  font-size: 20px; line-height: 24px; }
.dialog::after { content: ""; position: absolute; right: 12px; bottom: 8px; border: 6px solid transparent; border-top: 8px solid var(--yellow); border-bottom: 0; }
.cursor { left: 40px; top: 382px; width: 20px; }
.cta { left: 76px; top: 372px; padding: 12px 16px; background: var(--red); color: var(--white); text-decoration: none; font: 16px/16px var(--display);
  box-shadow: 0 -4px 0 0 var(--white), 0 4px 0 0 var(--white), -4px 0 0 0 var(--white), 4px 0 0 0 var(--white), 0 12px 0 0 oklch(0.15 0.04 280); }

.card { left: 528px; top: 28px; width: 220px; padding: 12px 14px; background: var(--panel); box-shadow: var(--pixel-border); }
.card .label { display: block; font: 16px/16px var(--ui); color: var(--green); }
.card .row { display: flex; align-items: center; gap: 12px; margin: 10px 0 8px; }
.card .row svg { width: 32px; }
.card .num { font: 24px/24px var(--display); color: var(--yellow); }
.card .cap { display: block; font-size: 20px; line-height: 20px; }

.hero { left: 592px; top: 376px; width: 48px; }
.chest { left: 668px; top: 396px; width: 56px; }
.coin { width: 32px; } .c1 { left: 680px; top: 328px; } .c2 { left: 724px; top: 300px; }
.ground { left: 0; bottom: 0; width: 800px; height: 64px; }
</style>
</head>
<body>
<div class="dots"></div>
<svg class="star s1" viewBox="0 0 5 5"><path fill="var(--yellow)" d="M2 0h1v1h-1zM1 1h3v1h-3zM0 2h5v1h-5zM1 3h3v1h-3zM2 4h1v1h-1z"/></svg>
<svg class="star s2" viewBox="0 0 5 5"><path fill="var(--yellow)" d="M2 0h1v1h-1zM1 1h3v1h-3zM0 2h5v1h-5zM1 3h3v1h-3zM2 4h1v1h-1z"/></svg>
<svg class="star s3" viewBox="0 0 5 5"><path fill="var(--white)" d="M2 0h1v1h-1zM0 2h5v1h-5zM2 4h1v1h-1zM2 1h1v3h-1z"/></svg>

<div class="hearts" aria-hidden="true">
  <svg viewBox="0 0 7 6"><path fill="var(--red)" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"/><path fill="var(--white)" d="M1 1h1v1h-1z"/></svg>
  <svg viewBox="0 0 7 6"><path fill="var(--red)" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"/><path fill="var(--white)" d="M1 1h1v1h-1z"/></svg>
  <svg viewBox="0 0 7 6"><path fill="var(--panel)" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"/></svg>
</div>

<p class="eyebrow">INTRODUCING KEEP</p>
<h1>MAKE SOMETHING<br>PEOPLE KEEP</h1>
<p class="dialog">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<svg class="cursor" viewBox="0 0 5 7"><path fill="var(--yellow)" d="M0 0h1v7h-1zM1 1h1v5h-1zM2 2h1v3h-1zM3 3h1v1h-1z"/></svg>
<a class="cta" href="#">START A PROJECT</a>

<aside class="card">
  <span class="label">Still in use</span>
  <span class="row">
    <svg viewBox="0 0 8 8"><path fill="var(--brown)" d="M2 0h4v1h-4zM1 1h1v1h-1zM6 1h1v1h-1zM0 2h1v4h-1zM7 2h1v4h-1zM1 6h1v1h-1zM6 6h1v1h-1zM2 7h4v1h-4z"/><path fill="var(--yellow)" d="M2 1h4v1h-4zM1 2h6v4h-6zM2 6h4v1h-4z"/><path fill="var(--white)" d="M3 2h1v4h-1z"/></svg>
    <span class="num">1,284</span>
  </span>
  <span class="cap">projects made since 2019</span>
</aside>

<svg class="hero" viewBox="0 0 12 15" aria-hidden="true"><path fill="var(--red)" d="M4 0h5v1h-5zM3 1h7v1h-7zM2 2h10v1h-10z"/><path fill="var(--brown)" d="M3 3h2v1h-2zM3 4h1v1h-1zM2 14h3v1h-3zM7 14h3v1h-3z"/><path fill="var(--skin)" d="M5 3h5v1h-5zM4 4h1v1h-1zM6 4h2v1h-2zM9 4h1v1h-1zM3 5h7v1h-7zM4 6h5v1h-5zM1 9h2v2h-2zM9 9h2v2h-2z"/><path fill="var(--night)" d="M5 4h1v1h-1zM8 4h1v1h-1zM3 11h6v1h-6zM3 12h2v2h-2zM7 12h2v2h-2z"/><path fill="var(--blue)" d="M3 7h7v1h-7zM2 8h9v1h-9zM3 9h2v1h-2zM7 9h2v1h-2zM4 10h4v1h-4z"/><path fill="var(--yellow)" d="M5 9h2v1h-2z"/></svg>
<svg class="chest" viewBox="0 0 14 10" aria-hidden="true"><path fill="var(--brown)" d="M2 0h10v1h-10zM1 1h1v1h-1zM12 1h1v1h-1zM0 2h1v7h-1zM13 2h1v7h-1zM1 4h5v1h-5zM8 4h5v1h-5zM1 9h12v1h-12z"/><path fill="var(--orange)" d="M2 1h10v1h-10zM1 2h12v2h-12zM1 5h5v4h-5zM8 5h5v4h-5z"/><path fill="var(--yellow)" d="M6 4h2v3h-2z"/></svg>
<svg class="coin c1" viewBox="0 0 8 8" aria-hidden="true"><path fill="var(--brown)" d="M2 0h4v1h-4zM1 1h1v1h-1zM6 1h1v1h-1zM0 2h1v4h-1zM7 2h1v4h-1zM1 6h1v1h-1zM6 6h1v1h-1zM2 7h4v1h-4z"/><path fill="var(--yellow)" d="M2 1h4v1h-4zM1 2h6v4h-6zM2 6h4v1h-4z"/><path fill="var(--white)" d="M3 2h1v4h-1z"/></svg>
<svg class="coin c2" viewBox="0 0 8 8" aria-hidden="true"><path fill="var(--brown)" d="M2 0h4v1h-4zM1 1h1v1h-1zM6 1h1v1h-1zM0 2h1v4h-1zM7 2h1v4h-1zM1 6h1v1h-1zM6 6h1v1h-1zM2 7h4v1h-4z"/><path fill="var(--yellow)" d="M2 1h4v1h-4zM1 2h6v4h-6zM2 6h4v1h-4z"/><path fill="var(--white)" d="M3 2h1v4h-1z"/></svg>

<svg class="ground" viewBox="0 0 200 16" aria-hidden="true">
  <defs><pattern id="tile" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="var(--dirt)"/>
    <path fill="var(--green)" d="M0 0h16v3h-16zM1 3h2v1h-2zM5 3h1v1h-1zM9 3h2v1h-2zM13 3h1v1h-1z"/>
    <path fill="oklch(0.85 0.16 140)" d="M0 0h16v1h-16z"/>
    <path fill="oklch(0.28 0.05 40)" d="M4 8h1v1h-1zM11 6h1v1h-1zM7 12h2v1h-2zM13 11h1v1h-1zM2 13h1v1h-1zM0 15h16v1h-16z"/>
  </pattern></defs>
  <rect width="200" height="16" fill="url(#tile)"/>
</svg>
</body>
</html>
