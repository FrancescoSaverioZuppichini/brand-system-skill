<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memphis</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Sans:wght@400;500;700&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --white: oklch(0.98 0.005 90);
  --pink: oklch(0.80 0.10 355);
  --mint: oklch(0.87 0.09 165);
  --yellow: oklch(0.90 0.15 100);
  --cobalt: oklch(0.50 0.20 262);
  --black: oklch(0.18 0 0);
  --display: "Unbounded", sans-serif;
  --text: "DM Sans", sans-serif;
  --hard: 4px 4px 0 var(--black);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
body { position: relative; font-family: var(--text); color: var(--black); }
.confetti { position: absolute; inset: 0; }

.copy { position: absolute; left: 58px; top: 56px; width: 470px; }
.eyebrow { display: inline-block; margin: 0; padding: 6px 14px; background: var(--pink); border: 2.5px solid var(--black); border-radius: 999px; font: 700 13px var(--text); letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 18px 0 0; font: 800 50px/1.14 var(--display); letter-spacing: -.02em; }
h1 em { display: inline-block; margin-top: 10px; line-height: 1; font-style: normal; background: var(--mint); padding: 0 8px 4px; box-shadow: var(--hard); border: 2.5px solid var(--black); }
.sub { margin: 22px 0 0; font: 500 16px/1.5 var(--text); }
.button {
  margin-top: 22px; padding: 13px 24px; border: 2.5px solid var(--black); border-radius: 0; background: var(--cobalt); color: var(--white);
  font: 500 15px var(--display); box-shadow: var(--hard);
}

.card {
  position: absolute; left: 556px; top: 268px; width: 176px; padding: 0 0 14px; background: var(--yellow);
  border: 2.5px solid var(--black); box-shadow: 6px 6px 0 var(--black); transform: rotate(-4deg);
}
/* [Agent] Card header is a Memphis stripe laminate: one repeating gradient, no image. */
.card .stripes { height: 18px; border-bottom: 2.5px solid var(--black); background: repeating-linear-gradient(90deg, var(--black) 0 4px, var(--white) 4px 10px); }
.card .label { margin: 12px 16px 0; font: 700 12px var(--text); letter-spacing: .1em; text-transform: uppercase; }
.card .num { margin: 2px 16px 0; font: 800 40px/1.1 var(--display); }
.card .cap { margin: 2px 16px 0; font: 400 13px var(--text); }
</style>
</head>
<body>
  <svg class="confetti" viewBox="0 0 800 500" aria-hidden="true">
    <defs>
      <!-- [Agent] Terrazzo: a pink slab with scattered chips, tiled once; the chips are plain polygons in the palette. -->
      <pattern id="terrazzo" width="80" height="80" patternUnits="userSpaceOnUse">
        <rect width="80" height="80" fill="var(--pink)"/>
        <g stroke="none">
          <polygon points="8,10 18,6 16,16" fill="var(--black)"/><polygon points="44,8 54,14 46,20" fill="var(--cobalt)"/>
          <polygon points="64,40 74,36 72,48" fill="var(--yellow)"/><polygon points="20,50 30,46 28,58 18,58" fill="var(--mint)"/>
          <polygon points="50,62 58,60 56,70" fill="var(--black)"/><polygon points="6,70 12,66 14,74" fill="var(--cobalt)"/>
          <circle cx="36" cy="34" r="2.5" fill="var(--black)"/><circle cx="70" cy="18" r="2" fill="var(--white)"/>
        </g>
      </pattern>
      <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.6" fill="var(--black)"/></pattern>
    </defs>
    <circle cx="690" cy="120" r="92" fill="var(--pink)" stroke="var(--black)" stroke-width="2.5"/>
    <rect x="616" y="40" width="140" height="70" fill="url(#dots)"/>
    <path d="M520 60 q15 -30 30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="var(--black)" stroke-width="7" stroke-linecap="round"/>
    <polygon points="560,210 610,150 640,224" fill="var(--yellow)" stroke="var(--black)" stroke-width="2.5"/>
    <rect x="-20" y="410" width="250" height="110" fill="url(#terrazzo)" stroke="var(--black)" stroke-width="2.5" transform="rotate(-6 100 460)"/>
    <path d="M0 500 A92 92 0 0 1 184 500" fill="var(--mint)" stroke="var(--black)" stroke-width="2.5" transform="translate(300 0)"/>
    <path d="M500 448 l20 -22 l20 22 l20 -22 l20 22 l20 -22 l20 22" fill="none" stroke="var(--cobalt)" stroke-width="7" stroke-linejoin="miter"/>
    <g fill="var(--black)">
      <rect x="470" y="20" width="26" height="6" transform="rotate(30 483 23)"/>
      <rect x="760" y="300" width="26" height="6" transform="rotate(-40 773 303)"/>
      <rect x="28" y="30" width="22" height="6" transform="rotate(60 39 33)"/>
      <rect x="470" y="300" width="18" height="6" transform="rotate(-20 479 303)"/>
    </g>
    <g stroke="var(--black)" stroke-width="2">
      <polygon points="748,436 768,426 764,450" fill="var(--cobalt)"/>
      <polygon points="12,240 30,232 26,254" fill="var(--yellow)"/>
      <circle cx="510" cy="248" r="8" fill="var(--mint)"/>
      <circle cx="770" cy="236" r="6" fill="var(--yellow)"/>
    </g>
    <path d="M36 140 q8 -12 16 0 t16 0 t16 0" fill="none" stroke="var(--cobalt)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 52 140) translate(-40 -30)"/>
  </svg>

  <div class="copy">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something people <em>keep</em></h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <button class="button">Start a project</button>
  </div>

  <div class="card">
    <div class="stripes"></div>
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
  </div>
</body>
</html>
