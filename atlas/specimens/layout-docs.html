<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Documentation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(100% 0 0);
  --surface: oklch(97.6% 0.003 255);
  --line: oklch(91.5% 0.005 255);
  --fill: oklch(93% 0.005 255);
  --fill-2: oklch(87.5% 0.007 255);
  --text: oklch(23% 0.012 255);
  --muted: oklch(52% 0.012 255);
  --accent: oklch(56% 0.2 260);
  --accent-soft: oklch(95.5% 0.025 260);
  --radius: 8px;
  --sans: "Inter", sans-serif;
  --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body { display: grid; grid-template-rows: 48px 1fr; color: var(--text); font-family: var(--sans); }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--fill); }
p { margin: 0; }

.top { display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.logo { width: 20px; height: 20px; border-radius: 6px; background: var(--text); }
.tag { font-size: 12px; font-weight: 500; color: var(--muted); }
.search { display: flex; align-items: center; gap: 8px; width: 220px; height: 28px; margin-left: 40px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.search::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--fill-2); }
.search::after { content: ""; width: 70px; height: 6px; border-radius: 3px; background: var(--fill-2); }
.top .bar { width: 40px; background: var(--fill-2); }
.top .bar:first-of-type { margin-left: auto; }

/* [Agent] The three reading columns: navigation tree, one article at a readable measure, and the on-page contents. */
.docs { display: grid; grid-template-columns: 172px 1fr 150px; min-height: 0; }

.nav { padding: 20px 16px 0 24px; border-right: 1px solid var(--line); display: grid; gap: 11px; align-content: start; }
.nav .h { height: 6px; border-radius: 3px; background: var(--fill-2); margin-top: 10px; }
.nav .h:first-child { margin-top: 0; }
.tree { display: grid; gap: 11px; padding-left: 10px; border-left: 1px solid var(--line); }
.tree .on { position: relative; background: var(--accent); opacity: 0.55; }
.tree .on::before { content: ""; position: absolute; left: -11px; top: -6px; width: 1.5px; height: 18px; background: var(--accent); }

.article { padding: 22px 32px 0; overflow: hidden; }
.eyebrow { font: 500 11px/1 var(--mono); color: var(--accent); }
h1 { margin: 10px 0 10px; font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; }
.sub { font-size: 13.5px; line-height: 1.6; color: oklch(38% 0.012 255); }

.callout { margin: 16px 0; padding: 10px 14px; border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; background: var(--accent-soft); display: flex; align-items: baseline; gap: 10px; }
.label { font-size: 11.5px; font-weight: 600; color: var(--accent); }
.num { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.cap { font-size: 11.5px; color: var(--muted); }

.code { padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 9px; font: 12px/1 var(--mono); }
.ln { display: flex; align-items: center; gap: 8px; }
.ln span { height: 6px; border-radius: 3px; }
.p { color: var(--muted); }
.k { background: var(--accent); opacity: 0.6; }
.s { background: oklch(65% 0.13 150); opacity: 0.7; }
.v { background: var(--fill-2); }

.para { margin-top: 20px; display: grid; gap: 10px; }
.para .h2 { width: 34%; height: 10px; margin-bottom: 4px; border-radius: 4px; background: var(--fill-2); }
.next { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--line); }
.btn { padding: 8px 14px; border-radius: 6px; background: var(--accent); color: white; font-size: 12.5px; font-weight: 500; }

.toc { padding: 22px 20px 0 0; display: grid; gap: 10px; align-content: start; }
.toc .head { width: 60%; height: 6px; margin-bottom: 4px; border-radius: 3px; background: var(--fill-2); }
.toc .bar { margin-left: 12px; }
.toc .on { position: relative; background: var(--accent); opacity: 0.55; }
.toc .on::before { content: ""; position: absolute; left: -12px; top: -5px; width: 2px; height: 16px; background: var(--accent); }
.toc .sub-item { margin-left: 22px; }
</style>
</head>
<body>
<header class="top">
  <span class="logo"></span><span class="tag">Docs</span>
  <span class="search"></span>
  <span class="bar"></span><span class="bar"></span>
</header>

<div class="docs">
  <nav class="nav" aria-hidden="true">
    <span class="h" style="width:60%"></span>
    <div class="tree"><span class="bar on" style="width:70%"></span><span class="bar" style="width:84%"></span><span class="bar" style="width:56%"></span></div>
    <span class="h" style="width:50%"></span>
    <div class="tree"><span class="bar" style="width:76%"></span><span class="bar" style="width:62%"></span><span class="bar" style="width:88%"></span><span class="bar" style="width:52%"></span></div>
    <span class="h" style="width:66%"></span>
    <div class="tree"><span class="bar" style="width:64%"></span><span class="bar" style="width:80%"></span><span class="bar" style="width:58%"></span></div>
    <span class="h" style="width:44%"></span>
    <div class="tree"><span class="bar" style="width:72%"></span><span class="bar" style="width:60%"></span></div>
  </nav>

  <article class="article">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>

    <div class="callout">
      <p class="label">Still in use</p>
      <p class="num">1,284</p>
      <p class="cap">projects made since 2019</p>
    </div>

    <div class="code" aria-hidden="true">
      <div class="ln"><b class="p">$</b><span class="k" style="width:40px"></span><span class="v" style="width:90px"></span><span class="s" style="width:120px"></span></div>
      <div class="ln"><b class="p">&nbsp;</b><span class="v" style="width:24px"></span><span class="k" style="width:56px"></span><span class="v" style="width:70px"></span></div>
      <div class="ln"><b class="p">&nbsp;</b><span class="v" style="width:24px"></span><span class="s" style="width:150px"></span></div>
    </div>

    <div class="para" aria-hidden="true">
      <span class="bar h2"></span>
      <span class="bar"></span><span class="bar" style="width:94%"></span><span class="bar" style="width:68%"></span>
    </div>

    <div class="next">
      <span class="bar" style="width:120px"></span>
      <span class="btn">Start a project</span>
    </div>
  </article>

  <aside class="toc" aria-hidden="true">
    <span class="head"></span>
    <span class="bar on" style="width:70%"></span>
    <span class="bar" style="width:56%"></span>
    <span class="bar sub-item" style="width:48%"></span>
    <span class="bar sub-item" style="width:40%"></span>
    <span class="bar" style="width:64%"></span>
    <span class="bar" style="width:46%"></span>
  </aside>
</div>
</body>
</html>
