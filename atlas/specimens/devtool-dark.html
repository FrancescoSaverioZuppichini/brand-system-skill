<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dev-tool dark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: dark;
  --bg: oklch(0.14 0.005 270);
  --surface: oklch(0.19 0.006 270);
  --border: oklch(0.28 0.008 270);
  --text: oklch(0.96 0.003 270);
  --muted: oklch(0.65 0.01 270);
  --accent: oklch(0.70 0.15 265);
  --sans: "Geist", "Inter", sans-serif;
  --mono: "Geist Mono", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body { position: relative; font-family: var(--sans); color: var(--text); text-align: center; }
p, h1 { margin: 0; }
svg { display: block; }

/* [Agent] A faint grid faded out by a radial mask, plus one accent glow at 15% behind the headline. */
.grid {
  position: absolute; inset: 0;
  background: linear-gradient(oklch(1 0 0 / .05) 1px, transparent 1px) 0 0 / 48px 48px, linear-gradient(90deg, oklch(1 0 0 / .05) 1px, transparent 1px) 0 0 / 48px 48px;
  -webkit-mask-image: radial-gradient(60% 70% at 50% 30%, black, transparent);
}
.glow { position: absolute; left: 150px; top: -160px; width: 500px; height: 380px; border-radius: 50%; background: radial-gradient(closest-side, oklch(0.70 0.15 265 / .26), transparent); }

nav { position: relative; height: 56px; padding: 0 28px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid oklch(1 0 0 / .08); font: 600 15px/1 var(--sans); }
nav .mark { width: 20px; height: 20px; border-radius: 5px; background: var(--text); display: grid; place-items: center; }
nav kbd { margin-left: auto; padding: 4px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font: 500 11px/1 var(--mono); color: var(--muted); }

.hero { position: relative; padding-top: 40px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border: 1px solid var(--border); border-radius: 999px; background: oklch(0.19 0.006 270 / .7); font: 500 13px/1 var(--sans); color: var(--muted); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
h1 {
  margin: 20px 0 14px; font: 600 54px/1.02 var(--sans); letter-spacing: -.045em;
  background: linear-gradient(180deg, var(--text) 30%, oklch(0.70 0.01 270)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { font: 400 16px/1.55 var(--sans); color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; height: 40px; padding: 0 16px; border-radius: 8px; background: var(--text); color: var(--bg); font: 500 14px/1 var(--sans); }

/* Product screenshot peeking up from the bottom edge */
.shot {
  position: absolute; left: 90px; right: 90px; top: 392px; height: 200px; border-radius: 12px; text-align: left;
  border: 1px solid var(--border); background: var(--surface);
  box-shadow: 0 -20px 60px oklch(0.70 0.15 265 / .12), inset 0 1px 0 oklch(1 0 0 / .06);
  display: grid; grid-template-columns: 120px 1fr 1fr; gap: 12px; padding: 14px; box-sizing: border-box;
}
.side { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.side b { height: 8px; border-radius: 4px; background: oklch(1 0 0 / .08); }
.side b.on { background: oklch(1 0 0 / .18); }
.card { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 12px 14px; }
.card .label { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card .num { margin: 10px 0 4px; font: 600 26px/1 var(--sans); letter-spacing: -.03em; }
.card .cap { font: 400 12px/1.3 var(--sans); color: var(--muted); }
.card.chart { display: flex; align-items: flex-start; padding-top: 20px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <nav>
    <span class="mark"><svg width="10" height="10"><path d="M1 1h3v8H1zM5 5l4-4M5 5l4 4" stroke="oklch(0.14 0.005 270)" stroke-width="2" fill="none"/></svg></span>
    Keep
    <kbd>⌘K</kbd>
  </nav>

  <main class="hero">
    <span class="pill"><i></i>Introducing Keep<svg width="12" height="12"><path d="M4 2l4 4-4 4" fill="none" stroke="oklch(0.65 0.01 270)" stroke-width="1.5"/></svg></span>
    <h1>Make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <a class="btn">Start a project<svg width="14" height="14"><path d="M2 7h10M8 3l4 4-4 4" fill="none" stroke="oklch(0.14 0.005 270)" stroke-width="1.6"/></svg></a>
  </main>

  <section class="shot">
    <div class="side"><b class="on" style="width:80%"></b><b style="width:60%"></b><b style="width:70%"></b><b style="width:50%"></b></div>
    <div class="card">
      <p class="label">Still in use</p>
      <p class="num">1,284</p>
      <p class="cap">projects made since 2019</p>
    </div>
    <div class="card chart">
      <svg width="100%" height="70" viewBox="0 0 200 70" preserveAspectRatio="none">
        <defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.70 0.15 265 / .35)"/><stop offset="1" stop-color="oklch(0.70 0.15 265 / 0)"/></linearGradient></defs>
        <path d="M0 62 L25 58 L50 54 L75 50 L100 40 L125 36 L150 24 L175 18 L200 6 L200 70 L0 70Z" fill="url(#f)"/>
        <path d="M0 62 L25 58 L50 54 L75 50 L100 40 L125 36 L150 24 L175 18 L200 6" fill="none" stroke="oklch(0.70 0.15 265)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
  </section>
</body>
</html>
