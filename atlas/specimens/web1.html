<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web 1.0 / GeoCities</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Comic+Neue:wght@700&family=VT323&display=block">
<style>
:root {
  color-scheme: dark;
  --page: oklch(0.20 0.08 270);
  --link: oklch(0.45 0.30 264);
  --visited: oklch(0.45 0.22 320);
  --yellow: oklch(0.95 0.16 105);
  --lime: oklch(0.87 0.29 142);
  --silver: oklch(0.80 0 0);
  --white: oklch(1 0 0);
  --black: oklch(0 0 0);
  --red: oklch(0.63 0.25 29);
  --serif: "Libre Caslon Text", "Times New Roman", serif;
  --comic: "Comic Neue", "Comic Sans MS", cursive;
  --counter: "VT323", monospace;
  /* [Agent] A 120px tile of stars, repeated like a 1997 background GIF. */
  --stars: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='white'><circle cx='12' cy='18' r='1'/><circle cx='70' cy='9' r='.8'/><circle cx='101' cy='44' r='1.3'/><circle cx='33' cy='77' r='.9'/><circle cx='88' cy='96' r='1.1'/><circle cx='54' cy='52' r='.7'/><circle cx='8' cy='108' r='1.2'/><circle cx='112' cy='112' r='.6'/></g><path d='M60 22l2 6 6 2-6 2-2 6-2-6-6-2 6-2z' fill='%23ffff66'/><path d='M22 44l1 3 3 1-3 1-1 3-1-3-3-1 3-1z' fill='%2399ffff'/></svg>");
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--page); }
body { background: var(--stars) var(--page); font: 400 17px/1.35 var(--serif); color: var(--white); text-align: center; }
p, h1 { margin: 0; }

.marquee {
  margin: 30px auto 0; width: 560px; height: 26px; overflow: hidden; white-space: nowrap;
  background: var(--black); border: 2px inset var(--silver);
  font: 700 18px/26px var(--comic); color: var(--lime); text-align: left;
}
.marquee span { display: inline-block; padding-left: 150px; }
h1 {
  margin: 20px 0 12px; font: 700 52px/1.02 var(--serif); color: var(--yellow);
  text-shadow: 3px 3px 0 var(--red);
}
h1 .spark { display: inline-block; vertical-align: middle; margin: 0 6px; }
.sub { font-size: 18px; }
.sub a { color: var(--yellow); }
/* [Agent] The "rainbow line" GIF every homepage used instead of an hr. */
.rainbow { margin: 24px auto; width: 600px; height: 6px; background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, magenta, red); }

table { margin: 0 auto; border-collapse: separate; border: 3px outset var(--silver); background: var(--silver); color: var(--black); }
td { border: 2px inset var(--silver); padding: 8px 14px; vertical-align: middle; }
.label { font: 700 16px/1 var(--comic); color: var(--visited); }
.digits { display: inline-flex; gap: 2px; margin: 6px 0 4px; padding: 3px; background: var(--black); }
.digits b { width: 22px; height: 32px; background: oklch(0.18 0 0); font: 400 34px/32px var(--counter); color: var(--lime); }
.digits b.comma { width: 10px; }
.cap { font-size: 14px; font-style: italic; }
.btn {
  display: inline-block; padding: 6px 14px; background: var(--silver);
  border: 3px outset var(--white); font: 700 17px/1 var(--serif); color: var(--link); text-decoration: underline;
}

.construction {
  position: absolute; left: 0; right: 0; bottom: 0; height: 18px;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, var(--black) 14px 28px);
  border-top: 2px solid var(--black);
}
</style>
</head>
<body>
  <div class="marquee"><span>*~*~* Introducing Keep *~*~* Introducing Keep *~*~*</span></div>

  <h1>
    <svg class="spark" width="30" height="30" viewBox="0 0 30 30"><path d="M15 0l3 11 12 4-12 4-3 11-3-11L0 15l12-4z" fill="#ffff66"/><circle cx="15" cy="15" r="3" fill="white"/></svg>Make something<br>people keep<svg class="spark" width="30" height="30" viewBox="0 0 30 30"><path d="M15 0l3 11 12 4-12 4-3 11-3-11L0 15l12-4z" fill="#ffff66"/><circle cx="15" cy="15" r="3" fill="white"/></svg>
  </h1>
  <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>

  <div class="rainbow"></div>

  <table>
    <tr>
      <td>
        <p class="label">Still in use</p>
        <div class="digits"><b>1</b><b class="comma">,</b><b>2</b><b>8</b><b>4</b></div>
        <p class="cap">projects made since 2019</p>
      </td>
      <td class="btn-cell">
        <span class="btn">Start a project</span>
      </td>
    </tr>
  </table>

  <div class="construction"></div>
</body>
</html>
