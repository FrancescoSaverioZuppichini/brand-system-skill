<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neumorphism</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=block">
<style>
:root {
  color-scheme: light;
  --base: oklch(0.92 0.01 250);
  --light: oklch(0.99 0.005 250);
  --dark: oklch(0.78 0.015 250);
  --text: oklch(0.40 0.02 250);
  --text-soft: oklch(0.55 0.02 250);
  --accent: oklch(0.58 0.16 255);
  --sans: "Nunito", sans-serif;
  /* [Agent] One light source at the top-left: every raised shape gets a light shadow up-left and a dark one down-right; pressed shapes get the same pair inset. */
  --raised: -8px -8px 16px var(--light), 8px 8px 16px var(--dark);
  --raised-sm: -4px -4px 8px var(--light), 4px 4px 8px var(--dark);
  --pressed: inset -5px -5px 10px var(--light), inset 5px 5px 10px var(--dark);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--base); }
body { position: relative; font-family: var(--sans); color: var(--text); }
p, h1 { margin: 0; }
svg { display: block; }

.hero { position: absolute; left: 56px; top: 74px; width: 424px; }
.eyebrow { display: inline-block; padding: 10px 18px; border-radius: 999px; box-shadow: var(--pressed); font: 700 13px/1 var(--sans); letter-spacing: .06em; color: var(--accent); }
h1 { margin: 26px 0 16px; font: 800 44px/1.1 var(--sans); letter-spacing: -.01em; color: var(--text); }
.sub { font: 600 15px/1.6 var(--sans); color: var(--text-soft); }
.actions { margin-top: 34px; display: flex; align-items: center; gap: 22px; }
.btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 26px; border-radius: 999px; box-shadow: var(--raised); font: 800 16px/1 var(--sans); color: var(--accent); }
.round { width: 52px; height: 52px; border-radius: 50%; box-shadow: var(--raised-sm); display: grid; place-items: center; }
.round.pressed { box-shadow: var(--pressed); }

.dial-card { position: absolute; left: 488px; top: 56px; width: 260px; height: 388px; border-radius: 36px; box-shadow: var(--raised); text-align: center; }
.dial-card .label { margin-top: 30px; font: 800 13px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); }
.dial { position: relative; margin: 24px auto 0; width: 190px; height: 190px; border-radius: 50%; box-shadow: var(--raised); display: grid; place-items: center; }
.dial .well { width: 150px; height: 150px; border-radius: 50%; box-shadow: var(--pressed); display: grid; place-items: center; }
.dial svg { position: absolute; inset: 0; }
.num { font: 800 34px/1 var(--sans); color: var(--text); }
.dial-card .cap { margin-top: 26px; font: 600 14px/1.4 var(--sans); color: var(--text-soft); }
.toggle { margin: 22px auto 0; width: 76px; height: 34px; border-radius: 999px; box-shadow: var(--pressed); position: relative; }
.toggle::after { content: ""; position: absolute; right: 5px; top: 5px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); box-shadow: 2px 2px 5px var(--dark), -1px -1px 3px var(--light); }
</style>
</head>
<body>
  <section class="hero">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <div class="actions">
      <a class="btn">Start a project<svg width="16" height="16"><path d="M2 8h11M9 3.5L13.5 8 9 12.5" fill="none" stroke="oklch(0.58 0.16 255)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <span class="round"><svg width="20" height="20"><path d="M10 17s-7-4.2-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 17 8c0 4.8-7 9-7 9z" fill="none" stroke="oklch(0.55 0.02 250)" stroke-width="2" stroke-linejoin="round"/></svg></span>
      <span class="round pressed"><svg width="20" height="20"><path d="M4 10l4 4 8-9" fill="none" stroke="oklch(0.58 0.16 255)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  </section>

  <aside class="dial-card">
    <p class="label">Still in use</p>
    <div class="dial">
      <svg width="190" height="190" viewBox="0 0 190 190"><circle cx="95" cy="95" r="84" fill="none" stroke="oklch(0.58 0.16 255)" stroke-width="6" stroke-linecap="round" stroke-dasharray="380 528" transform="rotate(-90 95 95)"/></svg>
      <div class="well"><p class="num">1,284</p></div>
    </div>
    <p class="cap">projects made since 2019</p>
    <div class="toggle"></div>
  </aside>
</body>
</html>
