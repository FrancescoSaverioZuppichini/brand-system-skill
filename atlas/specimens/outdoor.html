<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outdoor / utilitarian</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500&family=Space+Mono:wght@400;700&display=block">
<style>
  :root {
    color-scheme: light;
    --canvas: oklch(0.93 0.02 90);
    --olive: oklch(0.45 0.06 120);
    --olive-deep: oklch(0.36 0.05 120);
    --granite: oklch(0.30 0.01 250);
    --orange: oklch(0.68 0.19 45);
    --khaki: oklch(0.75 0.05 90);
    --sky: oklch(0.80 0.05 230);
    --display: "Barlow Condensed", sans-serif;
    --text: "Barlow", sans-serif;
    --mono: "Space Mono", monospace;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--canvas); }
  body { position: relative; font-family: var(--text); color: var(--granite); }
  #topo-layer { position: absolute; inset: 0; }

  .patch { position: absolute; left: 46px; top: 40px; width: 74px; height: 50px; border-radius: 4px; background: var(--olive); display: grid; place-items: center; }
  .patch::after { content: ""; position: absolute; inset: 4px; border: 1.5px dashed var(--khaki); border-radius: 2px; }

  .copy { position: absolute; left: 46px; top: 118px; }
  .eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  .eyebrow i { width: 10px; height: 10px; background: var(--orange); }
  h1 { font-family: var(--display); font-weight: 800; font-size: 66px; line-height: 0.9; text-transform: uppercase; letter-spacing: 0.005em; margin: 14px 0 18px; }
  h1 span { color: var(--orange); }
  p { margin: 0; font-size: 16px; line-height: 1.5; white-space: nowrap; }
  .cta { display: inline-flex; align-items: center; gap: 12px; margin-top: 24px; padding: 13px 22px; border-radius: 3px; background: var(--granite); color: var(--canvas); font-family: var(--display); font-weight: 600; font-size: 19px; letter-spacing: 0.08em; text-transform: uppercase; outline: 1.5px dashed oklch(0.93 0.02 90 / 0.5); outline-offset: -5px; }
  .cta i { width: 10px; height: 10px; background: var(--orange); }

  .photo { position: absolute; left: 484px; top: 40px; width: 276px; height: 300px; border-radius: 3px; overflow: hidden; }
  .tag { position: absolute; left: 508px; top: 292px; width: 172px; padding: 30px 16px 14px; background: var(--khaki); border-radius: 4px 4px 4px 4px; transform: rotate(-4deg); clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%, 0 18px); }
  .tag::before { content: ""; position: absolute; left: 50%; top: 10px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--canvas); box-shadow: 0 0 0 2px var(--granite); }
  .tag::after { content: ""; position: absolute; inset: 4px; border: 1.5px dashed oklch(0.30 0.01 250 / 0.45); clip-path: inherit; }
  .tag .label { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding-bottom: 6px; border-bottom: 1.5px solid var(--granite); }
  .tag .num { font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 1; margin-top: 6px; }
  .tag .cap { font-family: var(--mono); font-size: 10.5px; line-height: 1.4; margin-top: 4px; }
</style>
</head>
<body>
  <svg id="topo-layer" width="800" height="500"><g id="topo" fill="none" stroke="oklch(0.30 0.01 250)" stroke-opacity="0.16" stroke-width="1"></g></svg>

  <div class="patch">
    <svg width="40" height="24" viewBox="0 0 40 24"><path d="M1 23 14 4l7 10 5-6 13 15Z" fill="var(--canvas)"/><path d="M14 4l3.5 5-2 2-1.5-2-2 2-1.5-1Z" fill="var(--olive)"/></svg>
  </div>

  <div class="copy">
    <div class="eyebrow"><i></i>Introducing Keep</div>
    <h1>Make something<br>people <span>keep</span></h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta"><i></i>Start a project</span>
  </div>

  <!-- [Agent] Landscape-photo stand-in: layered ridgelines in the palette, haze toward the back. -->
  <svg class="photo" width="276" height="300" viewBox="0 0 290 300" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.74 0.06 235)"/><stop offset="1" stop-color="oklch(0.90 0.03 80)"/></linearGradient></defs>
    <rect width="290" height="300" fill="url(#sky)"/>
    <circle cx="210" cy="92" r="20" fill="oklch(0.95 0.05 80)"/>
    <path d="M0 170 L46 120 L80 146 L130 82 L176 136 L214 110 L290 168 V300 H0Z" fill="oklch(0.66 0.03 240)"/>
    <path d="M130 82 L146 100 L136 104 L128 96 L118 106 Z" fill="oklch(0.95 0.01 240)"/>
    <path d="M0 210 L60 160 L104 196 L160 150 L230 204 L290 182 V300 H0Z" fill="oklch(0.50 0.04 150)"/>
    <path d="M0 250 L50 222 L120 252 L190 214 L290 256 V300 H0Z" fill="var(--olive-deep)"/>
    <g fill="oklch(0.28 0.03 140)">
      <path d="M30 300 L40 254 L50 300Z M46 300 L58 240 L70 300Z M220 300 L232 248 L244 300Z M240 300 L250 262 L260 300Z"/>
    </g>
  </svg>

  <div class="tag">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
  </div>

  <script>
    // [Agent] Topographic contours: wobbly concentric rings around two off-canvas summits, drawn once at load.
    const ring = (cx, cy, r, k, ph) => {
      let d = "";
      for (let i = 0; i <= 140; i++) {
        const t = i / 140 * Math.PI * 2;
        const w = 1 + 0.16 * Math.sin(2 * t + ph + k * 0.13) + 0.1 * Math.sin(3 * t + ph * 2 + k * 0.09) + 0.05 * Math.sin(5 * t + ph * 3);
        d += (i ? "L" : "M") + (cx + r * w * Math.cos(t)).toFixed(1) + " " + (cy + 0.8 * r * w * Math.sin(t)).toFixed(1);
      }
      return `<path d="${d}Z"/>`;
    };
    let out = "";
    for (let k = 1; k <= 16; k++) out += ring(170, 470, k * 32, k, 1.2);
    for (let k = 1; k <= 12; k++) out += ring(720, 70, k * 28, k, 4.1);
    document.getElementById("topo").innerHTML = out;
  </script>
</body>
</html>
