<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fluent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(0.97 0.003 250);
  --surface: oklch(1 0 0);
  --text: oklch(0.24 0.005 250);
  --text-2: oklch(0.45 0.005 250);
  --brand: oklch(0.53 0.16 252);
  --brand-dark: oklch(0.45 0.15 255);
  --stroke: oklch(0.88 0.005 250);
  --sans: "Noto Sans", "Segoe UI Variable", "Segoe UI", sans-serif;
  --noise: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.06'/></svg>");
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: oklch(0.80 0.08 245); }
body { position: relative; font: 400 14px/1.45 var(--sans); color: var(--text); }
p, h1 { margin: 0; }
svg { display: block; }

/* Windows 11 "Bloom" style wallpaper */
.wall { position: absolute; inset: 0; }

/* [Agent] Mica: an almost-opaque window that picks up a heavily blurred tint of the wallpaper behind it. */
.window {
  position: absolute; left: 30px; top: 22px; width: 590px; height: 406px; border-radius: 8px; overflow: hidden;
  background: oklch(0.95 0.012 245 / .84); backdrop-filter: blur(70px) saturate(1.4);
  box-shadow: 0 0 0 1px oklch(0 0 0 / .1), 0 10px 32px oklch(0.2 0.05 250 / .28), 0 2px 6px oklch(0 0 0 / .12);
}
.titlebar { height: 40px; display: flex; align-items: center; gap: 10px; padding-left: 14px; font-size: 12px; }
.titlebar .caps { margin-left: auto; display: flex; height: 100%; }
.titlebar .caps i { width: 46px; display: grid; place-items: center; }
.nav { position: absolute; left: 0; top: 40px; bottom: 0; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; }
.nav i { position: relative; width: 40px; height: 36px; border-radius: 4px; display: grid; place-items: center; }
.nav i.on { background: oklch(0 0 0 / .045); }
.nav i.on::before { content: ""; position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--brand); }
/* Content layer sits on Mica with a lighter fill and a hairline */
.layer {
  position: absolute; left: 52px; top: 40px; right: 0; bottom: 0; border-radius: 8px 0 0 0; padding: 30px 32px;
  background: oklch(1 0 0 / .55); box-shadow: inset 1px 1px 0 oklch(0 0 0 / .06);
}
.eyebrow { font: 600 12px/1 var(--sans); color: var(--brand); }
h1 { margin: 10px 0 10px; font: 600 38px/1.15 var(--sans); letter-spacing: -.01em; }
.sub { color: var(--text-2); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; height: 32px; padding: 0 14px; border-radius: 4px;
  background: var(--brand); color: white; font: 600 14px/1 var(--sans);
  box-shadow: inset 0 -1px 0 var(--brand-dark), 0 0 0 1px oklch(0 0 0 / .04);
}
.cards { margin-top: 28px; display: flex; gap: 8px; }
.cards .c { flex: 1; height: 58px; border-radius: 8px; background: var(--surface); box-shadow: 0 0 0 1px var(--stroke), 0 1px 2px oklch(0 0 0 / .06); display: flex; align-items: center; gap: 12px; padding: 0 14px; }
.cards .c b { display: block; height: 7px; border-radius: 4px; background: oklch(0.90 0.004 250); }

/* [Agent] Acrylic flyout: more transparent than Mica, blurs what's directly under it and adds a faint noise so it reads as a material. */
.toast {
  position: absolute; left: 540px; top: 238px; width: 236px; padding: 14px 16px 18px; box-sizing: border-box; border-radius: 8px;
  background: var(--noise), oklch(0.97 0.006 245 / .72); backdrop-filter: blur(30px) saturate(1.5);
  box-shadow: 0 0 0 1px oklch(0 0 0 / .08), inset 0 1px 0 oklch(1 0 0 / .7), 0 16px 32px oklch(0.15 0.05 250 / .28), 0 2px 6px oklch(0 0 0 / .1);
}
.toast .head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
.toast .label { margin-top: 14px; font: 600 14px/1 var(--sans); }
.toast .num { margin: 8px 0 4px; font: 600 34px/1 var(--sans); letter-spacing: -.01em; color: var(--brand-dark); }
.toast .cap { font-size: 13px; color: var(--text-2); }

.taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px;
  background: oklch(0.95 0.01 245 / .78); backdrop-filter: blur(40px) saturate(1.4); box-shadow: 0 -1px 0 oklch(1 0 0 / .5);
}
.taskbar i { position: relative; width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; }
.taskbar i.on { background: oklch(1 0 0 / .6); box-shadow: 0 0 0 1px oklch(0 0 0 / .05); }
.taskbar i.on::after { content: ""; position: absolute; bottom: 2px; left: 13px; width: 14px; height: 3px; border-radius: 2px; background: var(--brand); }
.tray { position: absolute; right: 14px; top: 0; bottom: 0; display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
  <svg class="wall" width="800" height="500" viewBox="0 0 800 500">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.88 0.05 230)"/><stop offset="1" stop-color="oklch(0.70 0.11 255)"/></linearGradient>
      <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.75 0.13 245)"/><stop offset="1" stop-color="oklch(0.40 0.20 262)"/></linearGradient>
      <filter id="b"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <rect width="800" height="500" fill="url(#sky)"/>
    <g filter="url(#b)" transform="translate(560 300)" opacity=".95">
      <ellipse rx="70" ry="230" fill="url(#p)" transform="rotate(-60)"/>
      <ellipse rx="70" ry="230" fill="url(#p)" transform="rotate(-20)"/>
      <ellipse rx="70" ry="230" fill="url(#p)" transform="rotate(20)"/>
      <ellipse rx="70" ry="230" fill="url(#p)" transform="rotate(60)" opacity=".85"/>
      <ellipse rx="60" ry="200" fill="oklch(0.85 0.08 230)" transform="rotate(0)" opacity=".7"/>
    </g>
  </svg>

  <section class="window">
    <div class="titlebar">
      <svg width="16" height="16"><rect x="1" y="1" width="14" height="14" rx="3" fill="oklch(0.53 0.16 252)"/><path d="M5 4v8M5 8l5-4M5 8l5 4" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      Keep
      <span class="caps">
        <i><svg width="10" height="10"><path d="M0 5.5h10" stroke="oklch(0.24 0.005 250)"/></svg></i>
        <i><svg width="10" height="10"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="oklch(0.24 0.005 250)"/></svg></i>
        <i><svg width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="oklch(0.24 0.005 250)"/></svg></i>
      </span>
    </div>
    <nav class="nav">
      <i><svg width="16" height="16"><path d="M1 3.5h14M1 8h14M1 12.5h14" stroke="oklch(0.24 0.005 250)" stroke-width="1.2"/></svg></i>
      <i class="on"><svg width="16" height="16"><path d="M2 7L8 2l6 5v7H2z" fill="none" stroke="oklch(0.24 0.005 250)" stroke-width="1.2" stroke-linejoin="round"/></svg></i>
      <i><svg width="16" height="16"><rect x="1.5" y="3" width="13" height="11" rx="2" fill="none" stroke="oklch(0.24 0.005 250)" stroke-width="1.2"/><path d="M1.5 6.5h13" stroke="oklch(0.24 0.005 250)" stroke-width="1.2"/></svg></i>
      <i><svg width="16" height="16"><circle cx="8" cy="5.5" r="3" fill="none" stroke="oklch(0.24 0.005 250)" stroke-width="1.2"/><path d="M2.5 14.5c0-3 2.5-4.5 5.5-4.5s5.5 1.5 5.5 4.5" fill="none" stroke="oklch(0.24 0.005 250)" stroke-width="1.2"/></svg></i>
    </nav>
    <div class="layer">
      <p class="eyebrow">Introducing Keep</p>
      <h1>Make something<br>people keep</h1>
      <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
      <a class="btn"><svg width="14" height="14"><path d="M7 1v12M1 7h12" stroke="white" stroke-width="1.5"/></svg>Start a project</a>
      <div class="cards">
        <div class="c"><svg width="20" height="20"><rect x="2" y="3" width="16" height="14" rx="3" fill="oklch(0.92 0.05 252)"/><path d="M6 8h8M6 12h5" stroke="oklch(0.53 0.16 252)" stroke-width="1.5" stroke-linecap="round"/></svg><div style="flex:1"><b style="width:70%"></b><b style="width:45%;margin-top:7px"></b></div></div>
        <div class="c"><svg width="20" height="20"><circle cx="10" cy="10" r="8" fill="oklch(0.92 0.06 150)"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="oklch(0.50 0.13 150)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div style="flex:1"><b style="width:60%"></b><b style="width:80%;margin-top:7px"></b></div></div>
      </div>
    </div>
  </section>

  <aside class="toast">
    <div class="head"><svg width="16" height="16"><rect x="1" y="1" width="14" height="14" rx="3" fill="oklch(0.53 0.16 252)"/><path d="M5 4v8M5 8l5-4M5 8l5 4" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>Keep</div>
    <p class="label">Still in use</p>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
  </aside>

  <footer class="taskbar">
    <i><svg width="22" height="22"><rect x="1" y="1" width="9.5" height="9.5" rx="1" fill="oklch(0.58 0.16 245)"/><rect x="11.5" y="1" width="9.5" height="9.5" rx="1" fill="oklch(0.62 0.15 240)"/><rect x="1" y="11.5" width="9.5" height="9.5" rx="1" fill="oklch(0.55 0.17 250)"/><rect x="11.5" y="11.5" width="9.5" height="9.5" rx="1" fill="oklch(0.60 0.16 245)"/></svg></i>
    <i><svg width="20" height="20"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="oklch(0.24 0.005 250)" stroke-width="1.6"/><path d="M13 13l5 5" stroke="oklch(0.24 0.005 250)" stroke-width="1.6"/></svg></i>
    <i><svg width="22" height="20"><path d="M1 4h7l2 2h11v13H1z" fill="oklch(0.85 0.14 85)"/><path d="M1 8h20v11H1z" fill="oklch(0.90 0.12 90)"/></svg></i>
    <i class="on"><svg width="22" height="22"><rect x="1" y="1" width="20" height="20" rx="4" fill="oklch(0.53 0.16 252)"/><path d="M7 5v12M7 11l7-6M7 11l7 6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg></i>
    <i><svg width="22" height="22"><circle cx="11" cy="11" r="10" fill="oklch(0.62 0.17 155)"/><circle cx="11" cy="11" r="4" fill="white"/></svg></i>
    <span class="tray">
      <svg width="16" height="14" viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.6a3.4 3.4 0 0 0-4.8 0zM3.3 6.6a6.6 6.6 0 0 1 9.4 0l1.6-1.7a9 9 0 0 0-12.6 0z" fill="oklch(0.24 0.005 250)"/></svg>
      <svg width="16" height="14"><path d="M1 5h3l4-4v12L4 9H1z" fill="oklch(0.24 0.005 250)"/><path d="M11 4a4 4 0 0 1 0 6" fill="none" stroke="oklch(0.24 0.005 250)" stroke-width="1.3"/></svg>
      <svg width="22" height="12"><rect x=".5" y=".5" width="19" height="11" rx="2.5" fill="none" stroke="oklch(0.24 0.005 250)"/><rect x="2" y="2" width="13" height="8" rx="1.2" fill="oklch(0.24 0.005 250)"/><rect x="20.5" y="4" width="1.2" height="4" fill="oklch(0.24 0.005 250)"/></svg>
    </span>
  </footer>
</body>
</html>
