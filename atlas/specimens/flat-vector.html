<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flat vector illustration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@600;700&display=block">
<style>
:root {
  color-scheme: light;
  --white: oklch(0.99 0 0);
  --primary: oklch(0.55 0.17 265);
  --primary-tint: oklch(0.94 0.03 265);
  --coral: oklch(0.72 0.15 35);
  --yellow: oklch(0.87 0.14 90);
  --ink: oklch(0.27 0.04 265);
  --skin: oklch(0.72 0.08 55);
  --muted: oklch(0.50 0.03 265);
  --line: oklch(0.91 0.01 265);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
body { font-family: "DM Sans", sans-serif; color: var(--ink); position: relative; }

.copy { position: absolute; left: 52px; top: 96px; width: 306px; }
.eyebrow { font: 500 12px/1 "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
h1 { font: 700 42px/1.05 "Outfit", sans-serif; letter-spacing: -.02em; margin: 16px 0 18px; }
p { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 28px; }
.btn { display: inline-block; background: var(--primary); color: var(--white); font-weight: 500; font-size: 15px; padding: 13px 22px; border-radius: 8px; }

.art { position: absolute; right: 6px; top: 30px; width: 430px; height: 430px; }

.card { position: absolute; right: 44px; bottom: 34px; width: 168px; background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; box-shadow: 0 6px 0 var(--primary-tint); }
.card small { font: 500 11px/1 "DM Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--coral); }
.card b { display: block; font: 700 30px/1 "Outfit", sans-serif; margin: 8px 0 4px; }
.card span { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="copy">
  <div class="eyebrow">Introducing Keep</div>
  <h1>Make something people keep</h1>
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn">Start a project</span>
</div>

<svg class="art" viewBox="0 0 430 430" aria-hidden="true">
  <path fill="var(--primary-tint)" d="M214 46c88-4 170 52 182 140 12 84-36 178-128 200-96 22-210-6-234-98C10 196 104 52 214 46z"/>
  <circle cx="360" cy="86" r="26" fill="var(--yellow)"/>
  <path fill="var(--coral)" d="M44 120a30 30 0 0 1 60 0z"/>
  <g fill="var(--primary)"><circle cx="120" cy="60" r="4"/><circle cx="136" cy="60" r="4"/><circle cx="152" cy="60" r="4"/><circle cx="120" cy="76" r="4"/><circle cx="136" cy="76" r="4"/><circle cx="152" cy="76" r="4"/></g>

  <rect x="268" y="128" width="88" height="66" rx="6" fill="var(--white)"/>
  <path fill="var(--primary)" d="M276 186l26-30 18 18 12-12 16 24z"/>
  <circle cx="334" cy="148" r="7" fill="var(--yellow)"/>

  <ellipse cx="222" cy="398" rx="170" ry="10" fill="var(--line)"/>

  <rect x="168" y="150" width="112" height="170" rx="22" fill="var(--coral)"/>
  <rect x="213" y="182" width="22" height="26" rx="6" fill="var(--skin)"/>
  <rect x="180" y="200" width="88" height="110" rx="34" fill="var(--yellow)"/>
  <circle cx="224" cy="164" r="25" fill="var(--skin)"/>
  <path fill="var(--ink)" d="M198 162a26 26 0 0 1 52 0c-6-10-16-15-26-15s-20 5-26 15z"/>
  <circle cx="224" cy="132" r="12" fill="var(--ink)"/>
  <path d="M194 236q-26 34 12 58" stroke="var(--yellow)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M254 236q26 34-12 58" stroke="var(--yellow)" stroke-width="22" stroke-linecap="round" fill="none"/>

  <rect x="166" y="226" width="116" height="74" rx="7" fill="var(--ink)"/>
  <circle cx="224" cy="262" r="8" fill="var(--white)" opacity=".9"/>
  <rect x="80" y="298" width="300" height="14" rx="7" fill="var(--primary)"/>
  <rect x="104" y="312" width="12" height="86" rx="6" fill="var(--primary)"/>
  <rect x="344" y="312" width="12" height="86" rx="6" fill="var(--primary)"/>

  <rect x="314" y="268" width="24" height="30" rx="5" fill="var(--coral)"/>
  <path d="M338 276h4a8 8 0 0 1 0 16h-4" stroke="var(--coral)" stroke-width="5" fill="none"/>

  <path fill="var(--coral)" d="M30 336h56l-8 62H38z"/>
  <path d="M58 336V230" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <g fill="var(--primary)">
    <path d="M58 300c-30-4-40-26-36-44 22 2 36 20 36 44z"/>
    <path d="M58 280c26-6 36-30 30-48-22 6-32 26-30 48z"/>
    <path d="M58 248c-22-10-26-32-18-46 18 8 24 28 18 46z"/>
    <path d="M58 232c14-14 14-34 4-44-12 12-12 30-4 44z"/>
  </g>
</svg>

<div class="card">
  <small>Still in use</small>
  <b>1,284</b>
  <span>projects made since 2019</span>
</div>
</body>
</html>
