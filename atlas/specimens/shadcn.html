<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadcn-minimal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=block">
<style>
:root {
  color-scheme: light;
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --border: oklch(0.922 0 0);
  --radius: 0.625rem;
  --sans: "Geist", "Inter", sans-serif;
  --mono: "Geist Mono", monospace;
  --shadow-xs: 0 1px 2px 0 oklch(0 0 0 / .05);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--background); }
body { position: relative; font: 400 14px/1.5 var(--sans); color: var(--foreground); -webkit-font-smoothing: antialiased; }
p, h1 { margin: 0; }
svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

header { height: 56px; padding: 0 32px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
header .logo { width: 24px; height: 24px; border-radius: 6px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; }
.search { margin-left: auto; width: 220px; height: 32px; padding: 0 6px 0 10px; box-sizing: border-box; border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); box-shadow: var(--shadow-xs); display: flex; align-items: center; color: var(--muted-foreground); }
.search kbd { margin-left: auto; padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--muted); font: 500 11px/1.4 var(--sans); }
.icon-btn { width: 32px; height: 32px; border-radius: calc(var(--radius) - 2px); display: grid; place-items: center; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--muted); border: 1px solid var(--border); }

.hero { position: absolute; left: 32px; top: 124px; width: 390px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px); font: 500 12px/1.4 var(--sans); }
h1 { margin: 16px 0 12px; font: 600 42px/1.1 var(--sans); letter-spacing: -.025em; }
.lead { font-size: 16px; line-height: 1.6; color: var(--muted-foreground); }
.btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; height: 36px; padding: 0 16px; border-radius: calc(var(--radius) - 2px); background: var(--primary); color: var(--primary-foreground); font: 500 14px/1 var(--sans); box-shadow: var(--shadow-xs); }

.card { position: absolute; left: 472px; width: 296px; box-sizing: border-box; border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); background: var(--background); box-shadow: var(--shadow-xs); }
.stat { top: 116px; padding: 22px 24px; }
.stat .head { display: flex; align-items: center; justify-content: space-between; font: 500 14px/1 var(--sans); }
.stat .head svg { color: var(--muted-foreground); }
.stat .num { margin-top: 8px; font: 700 30px/1.2 var(--sans); letter-spacing: -.02em; }
.stat .cap { font-size: 12px; color: var(--muted-foreground); }
.bars { margin-top: 18px; height: 64px; display: flex; align-items: flex-end; gap: 6px; }
.bars i { flex: 1; border-radius: 4px 4px 0 0; background: var(--primary); }
.bars i.m { background: oklch(0.87 0 0); }
.skel { top: 356px; padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
.skel .ph { width: 40px; height: 40px; border-radius: 50%; background: var(--muted); }
.skel b { display: block; height: 10px; border-radius: 6px; background: var(--muted); }
.switch { margin-left: auto; width: 32px; height: 18px; border-radius: 9px; background: var(--primary); position: relative; }
.switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--background); }
</style>
</head>
<body>
  <header>
    <span class="logo"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 3v18M5 12l11-9M5 12l11 9"/></svg></span>
    Keep
    <span class="search"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><kbd>⌘K</kbd></span>
    <span class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></span>
    <span class="avatar"></span>
  </header>

  <section class="hero">
    <span class="badge">Introducing Keep<svg width="12" height="12" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    <h1>Make something<br>people keep</h1>
    <p class="lead">Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
    <a class="btn">Start a project<svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </section>

  <div class="card stat">
    <div class="head">Still in use<svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg></div>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
    <div class="bars"><i class="m" style="height:30%"></i><i class="m" style="height:45%"></i><i class="m" style="height:38%"></i><i class="m" style="height:60%"></i><i class="m" style="height:52%"></i><i class="m" style="height:74%"></i><i class="m" style="height:68%"></i><i style="height:100%"></i></div>
  </div>
  <div class="card skel">
    <span class="ph"></span>
    <div style="flex:1"><b style="width:70%"></b><b style="width:45%;margin-top:8px"></b></div>
    <span class="switch"></span>
  </div>
</body>
</html>
