<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glassmorphism</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=block">
<style>
:root {
  color-scheme: dark;
  --base: oklch(0.28 0.08 285);
  --violet: oklch(0.60 0.22 300);
  --cyan: oklch(0.78 0.13 210);
  --pink: oklch(0.72 0.18 350);
  --glass: oklch(1 0 0 / 0.14);
  --glass-strong: oklch(1 0 0 / 0.22);
  --edge: oklch(1 0 0 / 0.30);
  --white: oklch(1 0 0);
  --soft: oklch(1 0 0 / 0.75);
  --sans: "Plus Jakarta Sans", sans-serif;
  --mono: "DM Mono", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--base); }
body { position: relative; font-family: var(--sans); color: var(--white); }
p, h1 { margin: 0; }

.blob { position: absolute; border-radius: 50%; filter: blur(30px); }
.b1 { left: -40px; top: -60px; width: 340px; height: 340px; background: var(--violet); }
.b2 { left: 330px; top: 250px; width: 360px; height: 300px; background: var(--pink); opacity: .9; }
.b3 { left: 560px; top: -40px; width: 300px; height: 280px; background: var(--cyan); opacity: .85; }
/* [Agent] Hard-edged spheres sit half behind the glass, so the frosting shows as a blurred copy of a sharp shape. */
.orb { position: absolute; border-radius: 50%; }
.o1 { left: 396px; top: 40px; width: 150px; height: 150px; background: radial-gradient(circle at 32% 28%, oklch(0.95 0.06 210), var(--cyan) 35%, oklch(0.50 0.18 270) 95%); }
.o2 { left: 30px; top: 348px; width: 110px; height: 110px; background: radial-gradient(circle at 32% 28%, oklch(0.95 0.06 350), var(--pink) 38%, oklch(0.45 0.20 310) 95%); }

.glass {
  position: absolute; border-radius: 22px; background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.3);
  box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 oklch(1 0 0 / .45), 0 24px 48px oklch(0.15 0.08 285 / .35);
}
.main { left: 64px; top: 78px; width: 452px; padding: 34px 36px 36px; box-sizing: border-box; }
.eyebrow { display: inline-block; padding: 7px 14px; border-radius: 999px; background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--edge); font: 600 12px/1 var(--sans); letter-spacing: .04em; }
h1 { margin: 18px 0 14px; font: 800 44px/1.05 var(--sans); letter-spacing: -.03em; }
.sub { font: 400 15px/1.55 var(--sans); color: var(--soft); }
.btn { display: inline-block; margin-top: 26px; padding: 14px 24px; border-radius: 14px; background: var(--white); color: var(--base); font: 700 15px/1 var(--sans); box-shadow: 0 8px 24px oklch(0.15 0.08 285 / .35); }

.stat { left: 488px; top: 262px; width: 240px; padding: 22px 24px; box-sizing: border-box; border-radius: 20px; background: oklch(1 0 0 / .18); }
.stat .label { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
.stat .num { margin: 12px 0 6px; font: 800 44px/1 var(--sans); letter-spacing: -.03em; }
.stat .cap { font: 500 13px/1.4 var(--sans); color: var(--soft); }
.stat .bar { margin-top: 16px; height: 6px; border-radius: 3px; background: oklch(1 0 0 / .18); overflow: hidden; }
.stat .bar i { display: block; width: 72%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
</style>
</head>
<body>
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <i class="orb o1"></i><i class="orb o2"></i>

  <section class="glass main">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <a class="btn">Start a project</a>
  </section>

  <aside class="glass stat">
    <p class="label">Still in use</p>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
    <div class="bar"><i></i></div>
  </aside>
</body>
</html>
