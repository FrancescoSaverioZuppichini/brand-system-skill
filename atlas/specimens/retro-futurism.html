<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retro-futurism</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Jost:wght@400;500&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --cream: oklch(0.93 0.035 85);
  --orange: oklch(0.66 0.18 45);
  --avocado: oklch(0.60 0.10 115);
  --navy: oklch(0.28 0.06 260);
  --brown: oklch(0.40 0.06 55);
  --screen: oklch(0.22 0.05 260);
  --wide: "Michroma", sans-serif;
  --sans: "Jost", sans-serif;
  --mono: "Space Mono", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cream); }
body { position: relative; font-family: var(--sans); color: var(--navy); }
body > * { position: absolute; margin: 0; }

.stripes { left: 0; top: 0; width: 800px; height: 500px; }
.eyebrow { left: 46px; top: 74px; font: 700 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--brown); }
.eyebrow b { color: var(--orange); }
h1 { left: 44px; top: 104px; font: 400 31px/1.3 var(--wide); text-transform: uppercase; letter-spacing: .02em; }
.sub { left: 46px; top: 208px; font-size: 16px; line-height: 1.55; color: var(--brown); }
.cta { left: 46px; top: 290px; padding: 14px 24px; border-radius: 14px; background: var(--orange); color: var(--cream);
  font: 400 11px/1 var(--wide); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }

.crt { left: 578px; top: 58px; width: 196px; height: 176px; box-sizing: border-box; padding: 14px; border-radius: 28px; background: var(--navy);
  box-shadow: inset 0 -6px 0 oklch(0.20 0.05 260); }
.crt svg { display: block; width: 100%; height: 100%; border-radius: 22px / 26px; background: radial-gradient(circle at 50% 45%, oklch(0.28 0.06 255), var(--screen)); }
.card { left: 578px; top: 258px; width: 196px; box-sizing: border-box; padding: 16px 16px; border: 2px solid var(--navy); border-radius: 18px; background: var(--cream); }
.card .label { display: block; font: 700 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--orange); }
.card .num { display: block; margin: 8px 0 4px; font: 400 30px/1 var(--wide); }
.card .cap { font: 400 10.5px/1.3 var(--mono); color: var(--brown); }
/* [Agent] Print grain: grey fractal noise multiplied over the whole page, so every flat fill looks offset-printed. */
.grain { inset: 0; width: 800px; height: 500px; mix-blend-mode: multiply; opacity: .22; pointer-events: none; }
</style>
</head>
<body>
<svg class="stripes" viewBox="0 0 800 500" fill="none" stroke-width="12" aria-hidden="true">
  <path d="M0 474 H500 A64 64 0 0 0 564 410 V0" stroke="var(--brown)"/>
  <path d="M0 458 H500 A48 48 0 0 0 548 410 V0" stroke="var(--orange)"/>
  <path d="M0 442 H500 A32 32 0 0 0 532 410 V0" stroke="oklch(0.78 0.14 75)"/>
  <path d="M0 426 H500 A16 16 0 0 0 516 410 V0" stroke="var(--avocado)"/>
</svg>

<p class="eyebrow"><b>No. 01</b> &nbsp;Introducing Keep</p>
<h1>Make something<br>people keep</h1>
<p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<a class="cta" href="#">Start a project</a>

<div class="crt"><svg viewBox="0 0 168 148" aria-hidden="true">
  <g stroke="oklch(0.66 0.18 45 / .25)" stroke-width="1"><path d="M0 37H168M0 74H168M0 111H168M42 0V148M84 0V148M126 0V148"/></g>
  <g fill="none" stroke="var(--orange)" stroke-width="1.6">
    <ellipse cx="84" cy="74" rx="70" ry="26" transform="rotate(-18 84 74)"/>
    <ellipse cx="84" cy="74" rx="46" ry="16" transform="rotate(-18 84 74)" stroke-dasharray="3 4"/>
    <path d="M84 60 V40 M84 40 l-4 6 M84 40 l4 6" stroke-width="1.2"/></g>
  <circle cx="84" cy="74" r="13" fill="var(--orange)"/>
  <circle cx="148" cy="54" r="4.5" fill="var(--cream)"/>
  <circle cx="44" cy="91" r="3" fill="oklch(0.78 0.14 75)"/>
</svg></div>

<aside class="card">
  <span class="label">Still in use</span>
  <span class="num">1,284</span>
  <span class="cap">projects made since 2019</span>
</aside>

<svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</body>
</html>
