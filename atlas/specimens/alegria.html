<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corporate Memphis (Alegria)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(0.97 0.025 60);
  --lilac: oklch(0.62 0.15 295);
  --peach: oklch(0.84 0.08 50);
  --teal: oklch(0.72 0.10 190);
  --yellow: oklch(0.88 0.14 90);
  --navy: oklch(0.30 0.07 265);
  --orange-skin: oklch(0.68 0.14 45);
  --white: oklch(0.995 0 0);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body { font-family: "Poppins", sans-serif; color: var(--navy); position: relative; }

.copy { position: absolute; left: 52px; top: 70px; width: 360px; }
.eyebrow { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--lilac); background: var(--white); padding: 6px 12px; border-radius: 99px; }
h1 { font-size: 37px; font-weight: 700; line-height: 1.12; letter-spacing: -.02em; margin: 18px 0 14px; }
p { font-size: 14px; line-height: 1.65; margin: 0 0 26px; opacity: .8; max-width: 320px; }
.btn { display: inline-block; background: var(--lilac); color: var(--white); font-weight: 600; font-size: 14px; padding: 13px 26px; border-radius: 99px; }

.art { position: absolute; right: 0; bottom: 0; width: 440px; height: 480px; }

.card { position: absolute; left: 52px; bottom: 34px; display: flex; align-items: center; gap: 14px; background: var(--white); border-radius: 18px; padding: 12px 18px 12px 12px; }
.card i { width: 40px; height: 40px; border-radius: 12px; background: var(--teal); }
.card small { display: block; font-size: 11px; font-weight: 500; opacity: .6; }
.card b { font-size: 22px; font-weight: 700; margin-right: 6px; }
.card span { font-size: 11px; }
</style>
</head>
<body>
<div class="copy">
  <span class="eyebrow">Introducing Keep</span>
  <h1>Make something people keep</h1>
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn">Start a project</span>
</div>

<!-- [Agent] The Alegria recipe: heads about 1/11 of the body, long rubbery limbs drawn as fat round-capped strokes, non-human skin, people dwarfed by a giant phone. -->
<svg class="art" viewBox="0 0 440 480" aria-hidden="true">
  <path fill="var(--peach)" d="M40 470c-10-90 50-150 150-160s210 20 240 90l10 70z"/>
  <circle cx="370" cy="70" r="34" fill="var(--yellow)"/>
  <path d="M30 120q15-18 30 0t30 0 30 0" stroke="var(--teal)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <path fill="var(--teal)" d="M392 466c-70-40-90-150-40-250 60 70 80 170 40 250z"/>
  <path fill="oklch(0.62 0.10 190)" d="M400 470c-10-90 10-170 40-210v210z"/>

  <rect x="150" y="40" width="160" height="320" rx="28" fill="var(--navy)"/>
  <rect x="162" y="56" width="136" height="288" rx="18" fill="var(--white)"/>
  <rect x="176" y="76" width="70" height="12" rx="6" fill="var(--lilac)"/>
  <rect x="176" y="104" width="108" height="56" rx="14" fill="var(--yellow)"/>
  <rect x="200" y="172" width="84" height="38" rx="14" fill="var(--peach)"/>
  <rect x="176" y="222" width="96" height="38" rx="14" fill="var(--yellow)"/>
  <circle cx="230" cy="306" r="20" fill="var(--teal)"/>
  <path d="M220 306l7 7 14-14" stroke="var(--white)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke-linecap="round" fill="none">
    <path d="M92 300q-14 70-26 128" stroke="var(--navy)" stroke-width="24"/>
    <path d="M110 300q30 60 44 128" stroke="var(--navy)" stroke-width="24"/>
    <path d="M84 222q-30 50-22 104" stroke="var(--lilac)" stroke-width="13"/>
    <path d="M118 218q50-20 66-90" stroke="var(--lilac)" stroke-width="13"/>
  </g>
  <path fill="var(--navy)" d="M40 432q0-14 22-14h16q10 0 10 14v6H40z"/>
  <path fill="var(--navy)" d="M146 432q0-14 14-14h16q24 0 24 14v6h-54z"/>
  <path fill="var(--teal)" d="M78 206q22-14 44 0l6 96H70z"/>
  <ellipse cx="62" cy="330" rx="12" ry="9" fill="var(--lilac)"/>
  <ellipse cx="188" cy="122" rx="13" ry="10" fill="var(--lilac)" transform="rotate(-30 188 122)"/>
  <rect x="96" y="192" width="8" height="14" fill="var(--lilac)"/>
  <circle cx="100" cy="184" r="11" fill="var(--lilac)"/>
  <path fill="var(--navy)" d="M89 182a11 11 0 0 1 22-2q-12-8-22 2z"/>

  <g stroke-linecap="round" fill="none">
    <path d="M300 422q40-6 64-70 10 40 32 72" stroke="var(--navy)" stroke-width="22"/>
    <path d="M300 426q60 6 110 2" stroke="var(--navy)" stroke-width="22"/>
    <path d="M300 340q22 30 60 6" stroke="var(--orange-skin)" stroke-width="12"/>
    <path d="M286 338q-20 30-12 60" stroke="var(--orange-skin)" stroke-width="12"/>
  </g>
  <path fill="var(--yellow)" d="M282 328q16-10 30 0l8 96h-46z"/>
  <ellipse cx="364" cy="346" rx="12" ry="9" fill="var(--orange-skin)"/>
  <path fill="var(--lilac)" d="M396 420q0-12 16-12h12q12 0 12 12v8h-40z"/>
  <rect x="293" y="312" width="8" height="16" fill="var(--orange-skin)"/>
  <circle cx="297" cy="304" r="11" fill="var(--orange-skin)"/>
  <path fill="var(--navy)" d="M286 300q2-14 18-12 10 4 4 14-10-6-22-2z"/>
</svg>

<div class="card">
  <i></i>
  <div><small>Still in use</small><b>1,284</b><span>projects made since 2019</span></div>
</div>
</body>
</html>
