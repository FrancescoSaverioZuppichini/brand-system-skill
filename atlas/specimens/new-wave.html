<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Wave typography</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --white: oklch(0.97 0 0);
  --black: oklch(0.16 0 0);
  --pink: oklch(0.75 0.13 355);
  --cyan: oklch(0.80 0.10 210);
  --yellow: oklch(0.90 0.14 100);
  --grey: oklch(0.70 0 0);
  --grotesk: "Archivo", sans-serif;
  --mono: "Space Mono", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
body { position: relative; font-family: var(--grotesk); color: var(--black); }

/* [Agent] Flat colour layers overlap with multiply, like Weingart's film overlays; where two meet you get the third colour. */
.layer { position: absolute; mix-blend-mode: multiply; }
.l-pink { left: 372px; top: 34px; width: 330px; height: 214px; background: var(--pink); }
.l-cyan { left: 300px; top: 168px; width: 250px; height: 210px; background: var(--cyan); }
.l-yellow { left: 512px; top: 292px; width: 270px; height: 176px; background: var(--yellow); }
/* [Agent] Halftone screen fading in from the left: a plain dot grid under a gradient mask. */
.screen {
  position: absolute; left: 560px; top: 34px; width: 222px; height: 150px;
  background: radial-gradient(circle, var(--black) 42%, transparent 46%) 0 0 / 8px 8px;
  mask: linear-gradient(100deg, transparent 0%, #000 90%);
}
.stairs { position: absolute; inset: 0; }

h1 { position: absolute; left: 0; top: 0; margin: 0; font-weight: 400; }
h1 span { position: absolute; white-space: nowrap; line-height: 1; }
.w1 { left: 52px; top: 70px; font: 900 64px var(--grotesk); font-stretch: 125%; letter-spacing: .02em; }
.w2 { left: 120px; top: 140px; font: 200 52px var(--grotesk); font-stretch: 62%; letter-spacing: .12em; }
.w3 { left: 188px; top: 198px; font: 800 64px var(--grotesk); font-stretch: 125%; }
.w4 { left: 316px; top: 268px; font: italic 300 72px var(--grotesk); font-stretch: 75%; letter-spacing: .3em; }

.eyebrow { position: absolute; left: 52px; top: 36px; margin: 0; padding: 3px 8px; background: var(--black); color: var(--white); font: 700 11px var(--mono); letter-spacing: .4em; text-transform: uppercase; }
.sub { position: absolute; left: 52px; top: 372px; width: 300px; margin: 0; font: 400 12px/1.6 var(--mono); }
.button { position: absolute; left: 52px; top: 432px; padding: 10px 16px; border: 0; background: var(--black); color: var(--white); font: 700 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; }

.card { position: absolute; left: 560px; top: 318px; width: 196px; }
.card .label { font: 700 10px var(--mono); letter-spacing: .4em; text-transform: uppercase; border-top: 3px solid var(--black); padding-top: 6px; }
.card .num { font: 900 54px/1 var(--grotesk); font-stretch: 125%; margin-top: 8px; letter-spacing: -.02em; }
.card .cap { font: 400 11px var(--mono); margin-top: 8px; padding-left: 40px; }
</style>
</head>
<body>
  <div class="layer l-pink"></div>
  <div class="layer l-cyan"></div>
  <div class="layer l-yellow"></div>
  <div class="screen"></div>
  <svg class="stairs" viewBox="0 0 800 500" aria-hidden="true">
    <!-- stepped rule tracking the stair of the headline -->
    <path d="M52 132 H120 V194 H188 V262 H316 V346 H540" fill="none" stroke="var(--black)" stroke-width="2"/>
    <g fill="var(--black)"><circle cx="540" cy="346" r="4"/><rect x="760" y="20" width="22" height="4"/><rect x="769" y="11" width="4" height="22"/></g>
    <line x1="300" y1="472" x2="510" y2="380" stroke="var(--black)" stroke-width="1"/>
    <g fill="none" stroke="var(--black)" stroke-width="1"><rect x="20" y="20" width="10" height="10"/><rect x="740" y="470" width="10" height="10"/></g>
    <rect x="540" y="168" width="10" height="124" fill="var(--black)"/>
  </svg>

  <p class="eyebrow">Introducing Keep</p>
  <h1 aria-label="Make something people keep"><span class="w1">MAKE</span><span class="w2">something</span><span class="w3">PEOPLE</span><span class="w4">keep</span></h1>
  <p class="sub">Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <button class="button">Start a project</button>

  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
  </div>
</body>
</html>
