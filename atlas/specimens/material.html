<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Material Design 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&display=block">
<style>
:root {
  color-scheme: light;
  --surface: oklch(0.97 0.012 300);
  --surface-container: oklch(0.935 0.016 300);
  --surface-high: oklch(0.915 0.018 300);
  --primary: oklch(0.48 0.17 290);
  --on-primary: oklch(1 0 0);
  --primary-container: oklch(0.92 0.04 300);
  --on-primary-container: oklch(0.30 0.12 290);
  --secondary-container: oklch(0.90 0.03 300);
  --tertiary: oklch(0.55 0.10 0);
  --tertiary-container: oklch(0.91 0.05 0);
  --on-surface: oklch(0.22 0.01 300);
  --on-surface-variant: oklch(0.45 0.02 300);
  --outline: oklch(0.80 0.02 300);
  --sans: "Roboto Flex", "Roboto", sans-serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--surface-container); }
body { position: relative; font-family: var(--sans); color: var(--on-surface); }
p, h1 { margin: 0; }
svg { display: block; }

/* Navigation rail */
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 88px; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 22px; box-sizing: border-box; }
.fab { width: 56px; height: 56px; margin: 6px 0 18px; border-radius: 16px; background: var(--tertiary-container); display: grid; place-items: center; box-shadow: 0 1px 3px oklch(0 0 0 / .18), 0 4px 8px oklch(0 0 0 / .1); }
.dest { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
.dest.on { background: var(--secondary-container); }

/* Panes: tonal surfaces on a tinted container, no shadows */
.pane { position: absolute; top: 12px; bottom: 12px; border-radius: 28px; background: var(--surface); }
.main { left: 88px; width: 468px; }
.side { left: 568px; right: 12px; background: transparent; display: flex; flex-direction: column; gap: 12px; }
.appbar { height: 64px; padding: 0 12px 0 24px; display: flex; align-items: center; gap: 8px; font: 400 22px/1 var(--sans); }
.appbar .sp { margin-left: auto; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.avatar { width: 32px; height: 32px; margin: 0 4px; border-radius: 50%; background: var(--tertiary); color: white; display: grid; place-items: center; font: 500 14px/1 var(--sans); }

.hero { padding: 34px 32px 0; }
.eyebrow { font: 500 14px/1 var(--sans); letter-spacing: .02em; color: var(--primary); }
h1 { margin: 14px 0 16px; font: 400 48px/1.08 var(--sans); font-variation-settings: "opsz" 96; letter-spacing: -.01em; }
.sub { font: 400 16px/1.5 var(--sans); letter-spacing: .01em; color: var(--on-surface-variant); }
.btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 30px; height: 48px; padding: 0 24px 0 18px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font: 500 16px/1 var(--sans); letter-spacing: .01em; }

.card { flex: 1; display: flex; flex-direction: column; position: relative; padding: 22px 22px 24px; border-radius: 28px; background: var(--primary-container); color: var(--on-primary-container); overflow: hidden; }
.card .label { font: 500 14px/1 var(--sans); letter-spacing: .01em; }
.card .num { margin: auto 0 6px; font: 400 52px/1 var(--sans); font-variation-settings: "opsz" 96; letter-spacing: -.01em; }
.card .cap { font: 400 14px/1.4 var(--sans); color: var(--on-primary-container); opacity: .8; }
.card .cookie { position: absolute; right: 16px; top: 14px; }

.controls { padding: 20px 22px; border-radius: 28px; background: var(--surface); display: flex; flex-direction: column; gap: 22px; }
.row { display: flex; align-items: center; justify-content: space-between; }
.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--primary); position: relative; }
.switch::after { content: ""; position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--on-primary); }
.switch.off { background: var(--surface-high); box-shadow: inset 0 0 0 2px var(--on-surface-variant); }
.switch.off::after { left: 8px; top: 8px; width: 16px; height: 16px; background: var(--on-surface-variant); }
/* [Agent] M3 Expressive slider: a thick active track, a gap, then a tall bar handle. */
.slider { display: flex; align-items: center; gap: 6px; height: 44px; }
.slider .on { width: 92px; height: 16px; border-radius: 8px 2px 2px 8px; background: var(--primary); }
.slider .handle { width: 4px; height: 44px; border-radius: 2px; background: var(--primary); }
.slider .off { flex: 1; height: 16px; border-radius: 2px 8px 8px 2px; background: var(--secondary-container); }
</style>
</head>
<body>
  <nav class="rail">
    <svg width="24" height="24"><path d="M3 6h18M3 12h18M3 18h18" stroke="oklch(0.45 0.02 300)" stroke-width="2"/></svg>
    <div class="fab"><svg width="24" height="24"><path d="M4 20h4L19 9l-4-4L4 16z" fill="oklch(0.30 0.08 0)"/></svg></div>
    <div class="dest on"><svg width="24" height="24"><path d="M3 4h7v7H3zM14 4h7v7h-7zM3 13h7v7H3zM14 13h7v7h-7z" fill="oklch(0.22 0.01 300)"/></svg></div>
    <div class="dest"><svg width="24" height="24"><rect x="3" y="5" width="18" height="15" rx="2" fill="none" stroke="oklch(0.45 0.02 300)" stroke-width="2"/><path d="M3 10h18M8 2v5M16 2v5" stroke="oklch(0.45 0.02 300)" stroke-width="2"/></svg></div>
    <div class="dest"><svg width="24" height="24"><circle cx="12" cy="8" r="4" fill="none" stroke="oklch(0.45 0.02 300)" stroke-width="2"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="oklch(0.45 0.02 300)" stroke-width="2"/></svg></div>
    <div class="dest"><svg width="24" height="24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z" fill="none" stroke="oklch(0.45 0.02 300)" stroke-width="2" stroke-linejoin="round"/></svg></div>
  </nav>

  <section class="pane main">
    <header class="appbar">
      Keep
      <span class="icon-btn sp"><svg width="24" height="24"><circle cx="10" cy="10" r="6" fill="none" stroke="oklch(0.22 0.01 300)" stroke-width="2"/><path d="M15 15l6 6" stroke="oklch(0.22 0.01 300)" stroke-width="2"/></svg></span>
      <span class="avatar">K</span>
    </header>
    <div class="hero">
      <p class="eyebrow">Introducing Keep</p>
      <h1>Make something<br>people keep</h1>
      <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
      <a class="btn"><svg width="20" height="20"><path d="M10 3v14M3 10h14" stroke="white" stroke-width="2"/></svg>Start a project</a>
    </div>
  </section>

  <aside class="pane side">
    <div class="card">
      <!-- [Agent] An M3 Expressive "cookie": nine circles on a ring plus a fill give the scalloped edge without a long path. -->
      <svg class="cookie" width="64" height="64" viewBox="0 0 100 100">
        <g fill="oklch(0.48 0.17 290)">
          <circle cx="50" cy="50" r="40"/>
          <circle cx="50" cy="16" r="16"/><circle cx="50" cy="16" r="16" transform="rotate(40 50 50)"/><circle cx="50" cy="16" r="16" transform="rotate(80 50 50)"/>
          <circle cx="50" cy="16" r="16" transform="rotate(120 50 50)"/><circle cx="50" cy="16" r="16" transform="rotate(160 50 50)"/><circle cx="50" cy="16" r="16" transform="rotate(200 50 50)"/>
          <circle cx="50" cy="16" r="16" transform="rotate(240 50 50)"/><circle cx="50" cy="16" r="16" transform="rotate(280 50 50)"/><circle cx="50" cy="16" r="16" transform="rotate(320 50 50)"/>
        </g>
        <path d="M34 52l11 11 22-24" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="label">Still in use</p>
      <p class="num">1,284</p>
      <p class="cap">projects made since 2019</p>
    </div>
    <div class="controls">
      <div class="row">
        <svg width="24" height="24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4v5l3 3" fill="none" stroke="oklch(0.45 0.02 300)" stroke-width="2"/></svg>
        <span class="switch"></span>
      </div>
      <div class="row">
        <svg width="24" height="24"><path d="M12 3l8 4v6c0 4-3 7-8 8-5-1-8-4-8-8V7z" fill="none" stroke="oklch(0.45 0.02 300)" stroke-width="2"/></svg>
        <span class="switch off"></span>
      </div>
      <div class="slider"><i class="on"></i><i class="handle"></i><i class="off"></i></div>
    </div>
  </aside>
</body>
</html>
