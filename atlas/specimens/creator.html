<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creator / influencer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500&family=Caveat:wght@600;700&display=block">
<style>
  :root {
    color-scheme: light;
    --white: oklch(0.99 0 0);
    --signature: oklch(0.65 0.24 15);
    --second: oklch(0.88 0.17 95);
    --ink: oklch(0.20 0.01 270);
    --soft: oklch(0.95 0.02 15);
    --skin: oklch(0.80 0.07 55);
    --sticker: 0 6px 0 var(--ink);
    --display: "Bricolage Grotesque", sans-serif;
    --ui: "Inter", sans-serif;
    --hand: "Caveat", cursive;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--soft); }
  body { position: relative; font-family: var(--ui); color: var(--ink); }
  svg.layer { position: absolute; inset: 0; }

  .copy { position: absolute; left: 46px; top: 70px; }
  .note { display: inline-block; font-family: var(--hand); font-weight: 700; font-size: 32px; color: var(--signature); transform: rotate(-5deg); transform-origin: left; }
  h1 { font-family: var(--display); font-weight: 800; font-size: 62px; line-height: 0.97; letter-spacing: -0.04em; margin: 14px 0 20px; }
  /* [Agent] The keyword becomes a tilted sticker: white outline ring plus a hard offset shadow. */
  h1 span { display: inline-block; padding: 0 14px 6px; margin-left: 4px; border-radius: 999px; background: var(--second); box-shadow: 0 0 0 4px var(--white), 0 8px 0 4px var(--ink); transform: rotate(-4deg); }
  p { margin: 0; font-size: 15px; line-height: 1.55; white-space: nowrap; }
  .cta { display: inline-block; margin-top: 30px; padding: 15px 28px; border-radius: 999px; background: var(--signature); color: var(--white); border: 2.5px solid var(--ink); box-shadow: var(--sticker); font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }

  .card { position: absolute; left: 558px; top: 326px; padding: 14px 20px 14px; border-radius: 20px; background: var(--white); border: 2.5px solid var(--ink); box-shadow: var(--sticker); transform: rotate(4deg); }
  .card .label { font-size: 13px; font-weight: 500; }
  .card .num { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.03em; color: var(--signature); margin: 2px 0 4px; }
  .card .cap { font-family: var(--hand); font-weight: 600; font-size: 21px; line-height: 1; }
</style>
</head>
<body>
  <svg class="layer" width="800" height="500" viewBox="0 0 800 500">
    <defs>
      <!-- [Agent] Cut-out sticker: dilate the alpha into a thick white border, drop a hard ink shadow from it, then lay the art on top. -->
      <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>
        <feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="outline"/>
        <feOffset in="d" dy="7" result="o"/><feFlood flood-color="oklch(0.20 0.01 270)"/><feComposite in2="o" operator="in" result="shadow"/>
        <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <circle cx="610" cy="214" r="150" fill="var(--second)"/>
    <g filter="url(#sticker)" transform="translate(612 160)">
      <path d="M-120 196 C-112 128 -66 104 0 104 C 66 104 112 128 120 196 Z" fill="var(--signature)"/>
      <path d="M-34 108 C -20 136 20 136 34 108" fill="none" stroke="oklch(0.55 0.22 15)" stroke-width="6" stroke-linecap="round"/>
      <rect x="-20" y="64" width="40" height="50" rx="16" fill="oklch(0.72 0.08 50)"/>
      <ellipse cx="0" cy="18" rx="54" ry="62" fill="var(--skin)"/>
      <path d="M-58 22 C -66 -40 -24 -66 12 -62 C 56 -58 70 -20 58 22 C 52 -6 34 -22 6 -24 C -22 -26 -48 -12 -58 22 Z" fill="oklch(0.32 0.05 40)"/>
      <circle cx="30" cy="-66" r="22" fill="oklch(0.32 0.05 40)"/>
      <ellipse cx="-20" cy="16" rx="5" ry="7" fill="var(--ink)"/><ellipse cx="20" cy="16" rx="5" ry="7" fill="var(--ink)"/>
      <circle cx="-34" cy="38" r="9" fill="var(--signature)" opacity="0.35"/><circle cx="34" cy="38" r="9" fill="var(--signature)" opacity="0.35"/>
      <path d="M-22 40 C -18 66 18 66 22 40 Z" fill="var(--ink)"/>
      <path d="M-16 42 H16 C 14 50 -14 50 -16 42 Z" fill="#fff"/>
    </g>
    <!-- stickers -->
    <g filter="url(#sticker)">
      <path d="M748 52 l9 20 22 3 -16 15 4 22 -19 -11 -20 11 4 -22 -16 -15 22 -3 Z" fill="var(--signature)"/>
      <path d="M752 282 c-14 -18 -38 -6 -30 14 c6 14 30 26 30 26 s24 -12 30 -26 c8 -20 -16 -32 -30 -14 Z" fill="var(--signature)"/>
      <circle cx="470" cy="70" r="22" fill="var(--ink)"/>
      <path d="M464 59 L480 70 L464 81 Z" fill="#fff"/>
    </g>
    <path d="M300 452 q12 -18 24 0 t24 0 t24 0" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <path d="M520 30 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="var(--ink)"/>
    <!-- hand-drawn arrow from the note to the button -->
    <path d="M262 62 C 310 30 370 34 418 70" fill="none" stroke="var(--signature)" stroke-width="3" stroke-linecap="round"/>
    <path d="M402 70 L419 71 L414 54" fill="none" stroke="var(--signature)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="copy">
    <div class="note">Introducing Keep</div>
    <h1>Make something<br>people <span>keep</span></h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project</span>
  </div>

  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
  </div>
</body>
</html>
