<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hand-drawn doodle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Patrick+Hand&display=block">
<style>
:root {
  color-scheme: light;
  --paper: oklch(0.97 0.015 90);
  --ink: oklch(0.24 0.02 260);
  --blue: oklch(0.58 0.15 250);
  --highlight: oklch(0.92 0.15 105);
  --red: oklch(0.58 0.19 28);
  --muted: oklch(0.45 0.02 260);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--paper); }
body { font-family: "DM Sans", sans-serif; color: var(--ink); position: relative; }
svg { position: absolute; overflow: visible; }
.pen { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; filter: url(#wobble); }
.blue { stroke: var(--blue); }
.red { stroke: var(--red); }
.marker { fill: none; stroke: var(--highlight); stroke-width: 18; stroke-linecap: round; filter: url(#wobble); }

.copy { position: absolute; left: 56px; top: 84px; width: 360px; }
.eyebrow { font: 700 26px/1 "Caveat", cursive; color: var(--red); transform: rotate(-4deg); transform-origin: left; display: inline-block; }
h1 { font-size: 46px; font-weight: 700; line-height: 1.06; letter-spacing: -.02em; margin: 20px 0 16px; position: relative; }
h1 span { position: relative; white-space: nowrap; isolation: isolate; }
p { font-size: 15px; line-height: 1.55; color: var(--muted); margin: 0 0 30px; }
.btn { position: relative; isolation: isolate; display: inline-block; font: 22px/1 "Patrick Hand", cursive; padding: 14px 24px; }

.card { position: absolute; left: 520px; top: 372px; width: 210px; height: 112px; padding: 14px 18px; box-sizing: border-box; transform: rotate(-2deg); }
.card small { font: 19px/1 "Patrick Hand", cursive; color: var(--muted); }
.card b { display: block; font: 700 40px/1 "Caveat", cursive; margin: 2px 0 0; color: var(--blue); }
.card span { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true">
  <!-- [Agent] Low-frequency noise nudges every stroke a few pixels, so straight SVG paths come out as a shaky marker line. -->
  <filter id="wobble" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1000" height="800"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<div class="copy">
  <span class="eyebrow">Introducing Keep</span>
  <h1>Make something people <span><svg width="130" height="60" style="left:-8px;top:2px;z-index:-1" aria-hidden="true"><path class="marker" d="M8 40C40 36 90 38 122 34"/></svg>keep<svg width="140" height="70" style="left:-14px;top:-6px" aria-hidden="true"><path class="pen red" d="M70 6C30 4 4 20 6 36c2 18 40 24 76 22 34-2 54-14 50-30C128 10 96 2 60 8"/></svg></span></h1>
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn"><svg width="190" height="56" style="left:0;top:0;z-index:-1" aria-hidden="true">
    <path d="M6 8C60 4 130 6 184 6L182 50C130 52 60 50 8 52z" fill="var(--highlight)" filter="url(#wobble)"/>
    <path class="pen" d="M4 7C60 3 130 5 186 5M184 2C187 20 185 36 186 53M188 50C130 52 60 51 3 53M6 56C3 38 5 22 4 3"/>
  </svg>Start a project</span>
</div>

<svg width="370" height="440" style="left:420px;top:8px" viewBox="0 0 370 440" aria-hidden="true">
  <path class="pen" d="M296 46a22 22 0 1 0 1 0M298 14v12M330 30l-9 8M340 64h-12M266 30l9 8"/>
  <path class="marker" d="M96 296C140 290 190 294 222 288" style="stroke-width:46"/>
  <path class="pen" d="M62 250L240 248M64 252C62 252 86 334 88 334M238 246L214 334M90 334C130 336 180 335 214 334"/>
  <path class="pen blue" d="M92 270l20-20M96 296l46-46M104 318l66-66M124 330l76-76M154 332l60-60M186 330l28-28" style="stroke-width:1.8"/>
  <path class="pen" d="M152 248C150 200 156 150 148 96M150 198C120 190 90 170 80 136 112 134 142 156 150 196M150 166C170 150 196 140 222 146 216 172 184 184 152 176M148 120C130 110 120 90 124 64 144 74 154 96 148 120"/>
  <path class="pen" d="M102 160L146 192M200 156L156 172M132 82L146 112" style="stroke-width:1.6"/>
  <path class="pen" d="M268 240h56c2 30 0 66-4 92h-48c-4-26-6-62-4-92zM324 256c22-2 26 30 0 32"/>
  <path class="pen" d="M286 222c-8-10 8-16 0-28M304 222c-8-10 8-16 0-28" style="stroke-width:1.8"/>
  <path class="pen" d="M20 354C120 350 250 352 360 350"/>
  <path class="pen" d="M40 70l8 8M48 70l-8 8M222 64v14M215 71h14M26 200l6-4 6 4M350 168v10M345 173h10"/>
  <path class="pen red" d="M96 420C50 410 30 360 56 312M44 316l12-4 2 12"/>
</svg>

<div class="card">
  <svg width="210" height="112" style="left:0;top:0" aria-hidden="true"><path class="pen" d="M3 5C60 2 150 4 208 3M206 1C208 40 206 76 208 110M209 108C140 110 60 109 2 111M4 112C2 76 4 38 3 2"/></svg>
  <small>Still in use</small>
  <b>1,284</b>
  <span>projects made since 2019</span>
</div>
</body>
</html>
