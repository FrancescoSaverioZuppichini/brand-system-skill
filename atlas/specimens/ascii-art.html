<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCII art</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=block">
<style>
:root {
  color-scheme: light;
  --paper: oklch(0.96 0.01 85);
  --ink: oklch(0.18 0.01 60);
  --dim: oklch(0.60 0.01 60);
  --accent: oklch(0.62 0.17 40);
  --cell: 11px;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--paper); }
body { font-family: "Inter", sans-serif; color: var(--ink); position: relative; }

.copy { position: absolute; left: 48px; top: 48px; width: 300px; }
.eyebrow { font: 700 12px/1 "JetBrains Mono", monospace; color: var(--accent); }
.eyebrow::before { content: "> "; color: var(--dim); }
h1 { font-size: 44px; font-weight: 700; line-height: 1.04; letter-spacing: -.035em; margin: 16px 0 16px; }
p { font-size: 14px; line-height: 1.55; color: oklch(0.40 0.01 60); margin: 0 0 26px; }
.btn { display: inline-block; font: 700 13px/1 "JetBrains Mono", monospace; background: var(--ink); color: var(--paper); padding: 13px 18px; }
.btn::after { content: " \2192"; }

/* [Agent] The image is plain text: one mono glyph per cell, line-height 1 so the rows touch and the ramp reads as tone. */
pre#art { position: absolute; left: 380px; top: 10px; margin: 0; font: 400 var(--cell)/1 "JetBrains Mono", monospace; letter-spacing: 0; white-space: pre; color: var(--ink); font-variant-ligatures: none; }
pre#art i { font-style: normal; color: var(--accent); }
pre#art u { text-decoration: none; color: var(--dim); }

.card { position: absolute; left: 48px; bottom: 34px; font: 400 12px/1.4 "JetBrains Mono", monospace; color: var(--dim); }
.card small { display: block; color: var(--accent); font-size: 12px; }
.card b { display: block; color: var(--ink); font-size: 30px; line-height: 1.1; margin: 4px 0 2px; }
.card em { display: block; font-style: normal; margin-top: 6px; letter-spacing: 0; }
</style>
</head>
<body>
<div class="copy">
  <div class="eyebrow">Introducing Keep</div>
  <h1>Make something people keep</h1>
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn">Start a project</span>
</div>

<pre id="art" aria-hidden="true"></pre>

<div class="card">
  <small>[ Still in use ]</small>
  <b>1,284</b>
  <span>projects made since 2019</span>
  <em>▓▓▓▓▓▓▓▓▓▓▓▓▒▒▒▒▒░░░░</em>
</div>

<script>
// [Agent] Ray-cast a lit sphere per character cell; darkness picks a glyph from the ramp (ink on paper, so light = sparse). JetBrains Mono advances 0.6em, so cells are 0.6 x 1 of the font size.
const ramp = " .:-=+*#%@", fs = 11, cw = fs * 0.6, ch = fs, cols = 62, rows = 44;
const W = cols * cw, H = rows * ch, cx = W * 0.5, cy = H * 0.44, r = W * 0.36, floor = cy + r;
const L = [-0.5, -0.65, 0.58], ln = Math.hypot(...L), Lx = L[0] / ln, Ly = L[1] / ln, Lz = L[2] / ln;
let out = "";
for (let j = 0; j < rows; j++) {
  for (let i = 0; i < cols; i++) {
    const x = (i + 0.5) * cw, y = (j + 0.5) * ch, nx = (x - cx) / r, ny = (y - cy) / r, q = nx * nx + ny * ny;
    if (q < 1) {
      const nz = Math.sqrt(1 - q), d = nx * Lx + ny * Ly + nz * Lz;
      const spec = Math.pow(Math.max(0, 2 * d * nz - Lz), 60);
      const v = Math.max(0, Math.min(1, 0.08 + 0.85 * Math.max(0, d) + 0.04 * (1 - nz)));
      out += spec > 0.6 ? "<i>+</i>" : ramp[Math.max(1, Math.floor((1 - v) * 9.99))];
      continue;
    }
    const sx = (x - cx - r * 0.35) / (r * 1.15), sy = (y - floor) / (r * 0.16), s = sx * sx + sy * sy;
    if (y > floor - r * 0.12 && s < 1) { out += "<u>" + ramp[1 + Math.floor((1 - s) * 5)] + "</u>"; continue; }
    out += y > floor - r * 0.05 && (i + j) % 4 === 0 ? "<u>.</u>" : " ";
  }
  out += "\n";
}
document.getElementById("art").innerHTML = out;
</script>
</body>
</html>
