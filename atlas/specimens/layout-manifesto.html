<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Single-page manifesto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(100% 0 0);
  --surface: oklch(97.6% 0.003 255);
  --line: oklch(91.5% 0.005 255);
  --fill: oklch(93% 0.005 255);
  --fill-2: oklch(87.5% 0.007 255);
  --text: oklch(23% 0.012 255);
  --muted: oklch(52% 0.012 255);
  --accent: oklch(56% 0.2 260);
  --accent-soft: oklch(95.5% 0.025 260);
  --radius: 8px;
  --sans: "Inter", sans-serif;
  --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body { padding: 26px 48px 0; color: var(--text); font-family: var(--sans); }
p { margin: 0; }

.eyebrow { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; font: 500 12px/1 var(--mono); color: var(--muted); }
.eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* [Agent] No UI at all: every belief is the same giant size, hung off a numbered margin, one column, and only the numbers take the accent. */
ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
li { display: grid; grid-template-columns: 52px 1fr; }
li::before { content: attr(data-n); padding-top: 9px; font: 500 13px/1 var(--mono); color: var(--accent); }
.st { font-size: 39px; line-height: 1.04; font-weight: 700; letter-spacing: -0.035em; text-wrap: balance; }
.st em { font-style: normal; color: var(--muted); }

.sign { display: flex; align-items: center; gap: 22px; margin: 26px 0 0 52px; }
.btn { padding: 11px 18px; border-radius: var(--radius); background: var(--text); color: var(--bg); font-size: 13.5px; font-weight: 500; }
.sign svg { width: 120px; height: 34px; }
</style>
</head>
<body>
<p class="eyebrow">Introducing Keep</p>

<ol>
  <li data-n="01"><p class="st">Make something people keep.</p></li>
  <li data-n="02"><p class="st">Tools for small teams who make things slowly and well.</p></li>
  <li data-n="03"><p class="st">Plan it, ship it, and look after it for years.</p></li>
  <li data-n="04"><p class="st">1,284 projects made since 2019. <em>Still in use.</em></p></li>
</ol>

<div class="sign">
  <span class="btn">Start a project</span>
  <svg viewBox="0 0 120 34" aria-hidden="true"><path d="M4 24c8-14 14-18 16-12s-6 16-2 14 10-20 16-18-4 18 2 16 8-12 12-10 0 10 6 8 10-10 16-8 4 6 10 4 10-6 16-6" fill="none" stroke="oklch(23% 0.012 255)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</body>
</html>
