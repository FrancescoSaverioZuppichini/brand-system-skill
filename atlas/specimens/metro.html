<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Noto+Sans:wght@400&display=block">
<style>
:root {
  color-scheme: dark;
  --black: oklch(0.12 0 0);
  --white: oklch(1 0 0);
  --grey: oklch(0.70 0 0);
  --cobalt: oklch(0.45 0.20 260);
  --magenta: oklch(0.55 0.24 340);
  --lime: oklch(0.75 0.18 130);
  --orange: oklch(0.66 0.19 45);
  --display: "Open Sans", "Segoe UI", sans-serif;
  --text: "Noto Sans", "Segoe UI", sans-serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--black); }
body { position: relative; color: var(--white); font-family: var(--display); }
p, h1, h2 { margin: 0; }

/* [Agent] The panorama title is meant to run off the right edge: it tells you the screen keeps going sideways. */
.panorama { position: absolute; left: 18px; top: -26px; white-space: nowrap; font: 300 118px/1 var(--display); letter-spacing: -.03em; text-transform: lowercase; }

.hero { position: absolute; left: 26px; top: 150px; width: 360px; }
h1 { font: 300 42px/1.08 var(--display); letter-spacing: -.01em; text-transform: lowercase; }
.sub { margin-top: 18px; font: 400 15px/1.5 var(--text); color: var(--grey); }
.btn { display: inline-block; margin-top: 26px; padding: 9px 22px 10px; border: 2px solid var(--white); font: 600 16px/1 var(--display); text-transform: lowercase; }

.appbar { position: absolute; left: 26px; bottom: 26px; display: flex; gap: 22px; }
.appbar i { width: 44px; height: 44px; box-sizing: border-box; border: 2px solid var(--white); border-radius: 50%; display: grid; place-items: center; }

.tiles { position: absolute; left: 444px; top: 150px; display: grid; grid-template-columns: repeat(3, 124px); grid-auto-rows: 124px; gap: 8px; }
.tile { position: relative; padding: 10px 12px; box-sizing: border-box; }
.tile .name { position: absolute; left: 10px; bottom: 8px; font: 400 13px/1 var(--display); text-transform: lowercase; }
.big { grid-column: span 2; grid-row: span 2; background: var(--cobalt); padding: 14px 16px; }
.big .num { font: 300 76px/1 var(--display); letter-spacing: -.03em; }
.big .cap { margin-top: 6px; font: 400 16px/1.3 var(--text); }
.wide { grid-column: span 2; }
.m { background: var(--magenta); } .l { background: var(--lime); } .o { background: var(--orange); } .c { background: var(--cobalt); }
.tile svg { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
  <p class="panorama">introducing keep</p>

  <section class="hero">
    <h1>make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
    <a class="btn">start a project</a>
  </section>

  <div class="appbar">
    <i><svg width="18" height="18"><path d="M9 1v16M1 9h16" stroke="white" stroke-width="2"/></svg></i>
    <i><svg width="18" height="18"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="white" stroke-width="2"/><path d="M11.5 11.5l5 5" stroke="white" stroke-width="2"/></svg></i>
    <i><svg width="18" height="18"><path d="M2 9.5l5 5 9-11" fill="none" stroke="white" stroke-width="2"/></svg></i>
  </div>

  <div class="tiles">
    <div class="tile big">
      <p class="num">1,284</p>
      <p class="cap">projects made since 2019</p>
      <p class="name">still in use</p>
    </div>
    <div class="tile m"><svg width="44" height="44"><rect x="3" y="7" width="38" height="34" fill="none" stroke="white" stroke-width="2.5"/><path d="M3 16h38M13 3v8M31 3v8" stroke="white" stroke-width="2.5"/></svg></div>
    <div class="tile l"><svg width="44" height="44"><path d="M5 23l12 12L40 9" fill="none" stroke="white" stroke-width="3"/></svg></div>
    <div class="tile o wide"><svg width="52" height="40"><rect x="2" y="2" width="48" height="36" fill="none" stroke="white" stroke-width="2.5"/><path d="M2 32l14-14 10 10 8-7 16 14" fill="none" stroke="white" stroke-width="2.5"/><circle cx="36" cy="11" r="4" fill="white"/></svg></div>
    <div class="tile c"><svg width="44" height="44"><path d="M4 8h36v24H18l-9 8v-8H4z" fill="none" stroke="white" stroke-width="2.5"/></svg></div>
  </div>
</body>
</html>
