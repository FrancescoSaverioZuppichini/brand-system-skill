<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Automotive / industrial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=block">
<style>
  :root {
    color-scheme: dark;
    --black: oklch(0.13 0 0);
    --graphite: oklch(0.28 0.005 260);
    --silver: oklch(0.80 0.005 260);
    --white: oklch(0.98 0 0);
    --signal: oklch(0.62 0.22 28);
    --hair: oklch(0.98 0 0 / 0.16);
    --wide: "Michroma", sans-serif;
    --text: "Inter", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--black); }
  body { position: relative; color: var(--white); font-family: var(--text); }
  .studio { position: absolute; inset: 0; }

  .copy { position: absolute; left: 44px; top: 44px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-family: var(--wide); font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--silver); }
  .eyebrow i { width: 24px; height: 2px; background: var(--signal); }
  h1 { font-family: var(--wide); font-weight: 400; font-size: 29px; line-height: 1.3; letter-spacing: 0.04em; text-transform: uppercase; margin: 18px 0 14px; }
  p { margin: 0; font-size: 13px; font-weight: 300; line-height: 1.6; color: var(--silver); white-space: nowrap; }
  .cta { display: inline-flex; align-items: center; gap: 14px; margin-top: 22px; padding: 12px 18px; border: 1px solid var(--white); font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; }

  .specs { position: absolute; left: 44px; right: 44px; bottom: 30px; display: grid; grid-template-columns: auto 1fr; gap: 40px; align-items: end; border-top: 1px solid var(--hair); padding-top: 14px; }
  .label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--silver); }
  .num { font-family: var(--wide); font-size: 26px; letter-spacing: 0.04em; margin: 6px 0 4px; }
  .cap { font-family: var(--mono); font-size: 10px; color: var(--silver); }
  .ruler { height: 18px; margin-bottom: 4px; background: repeating-linear-gradient(90deg, var(--hair) 0 1px, transparent 1px 12px); -webkit-mask: linear-gradient(90deg, #000, transparent); mask: linear-gradient(90deg, #000, transparent); position: relative; }
  .ruler::before { content: ""; position: absolute; left: 0; bottom: 0; width: 38%; height: 2px; background: var(--signal); }
</style>
</head>
<body>
  <!-- [Agent] Studio render stand-in: overhead light strip, floor pool and a fastback silhouette with a metallic shoulder highlight. -->
  <svg class="studio" width="800" height="500" viewBox="0 0 800 500">
    <defs>
      <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="oklch(0.42 0.005 260)"/><stop offset="1" stop-color="oklch(0.13 0 0)" stop-opacity="0"/></radialGradient>
      <radialGradient id="back" cx="0.62" cy="0.1" r="0.7"><stop offset="0" stop-color="oklch(0.30 0.005 260)"/><stop offset="1" stop-color="oklch(0.13 0 0)"/></radialGradient>
      <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="oklch(0.50 0.005 260)"/><stop offset="0.3" stop-color="oklch(0.88 0.004 260)"/><stop offset="0.42" stop-color="oklch(0.42 0.006 260)"/><stop offset="0.75" stop-color="oklch(0.24 0.005 260)"/><stop offset="1" stop-color="oklch(0.16 0 0)"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="oklch(0.10 0 0)"/><stop offset="0.55" stop-color="oklch(0.28 0.006 260)"/><stop offset="1" stop-color="oklch(0.10 0 0)"/></linearGradient>
      <radialGradient id="rim" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="oklch(0.85 0.004 260)"/><stop offset="1" stop-color="oklch(0.35 0.005 260)"/></radialGradient>
      <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    </defs>
    <rect width="800" height="500" fill="url(#back)"/>
    <ellipse cx="550" cy="0" rx="190" ry="10" fill="oklch(0.98 0 0)" opacity="0.5" filter="url(#soft)"/>
    <ellipse cx="520" cy="384" rx="330" ry="36" fill="url(#floor)"/>

    <g transform="translate(214 200) scale(0.94)">
      <ellipse cx="300" cy="190" rx="270" ry="10" fill="#000" opacity="0.9" filter="url(#soft)"/>
      <path d="M24 130 C22 116 40 108 82 103 L200 93 C236 70 266 58 306 55 C366 51 414 56 446 67 C494 82 532 92 568 101 C578 106 580 120 576 136 L572 146 L520 146 A50 50 0 0 0 420 146 L190 146 A50 50 0 0 0 90 146 L36 146 C28 144 24 138 24 130 Z" fill="url(#paint)"/>
      <path d="M214 92 C246 72 272 62 306 60 C364 56 408 60 436 70 C452 76 454 84 438 87 L232 94 Z" fill="url(#glass)"/>
      <path d="M318 60 L322 92" stroke="oklch(0.13 0 0)" stroke-width="3"/>
      <path d="M86 106 C200 98 380 92 566 104" fill="none" stroke="oklch(0.98 0 0)" stroke-opacity="0.5" stroke-width="1"/>
      <path d="M26 122 L74 112" stroke="oklch(0.98 0 0)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M548 102 L577 110" stroke="oklch(0.62 0.22 28)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M200 128 L420 128" stroke="oklch(0.13 0 0)" stroke-opacity="0.6" stroke-width="1"/>
      <g>
        <circle cx="140" cy="150" r="42" fill="oklch(0.10 0 0)"/>
        <circle cx="140" cy="150" r="29" fill="url(#rim)"/>
        <path d="M140 121 V179 M111 150 H169 M119.5 129.5 L160.5 170.5 M160.5 129.5 L119.5 170.5" stroke="oklch(0.20 0 0)" stroke-width="5"/>
        <circle cx="140" cy="150" r="7" fill="oklch(0.70 0.004 260)"/>
        <circle cx="470" cy="150" r="42" fill="oklch(0.10 0 0)"/>
        <circle cx="470" cy="150" r="29" fill="url(#rim)"/>
        <path d="M470 121 V179 M441 150 H499 M449.5 129.5 L490.5 170.5 M490.5 129.5 L449.5 170.5" stroke="oklch(0.20 0 0)" stroke-width="5"/>
        <circle cx="470" cy="150" r="7" fill="oklch(0.70 0.004 260)"/>
      </g>
    </g>
  </svg>

  <div class="copy">
    <div class="eyebrow"><i></i>Introducing Keep</div>
    <h1>Make something<br>people keep</h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project
      <svg width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 5h17M13 1l4 4-4 4"/></svg>
    </span>
  </div>

  <div class="specs">
    <div>
      <div class="label">Still in use</div>
      <div class="num">1,284</div>
      <div class="cap">projects made since 2019</div>
    </div>
    <div class="ruler"></div>
  </div>
</body>
</html>
