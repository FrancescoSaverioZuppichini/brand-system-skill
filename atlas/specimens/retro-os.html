<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retro OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Silkscreen&family=VT323&display=block">
<style>
:root {
  color-scheme: light;
  --win: oklch(0.80 0 0);
  --desk: oklch(0.52 0.09 195);
  --navy: oklch(0.30 0.14 265);
  --title-end: oklch(0.58 0.13 245);
  --inactive: oklch(0.58 0 0);
  --inactive-end: oklch(0.76 0 0);
  --white: oklch(1 0 0);
  --hi: oklch(0.90 0 0);
  --shade: oklch(0.58 0 0);
  --black: oklch(0 0 0);
  --ui: "Pixelify Sans", monospace;
  --title: "Silkscreen", monospace;
  --text: "VT323", monospace;
  /* [Agent] The Win95 bevel: two rings of 1px inset shadows, light on the top-left and dark on the bottom-right. */
  --raised: inset -1px -1px var(--black), inset 1px 1px var(--hi), inset -2px -2px var(--shade), inset 2px 2px var(--white);
  --sunken: inset -1px -1px var(--white), inset 1px 1px var(--shade), inset -2px -2px var(--hi), inset 2px 2px var(--black);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--desk); }
body { position: relative; font: 400 15px/1.2 var(--ui); color: var(--black); }
p, h1 { margin: 0; }

.window { position: absolute; background: var(--win); box-shadow: var(--raised); padding: 3px; }
.bar {
  height: 20px; padding: 0 2px 0 4px; display: flex; align-items: center; gap: 5px;
  background: linear-gradient(90deg, var(--navy), var(--title-end));
  color: var(--white); font: 700 14px/1 var(--ui); letter-spacing: .02em;
}
.window.inactive .bar { background: linear-gradient(90deg, var(--inactive), var(--inactive-end)); color: var(--hi); }
.bar .ctl { margin-left: auto; display: flex; gap: 2px; }
.bar .ctl i {
  width: 16px; height: 14px; background: var(--win); box-shadow: var(--raised);
  display: grid; place-items: center; color: var(--black); font: 700 11px/1 var(--ui); font-style: normal;
}
.bar .ctl i.x { margin-left: 2px; }
.menu { display: flex; gap: 14px; padding: 4px 6px 3px; font-size: 15px; }
.menu u { text-decoration-thickness: 1px; text-underline-offset: 2px; }

.main { left: 34px; top: 26px; width: 460px; }
.main .body { padding: 16px 18px 18px; }
.eyebrow { font: 400 12px/1 var(--title); color: var(--navy); letter-spacing: .04em; }
h1 { margin: 10px 0 14px; font: 700 46px/.98 var(--ui); letter-spacing: -.01em; }
.field {
  background: var(--white); box-shadow: var(--sunken); padding: 8px 10px;
  font: 400 18px/1.1 var(--text); color: var(--black);
}
.actions { margin-top: 16px; display: flex; justify-content: flex-end; }
/* [Agent] The default button gets an extra black ring, and keyboard focus is a dotted rectangle inside the label. */
.btn {
  padding: 6px 16px; background: var(--win); font: 700 15px/1 var(--ui);
  box-shadow: 0 0 0 1px var(--black), var(--raised);
}
.btn span { display: inline-block; padding: 2px 4px; outline: 1px dotted var(--black); }
.status { display: flex; gap: 2px; margin-top: 2px; }
.status i { height: 18px; box-shadow: inset -1px -1px var(--white), inset 1px 1px var(--shade); flex: 1; }
.status i:first-child { flex: 3; }

.dialog { left: 504px; top: 250px; width: 272px; }
.dialog .body { padding: 14px 14px 16px; display: grid; grid-template-columns: 40px 1fr; gap: 4px 12px; }
.dialog .icon { grid-row: span 2; }
.num { font: 700 44px/1 var(--ui); }
.cap { font: 400 20px/1 var(--text); grid-column: 2; }
.progress { grid-column: 1 / -1; margin-top: 10px; height: 20px; box-shadow: var(--sunken); padding: 3px 4px; display: flex; gap: 2px; box-sizing: border-box; }
.progress b { width: 9px; background: var(--navy); }

.icon-desk { position: absolute; left: 708px; top: 28px; width: 72px; text-align: center; color: var(--white); font-size: 14px; }
.icon-desk span { display: inline-block; margin-top: 4px; padding: 0 2px; background: var(--navy); outline: 1px dotted var(--hi); }

.taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: var(--win);
  box-shadow: inset 0 1px var(--hi), inset 0 2px var(--white);
  display: flex; align-items: center; gap: 4px; padding: 0 3px; box-sizing: border-box;
}
.task { height: 22px; padding: 0 8px; display: flex; align-items: center; gap: 5px; box-shadow: var(--raised); font-size: 14px; }
.task.start { font-weight: 700; padding: 0 6px; }
.task.on { box-shadow: var(--sunken); background: repeating-conic-gradient(var(--white) 0 25%, var(--win) 0 50%) 0 0 / 2px 2px; font-weight: 700; }
.task.main-t { width: 150px; }
.task.dlg-t { width: 150px; }
.tray { margin-left: auto; height: 22px; padding: 0 10px; display: flex; align-items: center; box-shadow: inset -1px -1px var(--white), inset 1px 1px var(--shade); font-size: 14px; }
svg { display: block; shape-rendering: crispEdges; }
</style>
</head>
<body>
  <div class="icon-desk">
    <svg width="34" height="30" viewBox="0 0 17 15" style="margin:auto"><path fill="#000" d="M0 2h7v1h9v12H0z"/><path fill="#ffe680" d="M1 3h5v1h9v10H1z"/><path fill="#c8a400" d="M1 6h14v8H1z"/><path fill="#fff59a" d="M1 5h14v1H1z"/></svg>
    <span>Keep</span>
  </div>

  <section class="window main inactive">
    <div class="bar">
      <svg width="16" height="16" viewBox="0 0 16 16"><path fill="#fff" d="M2 3h12v10H2z"/><path fill="#000080" d="M2 3h12v2H2z"/><path fill="#008080" d="M4 7h8v1H4zM4 9h6v1H4z"/></svg>
      Keep
      <span class="ctl"><i>_</i><i>□</i><i class="x">✕</i></span>
    </div>
    <nav class="menu"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span><span><u>H</u>elp</span></nav>
    <div class="body">
      <p class="eyebrow">Introducing Keep</p>
      <h1>Make something<br>people keep</h1>
      <p class="field">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
      <div class="actions"><span class="btn"><span>Start a project</span></span></div>
    </div>
    <div class="status"><i></i><i></i></div>
  </section>

  <section class="window dialog">
    <div class="bar">Still in use<span class="ctl"><i class="x">✕</i></span></div>
    <div class="body">
      <svg class="icon" width="36" height="36" viewBox="0 0 18 18"><path fill="#000" d="M1 1h16v16H1z"/><path fill="#808080" d="M2 2h14v14H2z"/><path fill="#c0c0c0" d="M2 2h13v13H2z"/><path fill="#000080" d="M4 2h10v6H4z"/><path fill="#fff" d="M5 3h8v4H5z"/><path fill="#000" d="M4 10h10v6H4z"/><path fill="#c0c0c0" d="M10 11h2v4h-2z"/></svg>
      <p class="num">1,284</p>
      <p class="cap">projects made since 2019</p>
      <div class="progress"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
    </div>
  </section>

  <footer class="taskbar">
    <span class="task start">
      <svg width="18" height="16" viewBox="0 0 9 8"><path fill="#ff0000" d="M1 0h3v3H1z"/><path fill="#00a000" d="M5 0h3v3H5z"/><path fill="#0000ff" d="M1 4h3v3H1z"/><path fill="#ffd700" d="M5 4h3v3H5z"/></svg>
      Start
    </span>
    <span class="task main-t">Keep</span>
    <span class="task on dlg-t">Still in use</span>
    <span class="tray">4:20 PM</span>
  </footer>
</body>
</html>
