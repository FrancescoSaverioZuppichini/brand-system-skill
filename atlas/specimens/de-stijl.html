<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>De Stijl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@500;700&family=Archivo:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --white: oklch(0.97 0.005 90);
  --black: oklch(0.15 0 0);
  --red: oklch(0.55 0.21 27);
  --blue: oklch(0.40 0.17 263);
  --yellow: oklch(0.86 0.17 95);
  --display: "Archivo Black", sans-serif;
  --text: "Archivo", sans-serif;
  --narrow: "Archivo Narrow", sans-serif;
  --bar: 10px;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--black); color: var(--black); }

/* [Agent] The black bars are not drawn: they are the grid gap showing the black body through, so every plane stays a plain rectangle and the bars can never misalign. */
.canvas {
  width: 800px; height: 500px; display: grid; gap: var(--bar);
  grid-template-columns: 150px 330px 190px 1fr;
  grid-template-rows: 64px 226px 120px 1fr;
  font-family: var(--text);
}
.canvas > * { margin: 0; background: var(--white); box-sizing: border-box; }
.red { background: var(--red); }
.yellow { background: var(--yellow); }
.blue { background: var(--blue); color: var(--white); }
.pa { grid-area: 1 / 1 / 3 / 2; }
.pb { grid-area: 1 / 4 / 2 / 5; }
.pc { grid-area: 2 / 4 / 3 / 5; }
.pd { grid-area: 3 / 1 / 4 / 2; }
.pe { grid-area: 4 / 1 / 5 / 2; }

.eyebrow { grid-area: 1 / 2 / 2 / 4; display: flex; align-items: center; padding: 0 28px; font: 700 15px var(--narrow); text-transform: uppercase; letter-spacing: 0.12em; }
h1 { grid-area: 2 / 2 / 3 / 4; padding: 26px 28px; font: 400 58px/0.98 var(--display); letter-spacing: -0.02em; }
.sub { grid-area: 3 / 2 / 4 / 3; padding: 22px 28px; font-size: 14px; line-height: 1.5; }
.btn { grid-area: 4 / 2 / 5 / 3; border: 0; text-align: left; padding: 0 28px; color: var(--white); font: 700 16px var(--narrow); text-transform: uppercase; letter-spacing: 0.1em; display: flex; justify-content: space-between; align-items: center; }
.card { grid-area: 3 / 3 / 5 / 5; padding: 22px 26px; }
.card .label { font: 700 13px var(--narrow); text-transform: uppercase; letter-spacing: 0.12em; }
.card .num { font: 400 64px/1 var(--display); margin: 12px 0 8px; }
.card .cap { font-size: 14px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="red pa"></div>
  <div class="eyebrow">Introducing Keep</div>
  <div class="yellow pb"></div>
  <h1>Make something people keep</h1>
  <div class="pc"></div>
  <div class="pd"></div>
  <p class="sub">Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <div class="card blue">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
  </div>
  <div class="yellow pe"></div>
  <button class="btn red">Start a project <span>→</span></button>
</div>
</body>
</html>
