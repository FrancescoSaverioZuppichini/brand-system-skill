<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brutalist print</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600&family=Archivo:wdth,wght@62..125,800&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --white: oklch(0.98 0 0);
  --black: oklch(0.13 0 0);
  --orange: oklch(0.66 0.20 40);
  --display: "Archivo", sans-serif;
  --narrow: "Archivo Narrow", sans-serif;
  --mono: "JetBrains Mono", monospace;
  --col: calc(800px / 6);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); color: var(--black); }
body { position: relative; font-family: var(--narrow); }

.field { position: absolute; left: calc(var(--col) * 4); right: 0; top: 0; bottom: 0; background: var(--orange); }

/* [Agent] The grid is shown, not hidden: six column lines and their numbers sit on top of everything as part of the image. */
.grid { position: absolute; inset: 0; background: repeating-linear-gradient(to right, var(--black) 0 1px, transparent 1px var(--col)); opacity: 0.9; pointer-events: none; }
.meta { position: absolute; left: 0; right: 0; top: 0; height: 30px; display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 3px solid var(--black); font: 500 11px/30px var(--mono); }
.meta span { padding-left: 8px; }
.meta .eyebrow { grid-column: span 2; font-weight: 500; text-transform: uppercase; }

/* [Agent] One line per ruled row with the caps standing on the rule (line-height 0.74 puts the baseline on the row bottom); SOMETHING is set larger so it runs off the right edge and the last row runs off the frame, cropping KEEP. */
h1 { position: absolute; left: 0; right: 0; top: 33px; margin: 0; font: 800 100px/0.74 var(--display); font-stretch: 125%; letter-spacing: -0.035em; text-transform: uppercase; }
h1 span { height: 117px; display: flex; align-items: flex-end; padding-left: 2px; border-bottom: 3px solid var(--black); }
h1 span:nth-child(2) { font-size: 105px; }

.slot { position: absolute; left: calc(var(--col) * 4 + 10px); width: calc(var(--col) * 2 - 24px); }
.sub { top: 44px; margin: 0; font: 600 15px/1.3 var(--narrow); }
.card { top: 282px; }
.card .label { font: 500 11px var(--mono); text-transform: uppercase; }
.card .num { font: 800 46px/1 var(--display); font-stretch: 125%; letter-spacing: -0.03em; margin: 4px 0 2px; }
.card .cap { font: 500 13px var(--narrow); }
.btn { top: 404px; width: auto; border: 0; border-radius: 0; background: var(--black); color: var(--white); font: 500 13px var(--mono); padding: 12px 16px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="field"></div>
<div class="meta"><span>01</span><span class="eyebrow">Introducing Keep</span><span>04</span><span>05</span><span>06</span></div>
<h1><span>Make</span><span>Something</span><span>People</span><span>Keep</span></h1>
<p class="slot sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<div class="slot card">
  <div class="label">Still in use</div>
  <div class="num">1,284</div>
  <div class="cap">projects made since 2019</div>
</div>
<button class="slot btn">Start a project</button>
<div class="grid"></div>
</body>
</html>
