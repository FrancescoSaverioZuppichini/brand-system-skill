<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Technical manual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Mono&display=block">
<style>
:root {
  color-scheme: light;
  --body: oklch(0.92 0.003 250);
  --white: oklch(0.98 0 0);
  --black: oklch(0.18 0 0);
  --orange: oklch(0.68 0.20 42);
  --line: oklch(0.18 0 0 / 0.55);
  --mid: oklch(0.50 0 0);
  --sans: "Inter", sans-serif;
  --dot: "Doto", monospace;
  --mono: "JetBrains Mono", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; color: var(--black); }
body { position: relative; font-family: var(--sans); background: var(--body) radial-gradient(circle, oklch(0.18 0 0 / 0.16) 0.8px, transparent 1.2px) 0 0 / 16px 16px; }

.bar { position: absolute; left: 32px; right: 32px; top: 24px; display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--black); font: 500 11px var(--mono); text-transform: lowercase; }
.bar .led { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
.bar .no { margin-left: auto; color: var(--mid); }

.copy { position: absolute; left: 32px; top: 78px; width: 372px; }
h1 { margin: 0; font: 500 44px/1.02 var(--sans); letter-spacing: -0.035em; }
.sub { margin: 18px 0 0; font: 400 14px/1.55 var(--sans); }
.btn { margin-top: 26px; display: inline-flex; align-items: center; gap: 12px; border: 0; border-radius: 4px; background: var(--orange); color: var(--black); font: 500 13px var(--mono); text-transform: lowercase; padding: 12px 16px; }
.btn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--black); }

/* [Agent] The device is a hairline drawing on the dot grid; the card is its display, so the stat reads as a part of the object with a numbered callout like a manual. */
.fig { position: absolute; left: 392px; top: 62px; }
.fig { color: var(--black); }
.fig .shell { fill: var(--white); stroke: var(--black); }
.fig .well { fill: var(--body); stroke: var(--black); }
.fig .hair { fill: none; stroke: var(--black); }
.fig .call { fill: none; stroke: var(--line); }
.fig .ink { fill: var(--black); }
.fig .accent { fill: var(--orange); stroke: var(--black); }
.fig .needle { stroke: var(--orange); stroke-width: 3; stroke-linecap: round; }
.fig .tag { font: 400 10px var(--mono); fill: var(--black); text-anchor: middle; }
.fig .tag circle { fill: var(--body); stroke: var(--black); }

.card { position: absolute; left: 444px; top: 108px; width: 172px; height: 116px; box-sizing: border-box; border-radius: 4px; background: var(--black); color: var(--white); padding: 10px 12px; }
.card .label { font: 400 10px var(--mono); text-transform: lowercase; color: oklch(0.98 0 0 / 0.6); }
.card .num { font: 900 46px/1 var(--dot); color: var(--orange); margin: 10px 0 8px; letter-spacing: 0.02em; }
.card .cap { font: 400 10px var(--mono); text-transform: lowercase; color: oklch(0.98 0 0 / 0.6); }
.figno { position: absolute; left: 424px; bottom: 30px; font: 400 10px var(--mono); color: var(--mid); }
</style>
</head>
<body>
<div class="bar"><span class="led"></span><span>Introducing Keep</span><span class="no">No. 01</span></div>

<div class="copy">
  <h1>Make something people keep</h1>
  <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
  <button class="btn">Start a project</button>
</div>

<svg class="fig" width="390" height="420" viewBox="0 0 390 420" aria-hidden="true">
  <rect class="shell" x="32.5" y="26.5" width="300" height="330" rx="14"/>
  <g transform="translate(110 262)">
    <circle class="hair" r="54"/>
    <circle class="well" r="40"/>
    <line class="needle" x2="0" y2="-34"/>
    <circle class="ink" r="4"/>
    <g id="ticks" stroke="currentColor"></g>
  </g>
  <g class="well">
    <rect x="210.5" y="210.5" width="30" height="30" rx="4"/><rect x="250.5" y="210.5" width="30" height="30" rx="4"/><rect x="290.5" y="210.5" width="22" height="30" rx="4"/>
    <rect x="210.5" y="250.5" width="30" height="30" rx="4"/><rect x="250.5" y="250.5" width="30" height="30" rx="4"/>
    <circle cx="225.5" cy="310.5" r="11"/><circle cx="265.5" cy="310.5" r="11"/>
  </g>
  <rect class="accent" x="290.5" y="250.5" width="22" height="30" rx="4"/>
  <g class="ink" id="grille"></g>
  <path class="call" d="M224 104.5 H352 M164 262.5 H352 M301.5 281 V384 M110.5 316 V384"/>
  <g class="tag">
    <circle cx="364" cy="104.5" r="9"/><text x="364" y="108">01</text>
    <circle cx="364" cy="262.5" r="9"/><text x="364" y="266">02</text>
    <circle cx="301.5" cy="396" r="9"/><text x="301.5" y="399.5">03</text>
    <circle cx="110.5" cy="396" r="9"/><text x="110.5" y="399.5">04</text>
  </g>
</svg>
<div class="figno">Fig. 1</div>

<div class="card">
  <div class="label">Still in use</div>
  <div class="num">1,284</div>
  <div class="cap">projects made since 2019</div>
</div>

<script>
// [Agent] Dial ticks (36, every sixth long) and the 6 × 3 speaker grille are generated so the markup stays readable.
const svg = (tag, attrs) => Object.entries(attrs).reduce((el, [k, v]) => (el.setAttribute(k, v), el), document.createElementNS("http://www.w3.org/2000/svg", tag));
for (let i = 0; i < 36; i++) {
  const a = i * Math.PI / 18, r1 = i % 6 ? 59 : 57, r2 = i % 6 ? 64 : 70;
  document.getElementById("ticks").append(svg("line", { x1: Math.sin(a) * r1, y1: -Math.cos(a) * r1, x2: Math.sin(a) * r2, y2: -Math.cos(a) * r2 }));
}
for (let i = 0; i < 18; i++) document.getElementById("grille").append(svg("circle", { cx: 250 + (i % 6) * 12, cy: 58 + Math.floor(i / 6) * 12, r: 2 }));
</script>
</body>
</html>
