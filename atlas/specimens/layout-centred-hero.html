<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Centred hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(100% 0 0);
  --surface: oklch(97.6% 0.003 255);
  --line: oklch(91.5% 0.005 255);
  --fill: oklch(93% 0.005 255);
  --fill-2: oklch(87.5% 0.007 255);
  --text: oklch(23% 0.012 255);
  --muted: oklch(52% 0.012 255);
  --accent: oklch(56% 0.2 260);
  --accent-soft: oklch(95.5% 0.025 260);
  --radius: 8px;
  --sans: "Inter", sans-serif;
  --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body { position: relative; color: var(--text); font-family: var(--sans); text-align: center; }
.bar { display: block; height: 7px; border-radius: 4px; background: var(--fill); }

.nav { height: 60px; margin: 0 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--text); }
.links { display: flex; gap: 20px; }
.links i { width: 42px; height: 7px; border-radius: 4px; background: var(--fill-2); }
.nav-cta { justify-self: end; width: 84px; height: 30px; border-radius: var(--radius); border: 1px solid var(--line); }

/* [Agent] Everything sits on one centre axis; the headline is held to ~16 characters a line so the centred block stays a compact shape. */
.hero { width: 560px; margin: 22px auto 0; }
.eyebrow { display: inline-block; margin: 0 0 16px; padding: 5px 11px; border-radius: 99px; background: var(--accent-soft); font: 500 11.5px/1 var(--mono); color: var(--accent); }
h1 { max-width: 16ch; margin: 0 auto; font-size: 50px; line-height: 1.04; font-weight: 600; letter-spacing: -0.035em; }
.sub { margin: 16px 0 22px; font-size: 15px; line-height: 1.5; color: var(--muted); }
.actions { display: flex; justify-content: center; gap: 10px; }
.btn { padding: 11px 18px; border-radius: var(--radius); background: var(--accent); color: white; font-size: 13.5px; font-weight: 500; }
.btn-ghost { width: 110px; border-radius: var(--radius); border: 1px solid var(--line); display: grid; place-items: center; }
.btn-ghost::after { content: ""; width: 58px; height: 7px; border-radius: 4px; background: var(--fill-2); }

/* [Agent] The framed screenshot sits under the fold line with a soft accent glow behind it; the page edge crops its bottom on purpose. */
.glow { position: absolute; left: 50%; top: 340px; width: 660px; height: 260px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, oklch(56% 0.2 260 / 0.34), transparent); filter: blur(10px); }
.shot { position: absolute; left: 80px; right: 80px; top: 368px; height: 220px; margin: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 6px oklch(97% 0.005 255), 0 30px 60px -20px oklch(30% 0.05 260 / 0.25); overflow: hidden; display: grid; grid-template-columns: 120px 1fr; grid-template-rows: 28px 1fr; text-align: left; }
.chrome { grid-column: 1 / 3; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
.chrome i { width: 8px; height: 8px; border-radius: 50%; background: var(--fill-2); }
.side { padding: 16px 14px; display: grid; align-content: start; gap: 12px; border-right: 1px solid var(--line); }
.side .on { background: var(--accent); opacity: 0.5; }
.main { padding: 16px; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; align-content: start; background: var(--bg); }
.tile { height: 82px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); display: grid; align-content: start; gap: 10px; }
.card p { margin: 0; }
.label { font-size: 10.5px; color: var(--muted); }
.num { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.cap { font-size: 10.5px; color: var(--muted); }
.card { gap: 5px; }
</style>
</head>
<body>
<nav class="nav">
  <span class="logo"></span>
  <span class="links"><i></i><i></i><i></i><i></i></span>
  <span class="nav-cta"></span>
</nav>

<main class="hero">
  <p class="eyebrow">Introducing Keep</p>
  <h1>Make something people keep</h1>
  <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
  <div class="actions"><span class="btn">Start a project</span><span class="btn-ghost"></span></div>
</main>

<div class="glow" aria-hidden="true"></div>
<figure class="shot">
  <div class="chrome"><i></i><i></i><i></i></div>
  <div class="side">
    <span class="bar on" style="width:70%"></span><span class="bar" style="width:84%"></span><span class="bar" style="width:62%"></span><span class="bar" style="width:76%"></span>
  </div>
  <div class="main">
    <div class="tile card">
      <p class="label">Still in use</p>
      <p class="num">1,284</p>
      <p class="cap">projects made since 2019</p>
    </div>
    <div class="tile"><span class="bar" style="width:50%"></span><span class="bar" style="width:70%;height:14px;background:var(--fill-2)"></span><span class="bar" style="width:84%"></span></div>
    <div class="tile"><span class="bar" style="width:44%"></span><span class="bar" style="width:60%;height:14px;background:var(--fill-2)"></span><span class="bar" style="width:76%"></span></div>
  </div>
</figure>
</body>
</html>
