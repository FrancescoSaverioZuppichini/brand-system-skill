<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surrealism</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=DM+Mono:wght@400&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --sky: oklch(0.80 0.07 230);
  --sky-high: oklch(0.66 0.09 240);
  --sand: oklch(0.88 0.04 75);
  --sand-far: oklch(0.80 0.05 70);
  --shadow: oklch(0.30 0.03 260);
  --cloud: oklch(0.97 0.01 240);
  --accent: oklch(0.62 0.17 30);
  --display: "Instrument Serif", serif;
  --text: "Inter", sans-serif;
  --mono: "DM Mono", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--sky); }
body { position: relative; font-family: var(--text); color: var(--shadow); }
.scene { position: absolute; inset: 0; }

.copy { position: absolute; left: 60px; top: 46px; width: 430px; }
.eyebrow { margin: 0; font: 400 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
h1 { margin: 14px 0 0; font: 400 66px/0.95 var(--display); letter-spacing: -.01em; color: var(--shadow); }
h1 em { color: var(--accent); }
.sub { margin: 18px 0 0; font: 400 15px/1.5 var(--text); }
.button { margin-top: 22px; padding: 12px 22px; border: 0; background: var(--shadow); color: var(--cloud); font: 500 14px var(--text); }

/* [Agent] The card stands on the sand like any other object, so it gets the same low sun: a long skewed shadow to the left. */
.card { position: absolute; left: 92px; top: 376px; width: 170px; padding: 12px 16px 14px; background: var(--cloud); }
.card::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -16px; height: 16px; background: var(--shadow); opacity: .35;
  transform: skewX(-72deg); transform-origin: 0 0; filter: blur(1.5px);
}
.card .label { font: 400 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.card .num { font: 400 40px/1.05 var(--display); }
.card .cap { font: 400 12px var(--text); }
</style>
</head>
<body>
  <svg class="scene" viewBox="0 0 800 500" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--sky-high)"/>
        <stop offset=".64" stop-color="oklch(0.90 0.035 220)"/>
      </linearGradient>
      <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--sand-far)"/>
        <stop offset=".35" stop-color="var(--sand)"/>
        <stop offset="1" stop-color="oklch(0.91 0.035 78)"/>
      </linearGradient>
      <filter id="puff" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
      <!-- [Agent] Flatten whatever is drawn into one shadow colour (its alpha only), then soften the edge. -->
      <filter id="cast" x="-10%" y="-50%" width="120%" height="200%">
        <feFlood flood-color="oklch(0.30 0.03 260)"/>
        <feComposite in2="SourceAlpha" operator="in"/>
        <feGaussianBlur stdDeviation="1.6"/>
      </filter>
      <!-- [Agent] An impossible triangle: three cube edges (x, then y, then z) projected isometrically land back on their start; redrawing the first corner on top closes the loop. -->
      <g id="penrose">
        <polygon class="fx" points="-25,-259.8 -50,-216.5 0,-216.5 25,-259.8"/>
        <polygon class="fy" points="75,0 -50,-216.5 0,-216.5 125,0"/>
        <polygon class="fz" points="150,-43.3 25,-259.8 0,-216.5 125,0"/>
        <polygon class="fx" points="-25,-259.8 -150,-43.3 -100,-43.3 25,-259.8"/>
        <polygon class="fy" points="-125,0 -150,-43.3 -100,-43.3 -75,0"/>
        <polygon class="fz" points="50,-216.5 25,-259.8 -100,-43.3 -75,0"/>
        <polygon class="fx" points="-125,-86.6 -150,-43.3 100,-43.3 125,-86.6"/>
        <polygon class="fy" points="-125,0 -150,-43.3 100,-43.3 125,0"/>
        <polygon class="fz" points="150,-43.3 125,-86.6 100,-43.3 125,0"/>
        <polygon class="fy" points="75,0 50,-43.3 100,-43.3 125,0"/>
      </g>
    </defs>
    <style>
      .fx { fill: oklch(0.47 0.14 30); } .fy { fill: var(--accent); } .fz { fill: oklch(0.80 0.10 45); }
    </style>
    <rect width="800" height="330" fill="url(#sky)"/>
    <g fill="var(--cloud)" filter="url(#puff)" opacity=".95">
      <ellipse cx="560" cy="86" rx="70" ry="22"/><ellipse cx="596" cy="70" rx="40" ry="24"/><ellipse cx="530" cy="74" rx="30" ry="18"/>
      <ellipse cx="730" cy="190" rx="54" ry="14"/><ellipse cx="756" cy="178" rx="28" ry="16"/>
      <ellipse cx="420" cy="250" rx="60" ry="10"/>
    </g>
    <rect y="330" width="800" height="170" fill="url(#sand)"/>
    <rect y="329" width="800" height="1.5" fill="oklch(0.72 0.05 70)"/>
    <!-- [Agent] The shadow is the object itself sheared flat along the ground: x moves left with height, y squashes to a sliver. -->
    <g transform="translate(600 414) scale(.85) matrix(1 0 1.55 -.2 0 0)" opacity=".42" filter="url(#cast)">
      <use href="#penrose"/>
    </g>
    <use href="#penrose" transform="translate(600 414) scale(.85)"/>
  </svg>

  <div class="copy">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something people <em>keep</em></h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <button class="button">Start a project</button>
  </div>

  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
  </div>
</body>
</html>
