<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Documentary photography</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;600;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=block">
<style>
:root {
  color-scheme: light;
  --white: oklch(0.99 0 0);
  --black: oklch(0.15 0 0);
  --grey: oklch(0.60 0 0);
  --caption: oklch(0.40 0 0);
  --rule: oklch(0.85 0 0);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
body { font-family: "Libre Franklin", sans-serif; color: var(--black); position: relative; }

.copy { position: absolute; left: 40px; top: 40px; width: 250px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding-top: 10px; border-top: 3px solid var(--black); display: inline-block; }
h1 { font: 500 38px/1.06 "Newsreader", serif; letter-spacing: -.015em; margin: 14px 0 14px; }
p { font-size: 13.5px; line-height: 1.55; color: var(--caption); margin: 0 0 22px; }
.btn { display: inline-block; font-size: 13px; font-weight: 600; padding: 12px 18px; background: var(--black); color: var(--white); }

.print { position: absolute; left: 316px; top: 40px; width: 450px; height: 316px; background: var(--black); }
.print svg { position: absolute; left: 14px; top: 20px; width: 422px; height: 276px; }
/* [Agent] The film rebate: frame numbers in the black border prove the frame is uncropped, a documentary convention. */
.rebate { position: absolute; left: 14px; right: 14px; font: 500 8px/1 "IBM Plex Mono", monospace; color: oklch(0.55 0 0); letter-spacing: .1em; display: flex; justify-content: space-between; }
.rebate.top { top: 6px; } .rebate.bottom { bottom: 6px; }
.caption { position: absolute; left: 316px; top: 366px; width: 450px; font: 400 11px/1.45 "IBM Plex Mono", monospace; color: var(--caption); }

.card { position: absolute; left: 316px; top: 410px; width: 450px; border-top: 1px solid var(--rule); padding-top: 12px; display: flex; align-items: baseline; gap: 14px; }
.card small { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.card b { font: 500 34px/1 "Newsreader", serif; }
.card span { font-size: 13px; color: var(--caption); }
</style>
</head>
<body>
<div class="copy">
  <div class="eyebrow">Introducing Keep</div>
  <h1>Make something people keep</h1>
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn">Start a project</span>
</div>

<div class="print">
  <div class="rebate top"><span>14</span><span>&#9654; 14A</span><span>15</span></div>
  <svg viewBox="0 0 480 314" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="wall" x2="1"><stop offset="0" stop-color="#7a7a7a"/><stop offset=".5" stop-color="#4a4a4a"/><stop offset="1" stop-color="#262626"/></linearGradient>
      <linearGradient id="floor" x2="0" y2="1"><stop offset="0" stop-color="#3c3c3c"/><stop offset="1" stop-color="#141414"/></linearGradient>
      <linearGradient id="body" x2="1"><stop offset="0" stop-color="#8c8c8c"/><stop offset=".25" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1a1a1a"/></linearGradient>
      <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="1"/></filter>
      <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6 1"/></filter>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="9"/><feColorMatrix type="saturate" values="0"/></filter>
    </defs>
    <g filter="url(#soft)">
      <rect width="480" height="230" fill="url(#wall)"/>
      <rect x="124" y="24" width="182" height="172" fill="#f4f4f4" filter="url(#bloom)" opacity=".75"/>
      <rect x="130" y="30" width="170" height="160" fill="#efefef"/>
      <path d="M215 30v160M130 110h170" stroke="#444" stroke-width="7"/>
      <rect y="226" width="480" height="88" fill="url(#floor)"/>
      <polygon points="130,232 300,232 400,314 120,314" fill="#a0a0a0" opacity=".35" filter="url(#bloom)"/>

      <g fill="#222"><rect x="356" y="70" width="4" height="40"/><rect x="348" y="66" width="20" height="8"/><rect x="384" y="72" width="3" height="46"/><circle cx="420" cy="84" r="12" fill="none" stroke="#222" stroke-width="3"/><rect x="446" y="70" width="5" height="50"/></g>

      <ellipse cx="250" cy="98" rx="14" ry="16" fill="#161616"/>
      <circle cx="238" cy="86" r="7" fill="#161616"/>
      <rect x="244" y="108" width="12" height="16" fill="#161616"/>
      <path fill="#181818" d="M226 128C236 118 266 116 280 124C292 132 296 160 300 200H222C220 170 220 140 226 128Z"/>
      <path d="M284 132q24 26 40 62" stroke="#181818" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M230 136q-6 40 34 60" stroke="#262626" stroke-width="13" fill="none" stroke-linecap="round" filter="url(#blur)"/>
      <rect x="124" y="24" width="182" height="172" fill="#fff" filter="url(#bloom)" opacity=".18"/>

      <path d="M352 0v52" stroke="#111" stroke-width="2"/>
      <path d="M338 52h28l8 18h-44z" fill="#151515"/>
      <ellipse cx="352" cy="72" rx="16" ry="4" fill="#e6e6e6" filter="url(#bloom)" opacity=".8"/>

      <rect x="60" y="198" width="400" height="14" fill="#141414"/>
      <rect x="60" y="196" width="400" height="3" fill="#8a8a8a"/>
      <rect x="80" y="212" width="12" height="90" fill="#0e0e0e"/>
      <rect x="432" y="212" width="12" height="90" fill="#0e0e0e"/>
      <rect x="370" y="178" width="58" height="20" fill="#3a3a3a"/>
      <rect x="370" y="178" width="58" height="3" fill="#8a8a8a"/>
      <path d="M232 194l110-8 2 6-110 8z" fill="#6a6a6a"/>
    </g>
    <rect width="480" height="314" filter="url(#grain)" opacity=".4" style="mix-blend-mode:overlay"/>
  </svg>
  <div class="rebate bottom"><span>&#9654; 14</span><span>14A</span></div>
</div>
<div class="caption">A furniture maker at her bench. Porto, March 2019.</div>

<div class="card">
  <small>Still in use</small>
  <b>1,284</b>
  <span>projects made since 2019</span>
</div>
</body>
</html>
