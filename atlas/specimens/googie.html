<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Googie / Atomic age</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@1,700&family=Bungee&family=Jost:wght@400;600&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --cream: oklch(0.95 0.03 90);
  --turquoise: oklch(0.72 0.11 195);
  --coral: oklch(0.70 0.15 35);
  --mustard: oklch(0.80 0.14 85);
  --ink: oklch(0.25 0.03 250);
  --script: "Lobster Two", cursive;
  --display: "Bungee", sans-serif;
  --text: "Jost", sans-serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cream); }
body { position: relative; font-family: var(--text); color: var(--ink); }
.ornament { position: absolute; inset: 0; }

/* [Agent] The whole sign leans, as if hung off a cantilevered roof; one rotation on the group, nothing else is tilted inside it. */
.sign { position: absolute; left: 64px; top: 70px; width: 470px; transform: rotate(-5deg); transform-origin: 0 0; }
.eyebrow { margin: 0; font: italic 700 30px var(--script); color: var(--coral); }
h1 { margin: 4px 0 0; font-weight: 400; }
h1 .caps { display: block; font: 42px/1 var(--display); letter-spacing: .02em; text-shadow: 4px 4px 0 var(--turquoise); }
h1 .script { display: block; margin: 2px 0 0 26px; font: italic 700 64px/1.05 var(--script); color: var(--coral); text-shadow: 3px 3px 0 var(--ink); }
.sub { margin: 14px 0 0; font: 400 16px/1.5 var(--text); }
.button {
  margin-top: 20px; padding: 12px 26px 10px; border: 3px solid var(--ink); border-radius: 999px;
  background: var(--mustard); color: var(--ink); font: 15px var(--display); letter-spacing: .04em;
}

.card {
  position: absolute; left: 538px; top: 250px; width: 196px; padding: 26px 22px 30px 34px;
  background: var(--turquoise); color: var(--ink); transform: rotate(7deg);
  border-radius: 62% 38% 52% 48% / 46% 58% 42% 54%; border: 3px solid var(--ink);
}
.card .label { font: 600 12px var(--text); letter-spacing: .18em; text-transform: uppercase; }
.card .num { font: 46px/1.05 var(--display); color: var(--cream); text-shadow: 3px 3px 0 var(--ink); }
.card .cap { font: 400 14px var(--text); }
</style>
</head>
<body>
  <svg class="ornament" viewBox="0 0 800 500" aria-hidden="true">
    <defs>
      <!-- [Agent] Formica boomerang print: one small tile of boomerangs and dots, very faint, so the wall reads 1955. -->
      <path id="boom" d="M0 0 C10 -12 26 -14 36 -6 C26 -8 16 -4 8 4 C6 14 10 24 18 30 C6 26 -2 12 0 0Z"/>
      <pattern id="formica" width="120" height="96" patternUnits="userSpaceOnUse">
        <use href="#boom" x="14" y="24" fill="var(--turquoise)" opacity=".28"/>
        <use href="#boom" transform="translate(84 62) rotate(140)" fill="var(--coral)" opacity=".24"/>
        <use href="#boom" transform="translate(70 18) rotate(60) scale(.7)" fill="var(--mustard)" opacity=".4"/>
        <g fill="var(--ink)" opacity=".18"><circle cx="50" cy="50" r="1.6"/><circle cx="104" cy="30" r="1.6"/><circle cx="24" cy="80" r="1.6"/></g>
      </pattern>
      <!-- [Agent] Sputnik starburst: alternating long and short rays, each ending in a dot. -->
      <g id="sputnik" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round">
        <g id="ray2"><line y2="-46"/><circle cy="-46" r="5" fill="var(--ink)" stroke="none"/><line y2="-28" transform="rotate(22.5)"/><circle cy="-28" r="3.5" fill="var(--ink)" stroke="none" transform="rotate(22.5)"/></g>
        <use href="#ray2" transform="rotate(45)"/><use href="#ray2" transform="rotate(90)"/><use href="#ray2" transform="rotate(135)"/>
        <use href="#ray2" transform="rotate(180)"/><use href="#ray2" transform="rotate(225)"/><use href="#ray2" transform="rotate(270)"/><use href="#ray2" transform="rotate(315)"/>
        <circle r="9" fill="var(--mustard)"/>
      </g>
      <path id="sparkle" d="M0 -16 C2 -4 4 -2 16 0 C4 2 2 4 0 16 C-2 4 -4 2 -16 0 C-4 -2 -2 -4 0 -16Z"/>
    </defs>
    <rect width="800" height="500" fill="url(#formica)" opacity=".6"/>
    <!-- big boomerang slab behind the sign -->
    <path fill="oklch(0.87 0.06 195)" d="M24 230 C80 70 300 0 520 40 C380 60 210 120 150 270 C130 330 140 400 170 470 C70 420 0 330 24 230Z"/>
    <!-- coral parabola arcing behind the card -->
    <path fill="none" stroke="var(--coral)" stroke-width="14" stroke-linecap="round" d="M470 500 C520 300 640 170 790 150"/>
    <use href="#sputnik" transform="translate(668 110)"/>
    <use href="#sputnik" transform="translate(460 446) scale(.5)"/>
    <g fill="var(--mustard)" stroke="var(--ink)" stroke-width="2">
      <use href="#sparkle" transform="translate(560 60)"/>
      <use href="#sparkle" transform="translate(754 252) scale(.8)"/>
      <use href="#sparkle" transform="translate(40 470) scale(.7)"/>
    </g>
    <!-- atom -->
    <g transform="translate(486 214)" fill="none" stroke="var(--ink)" stroke-width="2">
      <ellipse rx="34" ry="11"/><ellipse rx="34" ry="11" transform="rotate(60)"/><ellipse rx="34" ry="11" transform="rotate(-60)"/>
      <circle r="5" fill="var(--coral)" stroke="none"/>
    </g>
  </svg>

  <div class="sign">
    <p class="eyebrow">Introducing Keep</p>
    <h1><span class="caps">MAKE SOMETHING</span><span class="script">people keep</span></h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <button class="button">START A PROJECT</button>
  </div>

  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
  </div>
</body>
</html>
