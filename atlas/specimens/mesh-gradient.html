<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mesh gradient</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --white: oklch(0.99 0 0);
  --ink: oklch(0.25 0.04 265);
  --muted: oklch(0.45 0.03 265);
  --orange: oklch(0.74 0.18 55);
  --magenta: oklch(0.63 0.26 345);
  --purple: oklch(0.52 0.24 295);
  --cyan: oklch(0.80 0.13 215);
  --yellow: oklch(0.86 0.16 85);
  --guide: oklch(0.25 0.04 265 / .07);
  --sans: "Schibsted Grotesk", sans-serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
body { position: relative; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }

.guides { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--guide) 0 1px, transparent 1px 190px) 40px 0; }
/* [Agent] Skew the band so its bottom edge climbs to the right; the blurred child blends the radial stops into one smooth mesh. */
.band { position: absolute; left: 0; top: -260px; width: 100%; height: 590px; overflow: hidden; transform: skewY(-12deg); transform-origin: 0 100%; }
.mesh { position: absolute; inset: -80px; filter: blur(28px);
  background:
    radial-gradient(40% 55% at 12% 78%, var(--yellow), transparent 70%),
    radial-gradient(45% 60% at 30% 92%, var(--orange), transparent 70%),
    radial-gradient(45% 70% at 52% 70%, var(--magenta), transparent 72%),
    radial-gradient(40% 60% at 78% 88%, var(--purple), transparent 70%),
    radial-gradient(50% 70% at 92% 55%, var(--cyan), transparent 72%),
    radial-gradient(50% 60% at 40% 30%, var(--purple), transparent 70%),
    var(--magenta); }

.eyebrow { position: absolute; left: 44px; top: 40px; margin: 0; font-size: 14px; font-weight: 600; color: var(--white); }
/* [Agent] Colour-burn lets the dark headline pick up the hues of the field where they overlap, and stays plain ink on white. */
h1 { position: absolute; left: 40px; top: 66px; margin: 0; font-size: 80px; font-weight: 700; line-height: .96; letter-spacing: -0.045em; mix-blend-mode: color-burn; color: var(--ink); }
.sub { position: absolute; left: 44px; top: 344px; margin: 0; font-size: 17px; line-height: 1.55; color: var(--muted); }
.cta { position: absolute; left: 44px; top: 422px; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--white);
  font-size: 15px; font-weight: 600; text-decoration: none; }
.cta::after { content: " \203A"; }

.card { position: absolute; left: 548px; top: 222px; width: 210px; padding: 18px 20px; background: var(--white); border-radius: 8px;
  box-shadow: 0 30px 60px -12px oklch(0.30 0.06 265 / .25), 0 18px 36px -18px oklch(0 0 0 / .3); }
.card .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.card .num { display: block; margin: 4px 0 2px; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
.card .cap { font-size: 13px; color: var(--muted); }
.card svg { display: block; margin-top: 14px; width: 100%; height: 40px; }
</style>
</head>
<body>
<div class="guides"></div>
<div class="band"><div class="mesh"></div></div>

<p class="eyebrow">Introducing Keep</p>
<h1>Make something<br>people keep</h1>
<p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<a class="cta" href="#">Start a project</a>

<aside class="card">
  <span class="label">Still in use</span>
  <span class="num">1,284</span>
  <span class="cap">projects made since 2019</span>
  <svg viewBox="0 0 170 40" preserveAspectRatio="none"><defs><linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="var(--orange)"/><stop offset=".5" stop-color="var(--magenta)"/><stop offset="1" stop-color="var(--purple)"/></linearGradient></defs><path d="M0 34 L20 30 L40 31 L60 24 L80 26 L100 18 L120 15 L140 9 L170 4" fill="none" stroke="url(#spark)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
</aside>
</body>
</html>
