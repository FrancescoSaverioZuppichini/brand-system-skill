<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crypto / web3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=block">
<style>
  :root {
    color-scheme: dark;
    --void: oklch(0.13 0.02 280);
    --violet: oklch(0.58 0.24 295);
    --cyan: oklch(0.82 0.14 205);
    --gain: oklch(0.85 0.20 150);
    --text: oklch(0.96 0.01 280);
    --dim: oklch(0.75 0.03 280);
    --glass: oklch(0.96 0.01 280 / 0.07);
    --glass-line: oklch(0.96 0.01 280 / 0.16);
    --grad: linear-gradient(100deg, var(--violet), var(--cyan));
    --display: "Sora", sans-serif;
    --ui: "Inter", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--void); }
  body { position: relative; color: var(--text); font-family: var(--ui); }
  .art { position: absolute; inset: 0; }

  .copy { position: absolute; left: 48px; top: 84px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); font-size: 13px; font-weight: 500; }
  .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--gain); box-shadow: 0 0 10px var(--gain); }
  h1 { font-family: var(--display); font-weight: 600; font-size: 54px; line-height: 1.05; letter-spacing: -0.03em; margin: 22px 0 18px; }
  h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--dim); white-space: nowrap; }
  .cta { display: inline-block; margin-top: 30px; padding: 15px 28px; border-radius: 999px; background: var(--grad); color: oklch(0.99 0 0); font-family: var(--display); font-weight: 600; font-size: 15px; box-shadow: 0 0 32px oklch(0.58 0.24 295 / 0.6), inset 0 1px 0 oklch(1 0 0 / 0.35); }

  .card { position: absolute; left: 556px; top: 330px; width: 196px; padding: 16px 18px; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .card .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .card .num { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 38px; letter-spacing: -0.02em; margin: 4px 0 2px; }
  .card .num svg { margin-top: 4px; }
  .card .cap { font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
  <!-- [Agent] Blurred colour orbs, a node network and a 3D coin built from stacked ellipses with a radial sheen. -->
  <svg class="art" width="800" height="500" viewBox="0 0 800 500">
    <defs>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
      <radialGradient id="face" cx="0.32" cy="0.28" r="0.85"><stop offset="0" stop-color="oklch(0.90 0.10 205)"/><stop offset="0.35" stop-color="oklch(0.66 0.20 270)"/><stop offset="0.75" stop-color="oklch(0.45 0.22 295)"/><stop offset="1" stop-color="oklch(0.30 0.16 295)"/></radialGradient>
      <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="oklch(0.30 0.14 295)"/><stop offset="0.5" stop-color="oklch(0.42 0.20 290)"/><stop offset="1" stop-color="oklch(0.22 0.10 295)"/></linearGradient>
      <linearGradient id="emblem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.98 0.03 205)"/><stop offset="1" stop-color="oklch(0.80 0.12 230)"/></linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="640" cy="160" r="150" fill="oklch(0.58 0.24 295)" opacity="0.55" filter="url(#blur)"/>
    <circle cx="520" cy="360" r="110" fill="oklch(0.82 0.14 205)" opacity="0.35" filter="url(#blur)"/>
    <circle cx="80" cy="470" r="120" fill="oklch(0.58 0.24 295)" opacity="0.3" filter="url(#blur)"/>
    <!-- network -->
    <g fill="none" stroke="oklch(0.82 0.14 205)" stroke-opacity="0.22" stroke-width="1">
      <path d="M430 60 L520 110 L470 200 M520 110 L760 70 L740 280 L700 420 M470 200 L430 300 L520 460 M760 70 L790 180"/>
    </g>
    <g fill="oklch(0.82 0.14 205)" filter="url(#glow)">
      <circle cx="430" cy="60" r="2.5"/><circle cx="520" cy="110" r="3"/><circle cx="470" cy="200" r="2"/><circle cx="760" cy="70" r="3"/><circle cx="740" cy="280" r="2.5"/><circle cx="430" cy="300" r="2"/><circle cx="790" cy="180" r="2"/>
    </g>
    <!-- orbit (back half) -->
    <ellipse cx="610" cy="200" rx="190" ry="52" transform="rotate(-14 610 200)" fill="none" stroke="oklch(0.82 0.14 205)" stroke-opacity="0.35" stroke-width="1.2"/>
    <!-- coin -->
    <g transform="translate(612 196) rotate(-10)">
      <ellipse cx="18" cy="0" rx="92" ry="122" fill="url(#edge)"/>
      <rect x="0" y="-122" width="18" height="244" fill="url(#edge)"/>
      <ellipse cx="0" cy="0" rx="92" ry="122" fill="url(#face)"/>
      <ellipse cx="0" cy="0" rx="76" ry="102" fill="none" stroke="oklch(0.96 0.01 280 / 0.35)" stroke-width="2"/>
      <polygon points="0,-52 42,-26 42,26 0,52 -42,26 -42,-26" fill="url(#emblem)"/>
      <polygon points="0,-52 42,-26 0,0 -42,-26" fill="oklch(1 0 0 / 0.55)"/>
      <polygon points="0,0 42,-26 42,26 0,52" fill="oklch(0.62 0.20 280 / 0.45)"/>
      <ellipse cx="-38" cy="-62" rx="18" ry="38" transform="rotate(30 -38 -62)" fill="oklch(1 0 0 / 0.28)"/>
    </g>
    <!-- orbit (front arc) -->
    <path d="M 430 262 A 190 52 -14 0 0 795 160" transform="" fill="none" stroke="oklch(0.82 0.14 205)" stroke-width="1.6" stroke-opacity="0.8"/>
    <circle cx="436" cy="262" r="5" fill="oklch(0.85 0.20 150)" filter="url(#glow)"/>
    <!-- hex grid -->
    <g fill="none" stroke="oklch(0.96 0.01 280)" stroke-opacity="0.07">
      <path d="M40 30 l14 -8 l14 8 v16 l-14 8 l-14 -8 Z M68 30 l14 -8 l14 8 v16 l-14 8 l-14 -8 Z M54 54 l14 -8 l14 8 v16 l-14 8 l-14 -8 Z"/>
    </g>
  </svg>

  <div class="copy">
    <span class="eyebrow"><i></i>Introducing Keep</span>
    <h1>Make something<br>people <span>keep</span></h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project</span>
  </div>

  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284 <svg width="14" height="12" viewBox="0 0 14 12"><path d="M7 0 14 12H0Z" fill="var(--gain)"/></svg></div>
    <div class="cap">projects made since 2019</div>
  </div>
</body>
</html>
