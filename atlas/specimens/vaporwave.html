<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vaporwave</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=VT323&family=Zen+Kaku+Gothic+New:wght@700&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --pink: oklch(0.78 0.14 350);
  --teal: oklch(0.78 0.11 195);
  --lavender: oklch(0.78 0.10 300);
  --purple: oklch(0.30 0.12 300);
  --sunset: oklch(0.75 0.16 50);
  --silver: oklch(0.80 0 0);
  --hi: oklch(1 0 0);
  --lo: oklch(0.55 0 0);
  --dark: oklch(0.15 0 0);
  --wide: "Michroma", sans-serif;
  --system: "VT323", monospace;
  --jp: "Zen Kaku Gothic New", sans-serif;
  /* [Agent] Windows 95 bevel: two light and two dark one-pixel inset edges. */
  --bevel: inset -1px -1px var(--dark), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px oklch(0.90 0 0);
  --sunken: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dark), inset -2px -2px oklch(0.90 0 0);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden;
  background: linear-gradient(var(--purple), var(--lavender) 34%, var(--pink) 50%, var(--sunset) 60%, var(--sunset) 60%, var(--purple) 60%); }
body { position: relative; font-family: var(--system); color: var(--dark); }
body > * { position: absolute; margin: 0; }

.floor { left: -300px; right: -300px; top: 300px; height: 520px; transform: perspective(300px) rotateX(70deg); transform-origin: 50% 0;
  background: repeating-conic-gradient(var(--teal) 0 25%, var(--lavender) 0 50%) 0 0 / 80px 80px;
  -webkit-mask: linear-gradient(transparent, #000 25%); mask: linear-gradient(transparent, #000 25%); }
.sun { left: 470px; top: 120px; width: 220px; height: 220px; border-radius: 50%; background: linear-gradient(var(--pink), var(--sunset)); opacity: .9; }
.palm { left: 596px; top: 104px; width: 190px; height: 300px; }
.column { left: 560px; top: 112px; width: 92px; height: 300px; }
.kana { right: 14px; top: 22px; writing-mode: vertical-rl; font: 700 44px/1 var(--jp); letter-spacing: .2em; color: var(--hi); text-shadow: 3px 3px 0 var(--pink); }

.win { background: var(--silver); box-shadow: var(--bevel), 8px 8px 0 oklch(0.30 0.12 300 / .35); padding: 3px; }
.bar { display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 3px 0 6px; background: linear-gradient(90deg, var(--purple), var(--pink));
  color: var(--hi); font-size: 19px; }
.bar span { margin-right: auto; }
.bar b { width: 16px; height: 14px; background: var(--silver); box-shadow: var(--bevel); }
.main { left: 40px; top: 50px; width: 474px; }
.body { padding: 22px 24px 24px; background: linear-gradient(oklch(0.96 0.03 330), oklch(0.93 0.04 280)); box-shadow: var(--sunken); margin-top: 3px; }
.eyebrow { margin: 0; font-size: 22px; color: var(--purple); letter-spacing: .08em; }
h1 { margin: 10px 0 0; font: 400 25px/1.35 var(--wide); letter-spacing: .14em; text-transform: uppercase; color: var(--purple);
  text-shadow: -2px 0 var(--teal), 2px 0 var(--pink); }
.sub { margin: 12px 0 0; font-size: 19px; line-height: 1.05; color: oklch(0.30 0.12 300 / .85); }
.cta { display: inline-block; margin-top: 16px; padding: 6px 18px; background: var(--silver); box-shadow: var(--bevel), 0 0 0 1px var(--dark);
  font-size: 21px; color: var(--dark); text-decoration: none; }

.card { left: 352px; top: 326px; width: 236px; }
.card .body { padding: 10px 14px 12px; }
.card .num { display: block; font: 400 30px/1.2 var(--wide); letter-spacing: .08em; color: var(--purple); text-shadow: -2px 0 var(--teal), 2px 0 var(--pink); }
.card .cap { font-size: 20px; }
.scan { inset: 0; background: repeating-linear-gradient(oklch(0 0 0 / .07) 0 1px, transparent 1px 3px); pointer-events: none; }
</style>
</head>
<body>
<div class="sun"></div>
<div class="floor"></div>
<svg class="palm" viewBox="0 0 190 300" aria-hidden="true"><g fill="none" stroke="var(--teal)" stroke-linecap="round">
  <path d="M70 300 C 74 220 90 140 112 74" stroke-width="10"/>
  <g stroke-width="9"><path d="M112 74 Q 70 40 20 70"/><path d="M112 74 Q 90 20 40 14"/><path d="M112 74 Q 130 18 176 22"/><path d="M112 74 Q 160 60 186 108"/><path d="M112 74 Q 70 80 52 132"/><path d="M112 74 Q 140 100 140 150"/></g></g></svg>
<svg class="column" viewBox="0 0 92 300" aria-hidden="true">
  <defs><linearGradient id="marble" x1="0" x2="1"><stop offset="0" stop-color="oklch(0.82 0.06 300)"/><stop offset=".35" stop-color="oklch(0.99 0.01 300)"/><stop offset="1" stop-color="oklch(0.72 0.08 300)"/></linearGradient></defs>
  <g fill="url(#marble)"><rect x="0" y="0" width="92" height="9"/><rect x="10" y="9" width="72" height="14" rx="4"/>
    <circle cx="12" cy="20" r="11"/><circle cx="80" cy="20" r="11"/><polygon points="17,24 75,24 78,276 14,276"/><rect x="8" y="276" width="76" height="9"/><rect x="2" y="285" width="88" height="15"/></g>
  <g fill="none" stroke="oklch(0.62 0.08 300)"><circle cx="12" cy="20" r="5"/><circle cx="80" cy="20" r="5"/><path d="M28 30 V270 M40 30 V272 M52 30 V272 M64 30 V270"/></g>
</svg>
<p class="kana">キープ</p>

<section class="win main">
  <div class="bar"><span>Keep</span><b></b><b></b><b></b></div>
  <div class="body">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <a class="cta" href="#">Start a project</a>
  </div>
</section>

<aside class="win card">
  <div class="bar"><span>Still in use</span><b></b></div>
  <div class="body">
    <span class="num">1,284</span>
    <span class="cap">projects made since 2019</span>
  </div>
</aside>
<div class="scan"></div>
</body>
</html>
