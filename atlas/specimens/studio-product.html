<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio product photography</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif&family=Inter+Tight:wght@400;500;600&display=block">
<style>
:root {
  color-scheme: light;
  --sweep: oklch(0.93 0.01 250);
  --sweep-shadow: oklch(0.80 0.01 250);
  --product: oklch(0.35 0.08 30);
  --product-dark: oklch(0.20 0.05 30);
  --product-lit: oklch(0.62 0.07 35);
  --highlight: oklch(0.98 0 0);
  --ink: oklch(0.18 0 0);
  --muted: oklch(0.45 0.01 250);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--sweep); }
/* [Agent] The seamless sweep: a hot spot where the softbox lands, falling off to the edges, and a soft band where wall bends into floor. */
body { font-family: "Inter Tight", sans-serif; color: var(--ink); position: relative;
  background:
    radial-gradient(ellipse 60% 55% at 50% 58%, var(--highlight), transparent 70%),
    linear-gradient(180deg, var(--sweep-shadow) 0%, var(--sweep) 45%, oklch(0.90 0.01 250) 70%, var(--sweep) 100%); }

.top { position: absolute; left: 0; right: 0; top: 34px; text-align: center; }
.eyebrow { font: 500 11px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--product); }
h1 { font: 400 54px/1 "Instrument Serif", serif; letter-spacing: -.01em; margin: 12px 0 0; }

.side { position: absolute; left: 56px; top: 250px; width: 230px; }
p { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 0 0 20px; }
.btn { display: inline-block; font-size: 14px; font-weight: 500; color: var(--highlight); background: var(--ink); padding: 12px 22px; border-radius: 99px; }

.card { position: absolute; right: 56px; top: 262px; width: 190px; text-align: right; }
.card small { font: 500 10px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.card b { display: block; font: 500 40px/1 "Inter Tight", sans-serif; letter-spacing: -.03em; margin: 8px 0 6px; }
.card span { font-size: 13px; color: var(--muted); }

.shadow-hard { position: absolute; left: 420px; top: 398px; width: 170px; height: 34px; background: oklch(0.45 0.01 250 / .28); transform: skewX(-58deg); filter: blur(4px); border-radius: 0 0 40px 0; }
.shadow-contact { position: absolute; left: 318px; top: 400px; width: 170px; height: 28px; border-radius: 50%; background: radial-gradient(closest-side, oklch(0.15 0.01 250 / .75), transparent); filter: blur(3px); }
/* [Agent] A cylinder is just a horizontal gradient: a dark terminator, two narrow softbox reflections, a rim light on the far edge. */
.body { position: absolute; left: 328px; top: 196px; width: 144px; height: 220px; border-radius: 0 0 72px 72px / 0 0 14px 14px;
  background: linear-gradient(90deg, var(--product-dark) 0%, var(--product) 8%, var(--product-lit) 17%, oklch(0.85 0.03 40) 20%, var(--product-lit) 23%, var(--product) 34%, var(--product) 52%, oklch(0.27 0.06 30) 80%, oklch(0.45 0.05 30) 92%, var(--product-dark) 100%); }
.lid { position: absolute; left: 324px; top: 156px; width: 152px; height: 44px; border-radius: 0 0 76px 76px / 0 0 10px 10px;
  background: linear-gradient(90deg, var(--product-dark) 0%, var(--product) 8%, var(--product-lit) 17%, oklch(0.88 0.03 40) 20%, var(--product-lit) 23%, var(--product) 34%, var(--product) 52%, oklch(0.27 0.06 30) 80%, oklch(0.45 0.05 30) 92%, var(--product-dark) 100%); box-shadow: 0 3px 0 oklch(0.15 0.03 30 / .6); }
.lid-top { position: absolute; left: 324px; top: 145px; width: 152px; height: 22px; border-radius: 50%; background: radial-gradient(ellipse at 40% 30%, oklch(0.62 0.06 35), var(--product) 70%, oklch(0.30 0.07 30)); }
</style>
</head>
<body>
<div class="top">
  <div class="eyebrow">Introducing Keep</div>
  <h1>Make something people keep</h1>
</div>

<div class="shadow-hard"></div>
<div class="shadow-contact"></div>
<div class="body"></div>
<div class="lid"></div>
<div class="lid-top"></div>

<div class="side">
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn">Start a project</span>
</div>

<div class="card">
  <small>Still in use</small>
  <b>1,284</b>
  <span>projects made since 2019</span>
</div>
</body>
</html>
