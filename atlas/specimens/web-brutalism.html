<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web brutalism</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=IBM+Plex+Mono:wght@400&display=block">
<style>
:root {
  color-scheme: light;
  --white: oklch(1 0 0);
  --black: oklch(0 0 0);
  --link: oklch(0.45 0.30 264);
  --harsh: oklch(0.63 0.25 29);
  --serif: "Libre Caslon Text", "Times New Roman", serif;
  --mono: "IBM Plex Mono", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
/* [Agent] Browser defaults on purpose: 8px body margin, 16px serif, underlined links, a plain hr. */
body { padding: 8px; box-sizing: border-box; font: 400 16px/1.25 var(--serif); color: var(--black); }
a { color: var(--link); text-decoration: underline; }
hr { margin: 8px 0; border: 0; border-top: 1px solid var(--black); }
p { margin: 0 0 16px; }

.top { display: flex; justify-content: space-between; font: 400 14px/1 var(--mono); }
.eyebrow { margin: 0; font: 400 14px/1 var(--mono); }
h1 { margin: 6px 0 0; font: 700 104px/.86 var(--serif); letter-spacing: -.045em; }
h1 span { color: var(--harsh); }
.row { display: grid; grid-template-columns: 1fr 268px; gap: 24px; margin-top: 18px; align-items: start; }
.sub { font-size: 17px; line-height: 1.35; }
.btn { display: inline-block; margin-top: 2px; padding: 3px 8px; border: 2px outset oklch(0.85 0 0); background: oklch(0.94 0 0); font: 400 15px/1.3 var(--mono); color: var(--black); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
td { border: 1px solid var(--black); padding: 5px 7px; vertical-align: top; }
td.num { background: var(--harsh); color: var(--white); font: 700 46px/1 var(--serif); letter-spacing: -.02em; }
</style>
</head>
<body>
  <div class="top"><a href="#">keep</a></div>
  <hr>
  <p class="eyebrow">Introducing Keep</p>
  <h1>Make something people <span>keep</span></h1>
  <hr>
  <div class="row">
    <div>
      <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
      <a class="btn">Start a project</a>
    </div>
    <table>
      <tr><td>Still in use</td><td class="num">1,284</td></tr>
      <tr><td colspan="2">projects made since 2019</td></tr>
    </table>
  </div>
</body>
</html>
