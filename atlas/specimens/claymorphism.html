<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claymorphism</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(0.95 0.02 300);
  --lilac: oklch(0.80 0.09 300);
  --peach: oklch(0.85 0.08 50);
  --mint: oklch(0.88 0.08 165);
  --sky: oklch(0.85 0.08 230);
  --ink: oklch(0.30 0.05 290);
  --card: oklch(0.97 0.025 300);
  --display: "Fredoka", sans-serif;
  --text: "Nunito", sans-serif;
  /* [Agent] Clay = a dark inner shadow at the bottom, a light one at the top, and a soft drop beneath: the shape looks inflated. */
  --clay: inset 0 -10px 18px oklch(0.35 0.08 295 / .22), inset 0 10px 16px oklch(1 0 0 / .9), 0 20px 36px oklch(0.45 0.10 300 / .25);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body {
  position: relative; font-family: var(--text); color: var(--ink);
  background: radial-gradient(60% 70% at 85% 20%, oklch(0.92 0.05 230), transparent 70%), radial-gradient(50% 60% at 10% 90%, oklch(0.93 0.05 50), transparent 70%), var(--bg);
}
p, h1 { margin: 0; }

/* 3D clay objects */
.ball { position: absolute; border-radius: 50%; }
.ball.peach { background: radial-gradient(circle at 35% 30%, oklch(0.97 0.03 60), var(--peach) 45%, oklch(0.70 0.12 40)); box-shadow: 0 14px 24px oklch(0.55 0.10 40 / .3); }
.ball.sky { background: radial-gradient(circle at 35% 30%, oklch(0.97 0.02 230), var(--sky) 45%, oklch(0.65 0.12 245)); box-shadow: 0 14px 24px oklch(0.5 0.10 245 / .3); }
.ball.lilac { background: radial-gradient(circle at 35% 30%, oklch(0.97 0.03 300), var(--lilac) 45%, oklch(0.60 0.14 300)); box-shadow: 0 14px 24px oklch(0.5 0.12 300 / .3); }
.star { position: absolute; filter: drop-shadow(0 12px 14px oklch(0.55 0.12 80 / .35)); }

.clay { position: absolute; border-radius: 40px; box-shadow: var(--clay); }
.main { left: 40px; top: 56px; width: 478px; padding: 34px 36px 38px; box-sizing: border-box; background: var(--card); }
.eyebrow { display: inline-block; padding: 8px 16px; border-radius: 999px; background: var(--lilac); box-shadow: inset 0 -3px 6px oklch(0.4 0.1 300 / .25), inset 0 3px 6px oklch(1 0 0 / .6); font: 800 13px/1 var(--text); color: var(--ink); }
h1 { margin: 18px 0 14px; font: 700 48px/1.02 var(--display); letter-spacing: -.01em; }
.sub { font: 600 15px/1.55 var(--text); color: oklch(0.42 0.04 290); }
.btn { display: inline-block; margin-top: 26px; padding: 17px 30px; border-radius: 999px; background: var(--peach); font: 700 18px/1 var(--display); color: var(--ink); box-shadow: inset 0 -6px 10px oklch(0.55 0.12 40 / .3), inset 0 6px 10px oklch(1 0 0 / .65), 0 12px 22px oklch(0.6 0.12 40 / .35); }

.stat { left: 546px; top: 218px; width: 220px; padding: 26px 26px 28px; box-sizing: border-box; background: var(--mint); transform: rotate(5deg); border-radius: 36px; box-shadow: inset 0 -8px 14px oklch(0.40 0.08 165 / .22), inset 0 8px 14px oklch(1 0 0 / .7), 0 18px 34px oklch(0.45 0.10 165 / .28); }
.stat .label { font: 800 14px/1 var(--text); }
.stat .num { margin: 10px 0 6px; font: 700 52px/1 var(--display); }
.stat .cap { font: 700 14px/1.35 var(--text); color: oklch(0.38 0.05 200); }
</style>
</head>
<body>
  <i class="ball sky" style="left:590px;top:44px;width:110px;height:110px"></i>
  <i class="ball lilac" style="left:700px;top:150px;width:52px;height:52px"></i>
  <i class="ball peach" style="left:470px;top:400px;width:64px;height:64px"></i>
  <svg class="star" style="left:680px;top:400px" width="84" height="84" viewBox="0 0 100 100">
    <defs><radialGradient id="st" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="oklch(0.98 0.06 95)"/><stop offset=".5" stop-color="oklch(0.88 0.13 90)"/><stop offset="1" stop-color="oklch(0.72 0.14 70)"/></radialGradient></defs>
    <path d="M50 6c4 0 6 3 8 8l7 15 16 2c6 1 9 3 10 6s-1 6-5 10L74 58l3 16c1 6 0 9-3 11s-6 1-11-2L50 75l-14 8c-5 3-8 4-11 2s-4-5-3-11l3-16-12-11c-4-4-6-7-5-10s4-5 10-6l16-2 7-15c2-5 4-8 9-8z" fill="url(#st)"/>
  </svg>

  <section class="clay main">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <a class="btn">Start a project</a>
  </section>

  <aside class="clay stat">
    <p class="label">Still in use</p>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
  </aside>
</body>
</html>
