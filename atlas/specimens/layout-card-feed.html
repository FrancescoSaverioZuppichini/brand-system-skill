<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card feed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(100% 0 0);
  --surface: oklch(97.6% 0.003 255);
  --line: oklch(91.5% 0.005 255);
  --fill: oklch(93% 0.005 255);
  --fill-2: oklch(87.5% 0.007 255);
  --text: oklch(23% 0.012 255);
  --muted: oklch(52% 0.012 255);
  --accent: oklch(56% 0.2 260);
  --accent-soft: oklch(95.5% 0.025 260);
  --radius: 8px;
  --sans: "Inter", sans-serif;
  --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--surface); }
body { color: var(--text); font-family: var(--sans); }
.bar { display: block; height: 7px; border-radius: 4px; background: var(--fill-2); }
p { margin: 0; }

.top { height: 56px; padding: 0 40px; display: flex; align-items: center; gap: 18px; background: var(--bg); border-bottom: 1px solid var(--line); }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--text); }
.search { width: 280px; height: 32px; padding-left: 14px; display: flex; align-items: center; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.search::before { content: ""; width: 10px; height: 10px; margin-right: 10px; border-radius: 50%; border: 2px solid var(--fill-2); }
.search::after { content: ""; width: 90px; height: 7px; border-radius: 4px; background: var(--fill-2); }
.btn { margin-left: auto; padding: 9px 14px; border-radius: var(--radius); background: var(--accent); color: white; font-size: 12.5px; font-weight: 500; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--fill-2); }

.intro { padding: 20px 40px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
.eyebrow { margin-bottom: 8px; font: 500 11.5px/1 var(--mono); color: var(--accent); }
h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em; }
.sub { margin-top: 8px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.chips { display: flex; gap: 8px; }
.chips i { width: 62px; height: 28px; display: grid; place-items: center; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
.chips i::after { content: ""; width: 30px; height: 6px; border-radius: 3px; background: var(--fill-2); }
.chips i:first-child { background: var(--text); border-color: var(--text); }
.chips i:first-child::after { background: oklch(100% 0 0 / 0.5); }

/* [Agent] CSS columns give the masonry for free: same card width, image heights vary, and the feed runs off the bottom edge as an endless list does. */
.feed { padding: 0 40px; column-count: 4; column-gap: 16px; }
.post { break-inside: avoid; margin-bottom: 16px; border-radius: var(--radius); background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.img { height: var(--h); background: linear-gradient(var(--a, 150deg), oklch(94% 0.02 250), oklch(85% 0.045 262)); }
.img.x { background:
  linear-gradient(to top right, transparent calc(50% - 0.7px), var(--fill-2) 50%, transparent calc(50% + 0.7px)),
  linear-gradient(to bottom right, transparent calc(50% - 0.7px), var(--fill-2) 50%, transparent calc(50% + 0.7px)),
  var(--fill); }
.meta { padding: 11px 12px 12px; display: grid; gap: 9px; }
.who { display: flex; align-items: center; gap: 7px; }
.who i { width: 16px; height: 16px; border-radius: 50%; background: var(--fill-2); }
.who .bar { flex: 0 0 56px; height: 6px; background: var(--fill); }
.who b { margin-left: auto; width: 13px; height: 12px; border-radius: 3px; border: 1.5px solid var(--fill-2); }

.card { padding: 14px; background: var(--accent-soft); border-color: oklch(56% 0.2 260 / 0.15); }
.label, .cap { font-size: 11px; color: var(--muted); }
.num { margin: 4px 0 2px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="top">
  <span class="logo"></span>
  <span class="search"></span>
  <span class="btn">Start a project</span>
  <span class="avatar"></span>
</header>

<section class="intro">
  <div>
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
  </div>
  <nav class="chips" aria-hidden="true"><i></i><i></i><i></i><i></i></nav>
</section>

<main class="feed">
  <article class="post"><div class="img" style="--h:150px"></div><div class="meta"><span class="bar" style="width:80%"></span><span class="who"><i></i><span class="bar"></span><b></b></span></div></article>
  <article class="post"><div class="img x" style="--h:96px"></div><div class="meta"><span class="bar" style="width:64%"></span><span class="who"><i></i><span class="bar"></span><b></b></span></div></article>
  <article class="post"><div class="img x" style="--h:120px"></div><div class="meta"><span class="bar" style="width:70%"></span><span class="who"><i></i><span class="bar"></span><b></b></span></div></article>
  <article class="post card">
    <p class="label">Still in use</p>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
  </article>
  <article class="post"><div class="img" style="--h:90px;--a:30deg"></div><div class="meta"><span class="bar" style="width:86%"></span><span class="who"><i></i><span class="bar"></span><b></b></span></div></article>
  <article class="post"><div class="img" style="--h:190px;--a:200deg"></div><div class="meta"><span class="bar" style="width:76%"></span><span class="who"><i></i><span class="bar"></span><b></b></span></div></article>
  <article class="post"><div class="img x" style="--h:110px"></div><div class="meta"><span class="bar" style="width:60%"></span><span class="who"><i></i><span class="bar"></span><b></b></span></div></article>
  <article class="post"><div class="img" style="--h:160px;--a:110deg"></div><div class="meta"><span class="bar" style="width:72%"></span><span class="who"><i></i><span class="bar"></span><b></b></span></div></article>
</main>
</body>
</html>
