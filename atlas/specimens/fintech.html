<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fintech trust</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=block">
<style>
  :root {
    color-scheme: light;
    --navy: oklch(0.25 0.06 260);
    --navy-2: oklch(0.32 0.07 258);
    --white: oklch(0.99 0 0);
    --surface: oklch(0.97 0.005 250);
    --line: oklch(0.92 0.008 250);
    --muted: oklch(0.48 0.03 260);
    --lime: oklch(0.88 0.20 128);
    --lime-deep: oklch(0.78 0.19 130);
    --positive: oklch(0.60 0.15 150);
    --radius: 16px;
    --shadow: 0 1px 2px oklch(0.25 0.06 260 / 0.08), 0 12px 32px oklch(0.25 0.06 260 / 0.14);
    --display: "Manrope", sans-serif;
    --ui: "Inter", sans-serif;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
  body { font-family: var(--ui); color: var(--navy); position: relative; }

  .copy { position: absolute; left: 52px; top: 50px; width: 390px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
  .eyebrow i { width: 16px; height: 16px; border-radius: 50%; background: var(--lime); box-shadow: inset 0 0 0 4px var(--navy); }
  h1 { font-family: var(--display); font-weight: 800; font-size: 50px; line-height: 1.0; letter-spacing: -0.035em; margin: 22px 0 18px; max-width: 340px; }
  p { margin: 0; white-space: nowrap; font-size: 14.5px; line-height: 1.55; color: var(--muted); }
  .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; padding: 15px 24px; border-radius: 999px; background: var(--lime); color: var(--navy); font-weight: 600; font-size: 16px; }
  .trust { display: flex; align-items: center; gap: 14px; margin-top: 30px; color: var(--muted); }
  .trust svg { display: block; }
  .stars { display: flex; gap: 3px; }
  .rule { width: 1px; height: 22px; background: var(--line); }

  .panel { position: absolute; left: 440px; top: 20px; width: 340px; height: 460px; border-radius: 28px; overflow: hidden;
    background: radial-gradient(120% 70% at 80% 10%, var(--navy-2), var(--navy) 60%); }
  .panel::before { content: ""; position: absolute; inset: 0; background: radial-gradient(40% 30% at 20% 85%, oklch(0.88 0.20 128 / 0.25), transparent 70%); }
  .phone { position: absolute; left: 92px; top: 46px; width: 214px; height: 440px; border-radius: 36px; background: oklch(0.16 0.02 260); padding: 8px; box-sizing: border-box; transform: rotate(6deg); box-shadow: 0 30px 60px oklch(0.10 0.04 260 / 0.6); }
  .screen { width: 100%; height: 100%; border-radius: 29px; background: var(--surface); overflow: hidden; padding: 30px 14px 0; box-sizing: border-box; }
  .notch { position: absolute; left: 50%; top: 16px; width: 64px; height: 18px; margin-left: -32px; border-radius: 10px; background: oklch(0.16 0.02 260); }
  .card { background: var(--white); border-radius: var(--radius); padding: 14px 14px 12px; box-shadow: 0 1px 2px oklch(0.25 0.06 260 / 0.06); border: 1px solid var(--line); }
  .card .label { font-size: 11px; font-weight: 500; color: var(--muted); }
  .card .num { font-family: var(--display); font-weight: 800; font-size: 36px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .card .cap { font-size: 10.5px; color: var(--muted); }
  .chart { margin-top: 10px; }
  .rows { margin-top: 10px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; background: var(--white); border-radius: 12px; padding: 8px; border: 1px solid var(--line); }
  .row b { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 6px var(--line); }
  .row s { height: 6px; border-radius: 3px; background: var(--line); flex: 1; }
  .row u { height: 6px; width: 34px; border-radius: 3px; background: oklch(0.60 0.15 150 / 0.45); }

  .pay { position: absolute; left: 396px; top: 326px; width: 228px; height: 144px; border-radius: 14px; transform: rotate(-9deg);
    background: linear-gradient(135deg, var(--lime), var(--lime-deep)); box-shadow: var(--shadow); overflow: hidden; }
  .pay::after { content: ""; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; border: 26px solid oklch(1 0 0 / 0.18); }
  .chip { position: absolute; left: 20px; top: 46px; width: 34px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, oklch(0.90 0.03 90), oklch(0.75 0.04 85)); }
  .chip::before { content: ""; position: absolute; inset: 6px 0; border-top: 1px solid oklch(0.55 0.04 80 / 0.6); border-bottom: 1px solid oklch(0.55 0.04 80 / 0.6); }
  .dots { position: absolute; left: 20px; bottom: 20px; display: flex; gap: 12px; }
  .dots span { display: flex; gap: 3px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--navy); opacity: 0.7; }
  .mark { position: absolute; right: 18px; bottom: 16px; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); box-shadow: inset 0 0 0 7px var(--navy), inset 0 0 0 14px var(--lime); }
  .nfc { position: absolute; left: 20px; top: 16px; }
</style>
</head>
<body>
  <div class="copy">
    <span class="eyebrow"><i></i>Introducing Keep</span>
    <h1>Make something people keep</h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </span>
    <div class="trust">
      <svg width="22" height="24" viewBox="0 0 22 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M11 2 3 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z"/><path d="m7.5 12 2.5 2.5 4.5-5" stroke-linecap="round"/></svg>
      <div class="rule"></div>
      <div class="stars">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="oklch(0.60 0.15 150)"><path d="m12 2 3 6.6 7 .7-5.3 4.8 1.6 7L12 17.5 5.7 21l1.6-7L2 9.3l7-.7L12 2Z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="oklch(0.60 0.15 150)"><path d="m12 2 3 6.6 7 .7-5.3 4.8 1.6 7L12 17.5 5.7 21l1.6-7L2 9.3l7-.7L12 2Z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="oklch(0.60 0.15 150)"><path d="m12 2 3 6.6 7 .7-5.3 4.8 1.6 7L12 17.5 5.7 21l1.6-7L2 9.3l7-.7L12 2Z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="oklch(0.60 0.15 150)"><path d="m12 2 3 6.6 7 .7-5.3 4.8 1.6 7L12 17.5 5.7 21l1.6-7L2 9.3l7-.7L12 2Z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="oklch(0.60 0.15 150)"><path d="m12 2 3 6.6 7 .7-5.3 4.8 1.6 7L12 17.5 5.7 21l1.6-7L2 9.3l7-.7L12 2Z"/></svg>
      </div>
      <div class="rule"></div>
      <svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="1" width="24" height="18" rx="3"/><path d="M1 6h24"/></svg>
    </div>
  </div>

  <div class="panel">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="card">
          <div class="label">Still in use</div>
          <div class="num">1,284</div>
          <div class="cap">projects made since 2019</div>
          <svg class="chart" width="100%" height="58" viewBox="0 0 160 58" preserveAspectRatio="none">
            <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.60 0.15 150)" stop-opacity="0.28"/><stop offset="1" stop-color="oklch(0.60 0.15 150)" stop-opacity="0"/></linearGradient></defs>
            <path d="M0 50 C14 46 20 40 32 42 S52 30 64 32 86 20 98 24 120 10 134 12 152 4 160 3 V58 H0Z" fill="url(#g)"/>
            <path d="M0 50 C14 46 20 40 32 42 S52 30 64 32 86 20 98 24 120 10 134 12 152 4 160 3" fill="none" stroke="oklch(0.60 0.15 150)" stroke-width="2"/>
          </svg>
        </div>
        <div class="rows">
          <div class="row"><b></b><s></s><u></u></div>
          <div class="row"><b></b><s></s><u></u></div>
          <div class="row"><b></b><s></s><u></u></div>
          <div class="row"><b></b><s></s><u></u></div>
        </div>
      </div>
    </div>
  </div>

  <div class="pay">
    <svg class="nfc" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.25 0.06 260)" stroke-width="2" stroke-linecap="round"><path d="M8 7c2 3 2 7 0 10M12 4.5c3.5 4.5 3.5 10.5 0 15M16 2c4.7 6 4.7 14 0 20"/></svg>
    <div class="chip"></div>
    <div class="dots">
      <span><i></i><i></i><i></i><i></i></span><span><i></i><i></i><i></i><i></i></span><span><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="mark"></div>
  </div>
</body>
</html>
