<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newspaper / broadsheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;0,6..72,800;1,6..72,400&family=UnifrakturMaguntia&display=block">
<style>
:root {
  color-scheme: light;
  --newsprint: oklch(0.94 0.012 90);
  --ink: oklch(0.17 0.005 80);
  --grey: oklch(0.45 0.005 80);
  --salmon: oklch(0.95 0.03 65);
  --masthead: "UnifrakturMaguntia", serif;
  --serif: "Newsreader", serif;
  --meta: "Libre Franklin", sans-serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--newsprint); color: var(--ink); }
body { font-family: var(--serif); position: relative; }
.sheet { position: absolute; inset: 14px 28px 0; }

.masthead { text-align: center; font: 400 64px/1 var(--masthead); margin: 0; padding: 4px 0 6px; }
.dateline { display: flex; justify-content: space-between; border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); padding: 5px 0 4px; font: 700 10px var(--meta); letter-spacing: 0.1em; text-transform: uppercase; }

/* [Agent] Five equal columns with vertical column rules: the lead story spans four, the right column holds the data box and the ad. */
.front { display: grid; grid-template-columns: repeat(5, 1fr); column-gap: 0; margin-top: 10px; border-bottom: 1px solid var(--ink); }
.front > * { padding: 0 11px; }
.front > :first-child { padding-left: 0; }
.front > :last-child { padding-right: 0; }
.lead { grid-column: 1 / 5; border-right: 1px solid var(--ink); }
.kicker { font: 800 11px var(--meta); letter-spacing: 0.12em; text-transform: uppercase; }
h1 { margin: 4px 0 8px; font: 800 60px/0.97 var(--serif); font-variation-settings: "opsz" 72; letter-spacing: -0.015em; }
.deck { margin: 0 0 10px; font: italic 400 17px/1.3 var(--serif); color: var(--ink); }
.body { display: grid; grid-template-columns: 1fr 1fr 1fr; column-gap: 22px; padding-top: 10px; border-top: 1px solid var(--ink); }
.body > div { height: 148px; position: relative; }
.greek { background: var(--greek) 0 0 / 200px 160px; }
.body .greek + .greek { background-position: 0 -56px; }
.right .greek { background-position: 0 -104px; }
.body > div + div::before { content: ""; position: absolute; left: -11px; top: 0; bottom: 0; width: 1px; background: var(--ink); opacity: 0.4; }
.photo { height: 148px; }
.photo canvas { display: block; width: 100%; height: 124px; }
.photo .credit { font: 500 9px var(--meta); color: var(--grey); padding-top: 4px; border-top: 1px solid var(--ink); margin-top: 3px; }

.right { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--salmon); border: 1px solid var(--ink); padding: 8px 10px 10px; }
.card .label { font: 800 10px var(--meta); letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
.card .num { font: 700 40px/1 var(--serif); margin: 6px 0 2px; }
.card .cap { font: 500 11px/1.3 var(--meta); color: var(--grey); }
.btn { border: 3px double var(--ink); border-radius: 0; background: transparent; color: var(--ink); padding: 10px 4px; font: 800 11px var(--meta); letter-spacing: 0.06em; text-transform: uppercase; width: 100%; }
.right .greek { flex: 1; }
</style>
</head>
<body>
<div class="sheet">
  <p class="masthead">The Keep</p>
  <div class="dateline"><span>No. 01</span><span>Wednesday, November 18, 2026</span><span>Vol. I</span></div>
  <div class="front">
    <div class="lead">
      <div class="kicker">Introducing Keep</div>
      <h1>Make Something People Keep</h1>
      <p class="deck">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
      <div class="body">
        <div class="photo">
          <canvas id="halftone" width="360" height="248"></canvas>
          <div class="credit">Fig. 1</div>
        </div>
        <div class="greek"></div>
        <div class="greek"></div>
      </div>
    </div>
    <div class="right">
      <div class="card">
        <div class="label">Still in use</div>
        <div class="num">1,284</div>
        <div class="cap">projects made since 2019</div>
      </div>
      <button class="btn">Start a project</button>
      <div class="greek"></div>
    </div>
  </div>
</div>
<script>
// [Agent] Halftone generator: samples a shaded vase-on-a-table scene and draws one dot per cell of a 45° screen, dot area proportional to darkness.
const c = document.getElementById("halftone"), g = c.getContext("2d"), W = c.width, H = c.height, s = 6.5;
g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink");
const tone = (u, v) => {
  const nx = (u - 0.42) / 0.19, ny = (v - 0.52) / 0.26;
  if (nx * nx + ny * ny < 1) return 0.25 + 0.6 * Math.max(0, 0.65 * nx + 0.35);
  if (Math.abs(u - 0.42) < 0.055 && v > 0.14 && v < 0.32) return 0.35 + 0.5 * (u - 0.365) / 0.11;
  if (v > 0.76) return u > 0.5 && u < 0.88 && v < 0.84 ? 0.8 : 0.5;
  return 0.06 + 0.28 * v + 0.12 * u;
};
for (let a = 0; a < (W + H) / s; a++) for (let b = -H / s; b < W / s; b++) {
  const x = (a + b) * s * Math.SQRT1_2, y = (a - b) * s * Math.SQRT1_2;
  if (x < -s || y < -s || x > W + s || y > H + s) continue;
  g.beginPath(); g.arc(x, y, s * 0.62 * Math.sqrt(tone(x / W, y / H)), 0, 7); g.fill();
}

// [Agent] Greeked body copy: seeded random word lengths on 8 px lines with a short last line and an indent per paragraph, painted once into a tile.
const t = document.createElement("canvas"), k = t.getContext("2d");
t.width = 400; t.height = 320; k.fillStyle = "oklch(0.55 0.005 80)";
let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
for (let y = 6, n = 0; y < t.height; y += 16, n++) {
  const end = n % 7 === 6 ? 120 + rnd() * 160 : t.width;
  for (let x = n % 7 === 0 ? 18 : 0; x < end; ) { const w = 8 + rnd() * 44; k.fillRect(x, y, Math.min(w, end - x), 5); x += w + 7; }
}
document.documentElement.style.setProperty("--greek", `url(${t.toDataURL()})`);
</script>
</body>
</html>
