<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gaming</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800;900&family=Chakra+Petch:wght@500;700&family=Rajdhani:wght@500;600&display=block">
<style>
  :root {
    color-scheme: dark;
    --black: oklch(0.14 0.01 270);
    --panel: oklch(0.20 0.015 270);
    --panel-2: oklch(0.26 0.02 270);
    --lime: oklch(0.88 0.22 135);
    --red: oklch(0.60 0.24 25);
    --steel: oklch(0.65 0.02 260);
    --white: oklch(0.97 0.005 270);
    --display: "Saira Condensed", sans-serif;
    --hud: "Chakra Petch", sans-serif;
    --text: "Rajdhani", sans-serif;
    --chamfer: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--black); }
  body { position: relative; color: var(--white); font-family: var(--text); }
  .art { position: absolute; inset: 0; }

  .copy { position: absolute; left: 44px; top: 78px; }
  .eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--hud); font-weight: 700; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--lime); }
  .eyebrow i { width: 26px; height: 8px; background: var(--lime); transform: skewX(-30deg); }
  h1 { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 76px; line-height: 0.86; letter-spacing: -0.005em; text-transform: uppercase; margin: 14px 0 18px; }
  h1 span { color: var(--lime); text-shadow: 0 0 24px oklch(0.88 0.22 135 / 0.55); }
  p { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.35; color: var(--steel); white-space: nowrap; }
  .cta { display: inline-flex; align-items: center; gap: 12px; margin-top: 26px; padding: 15px 30px 15px 26px; background: var(--lime); color: var(--black); font-family: var(--hud); font-weight: 700; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); box-shadow: 0 0 0 1px var(--lime); filter: drop-shadow(0 0 16px oklch(0.88 0.22 135 / 0.45)); }

  .card { position: absolute; right: 40px; bottom: 40px; width: 210px; padding: 16px 18px 16px; background: oklch(0.20 0.015 270 / 0.88); clip-path: var(--chamfer); }
  .card::before { content: ""; position: absolute; inset: 0; border: 1px solid oklch(0.88 0.22 135 / 0.35); clip-path: var(--chamfer); }
  .card .label { font-family: var(--hud); font-weight: 700; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--lime); }
  .card .num { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 54px; line-height: 1; margin-top: 4px; }
  .card .cap { font-size: 15px; font-weight: 600; color: var(--steel); }
  .segs { display: flex; gap: 3px; margin-top: 12px; }
  .segs i { flex: 1; height: 6px; background: var(--lime); transform: skewX(-30deg); }
  .segs i.off { background: var(--panel-2); }
</style>
</head>
<body>
  <!-- [Agent] Key-art stand-in: red rim light, angular shards and a faceted rank emblem, with scanlines on top. -->
  <svg class="art" width="800" height="500" viewBox="0 0 800 500">
    <defs>
      <radialGradient id="glow" cx="0.72" cy="0.42" r="0.5"><stop offset="0" stop-color="oklch(0.60 0.24 25)" stop-opacity="0.75"/><stop offset="0.5" stop-color="oklch(0.45 0.18 25)" stop-opacity="0.25"/><stop offset="1" stop-color="oklch(0.14 0.01 270)" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.88 0.22 135)" stop-opacity="0"/><stop offset="0.5" stop-color="oklch(0.88 0.22 135)" stop-opacity="0.22"/><stop offset="1" stop-color="oklch(0.88 0.22 135)" stop-opacity="0"/></linearGradient>
      <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.35"/></pattern>
      <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect width="800" height="500" fill="url(#glow)"/>
    <polygon points="430,0 520,0 300,500 210,500" fill="url(#beam)"/>
    <polygon points="700,0 740,0 560,500 520,500" fill="url(#beam)" opacity="0.6"/>
    <polygon points="800,320 800,500 520,500" fill="oklch(0.20 0.015 270)"/>
    <polygon points="640,0 800,0 800,120" fill="oklch(0.20 0.015 270)"/>
    <!-- rank emblem -->
    <g transform="translate(648 190) scale(0.84)">
      <polygon points="0,-150 112,-62 86,88 0,138 -86,88 -112,-62" fill="oklch(0.11 0.01 270)"/>
      <polygon points="0,-150 112,-62 0,-20" fill="oklch(0.36 0.02 270)"/>
      <polygon points="0,-150 -112,-62 0,-20" fill="oklch(0.28 0.02 270)"/>
      <polygon points="-112,-62 -86,88 0,-20" fill="oklch(0.22 0.02 270)"/>
      <polygon points="112,-62 86,88 0,-20" fill="oklch(0.42 0.12 25)"/>
      <polygon points="-86,88 0,138 0,-20" fill="oklch(0.17 0.015 270)"/>
      <polygon points="86,88 0,138 0,-20" fill="oklch(0.30 0.14 25)"/>
      <polygon points="0,-82 44,-30 0,40 -44,-30" fill="oklch(0.88 0.22 135)" filter="url(#neon)"/>
      <polygon points="0,-82 44,-30 0,-14" fill="oklch(0.95 0.12 135)"/>
      <polygon points="0,-150 112,-62 86,88 0,138 -86,88 -112,-62" fill="none" stroke="oklch(0.88 0.22 135)" stroke-width="2" filter="url(#neon)"/>
      <path d="M-140 -10 h-40 M140 -10 h40 M-150 6 h-20 M150 6 h20" stroke="oklch(0.88 0.22 135)" stroke-width="2"/>
    </g>
    <!-- HUD corners -->
    <g fill="none" stroke="oklch(0.65 0.02 260)" stroke-width="1.5" opacity="0.7">
      <path d="M20 44 V20 H44"/><path d="M756 20 H780 V44"/><path d="M20 456 V480 H44"/><path d="M756 480 H780 V456"/>
    </g>
    <g fill="oklch(0.65 0.02 260)" opacity="0.5"><rect x="60" y="24" width="60" height="2"/><rect x="126" y="24" width="12" height="2"/><rect x="144" y="24" width="4" height="2"/></g>
    <rect width="800" height="500" fill="url(#scan)"/>
  </svg>

  <div class="copy">
    <div class="eyebrow"><i></i>Introducing Keep</div>
    <h1>Make something<br>people <span>keep</span></h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 1 12 7 2 13Z" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
    <div class="segs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></div>
  </div>
</body>
</html>
