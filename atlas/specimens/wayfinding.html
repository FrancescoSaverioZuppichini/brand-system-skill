<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signage / wayfinding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500&family=Overpass+Mono:wght@600&family=Public+Sans:wght@600;700&display=block">
<style>
:root {
  color-scheme: dark;
  --panel: oklch(0.27 0.04 255);
  --head: oklch(0.19 0.02 255);
  --white: oklch(0.99 0 0);
  --yellow: oklch(0.87 0.17 95);
  --green: oklch(0.55 0.15 150);
  --wall: oklch(0.44 0.005 255);
  --sans: "Public Sans", sans-serif;
  --cond: "Barlow Semi Condensed", sans-serif;
  --mono: "Overpass Mono", monospace;
  --gap: 8px;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--wall); color: var(--white); }

/* [Agent] The frame is one sign assembly: separate rounded panels bolted to a grey wall, the gaps between them showing the wall. */
.sign {
  position: absolute; inset: 12px; display: grid; gap: var(--gap);
  grid-template-columns: 1fr 1fr; grid-template-rows: 78px 1fr 148px;
  font-family: var(--sans);
}
.sign > * { border-radius: 8px; margin: 0; }

.head { grid-column: 1 / 3; background: var(--head); display: flex; align-items: center; gap: 18px; padding: 0 22px; }
.code { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--yellow); color: var(--head); }
.head .eyebrow { font: 600 26px var(--sans); letter-spacing: 0.01em; flex: 1; }
.picto { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 6px; background: var(--white); color: var(--head); }

.main { grid-column: 1 / 3; background: var(--panel); display: grid; grid-template-columns: 110px 1fr; align-items: start; padding: 26px 30px 0 22px; }
.main .arrow { margin-top: 2px; }
h1 { margin: 0; font: 700 54px/1.04 var(--sans); letter-spacing: -0.005em; }
.sub { margin: 14px 0 0; font: 500 21px/1.3 var(--cond); color: oklch(0.99 0 0 / 0.78); }

.btn { border: 0; background: var(--yellow); color: var(--head); display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font: 700 30px var(--sans); letter-spacing: -0.005em; text-align: left; }
.card { background: var(--green); display: grid; grid-template-columns: auto 1fr; column-gap: 18px; align-content: center; padding: 0 24px; }
.card .label { grid-column: 1 / 3; font: 600 16px var(--sans); letter-spacing: 0.02em; }
.card .num { font: 700 64px/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 6px; }
.card .cap { align-self: end; padding-bottom: 8px; font: 500 18px/1.15 var(--cond); }
</style>
</head>
<body>
<div class="sign">
  <div class="head">
    <span class="code">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M6 20 L20 6 M9 6 H20 V17" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"/></svg>
    </span>
    <span class="eyebrow">Introducing Keep</span>
    <!-- [Agent] Aicher-style pictograms: a person and a box drawn from round-capped strokes on a 24-unit grid. -->
    <span class="picto">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="3.6" r="2.4" fill="currentColor"/><path d="M13 8 L11 15 L14 18 L14 23 M11 15 L8 23 M12.5 9 L8 12 M13 9 L17 13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="picto">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8 H21 V21 H3 Z M2 4 H22 V8 H2 Z M9 12 H15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </span>
  </div>
  <div class="main">
    <svg class="arrow" width="78" height="78" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 H19 M12 4.5 L19.5 12 L12 19.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square"/></svg>
    <div>
      <h1>Make something<br>people keep</h1>
      <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    </div>
  </div>
  <button class="btn">Start a project
    <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 H19 M12 4.5 L19.5 12 L12 19.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="square"/></svg>
  </button>
  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made<br>since 2019</div>
  </div>
</div>
</body>
</html>
