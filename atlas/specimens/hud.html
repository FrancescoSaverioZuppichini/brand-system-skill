<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sci-fi HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&family=Chakra+Petch:wght@400&family=Orbitron:wght@500&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --navy: oklch(0.15 0.03 250);
  --cyan: oklch(0.84 0.13 205);
  --amber: oklch(0.80 0.15 75);
  --dim: oklch(0.45 0.06 220);
  --white: oklch(0.97 0.01 220);
  --faint: oklch(0.84 0.13 205 / .07);
  --label: "Rajdhani", sans-serif;
  --text: "Chakra Petch", sans-serif;
  --display: "Orbitron", sans-serif;
  --mono: "JetBrains Mono", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden;
  background: radial-gradient(70% 80% at 72% 48%, oklch(0.20 0.04 240), transparent 70%),
    linear-gradient(90deg, var(--faint) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(var(--faint) 1px, transparent 1px) 0 0 / 40px 40px, var(--navy); }
body { position: relative; font-family: var(--text); color: var(--white); }
body > * { position: absolute; margin: 0; }

/* [Agent] Corner brackets: four short L-shaped gradients on one element instead of eight divs. */
.brackets { --c: var(--cyan); --l: 18px; background:
  linear-gradient(var(--c), var(--c)) 0 0 / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) 0 0 / 1px var(--l) no-repeat,
  linear-gradient(var(--c), var(--c)) 100% 0 / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) 100% 0 / 1px var(--l) no-repeat,
  linear-gradient(var(--c), var(--c)) 0 100% / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) 0 100% / 1px var(--l) no-repeat,
  linear-gradient(var(--c), var(--c)) 100% 100% / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) 100% 100% / 1px var(--l) no-repeat; }
.frame { inset: 14px; --l: 26px; }
.ruler { left: 200px; right: 200px; top: 14px; height: 8px; background: repeating-linear-gradient(90deg, var(--dim) 0 1px, transparent 1px 10px); }
.ruler.b { top: auto; bottom: 14px; }

.copy { left: 34px; top: 74px; width: 360px; padding: 22px 22px 24px; }
.eyebrow { margin: 0; font: 500 11px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--cyan); }
.eyebrow span { color: var(--dim); }
h1 { margin: 16px 0 0; font: 600 44px/1.02 var(--label); letter-spacing: .07em; text-transform: uppercase; text-shadow: 0 0 14px oklch(0.84 0.13 205 / .55); }
.sub { margin: 16px 0 0; padding-left: 12px; border-left: 1px solid var(--dim); font-size: 13px; line-height: 1.6; color: oklch(0.97 0.01 220 / .72); }
.cta { display: inline-block; margin-top: 24px; padding: 11px 22px; background-color: oklch(0.84 0.13 205 / .1); --l: 8px;
  font: 600 14px/1 var(--label); letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); text-decoration: none; }
.cta::after { content: ""; display: inline-block; width: 0; height: 0; margin-left: 12px; border: 5px solid transparent; border-left-color: var(--cyan); border-right: 0; }

.radar { left: 404px; top: 62px; width: 360px; height: 360px; overflow: visible; filter: drop-shadow(0 0 3px oklch(0.84 0.13 205 / .55)); }
.deg { font: 500 9px var(--mono); fill: var(--dim); letter-spacing: .1em; }

.card { left: 574px; top: 392px; width: 168px; padding: 10px 14px 12px; --c: var(--amber); --l: 10px; background-color: oklch(0.17 0.035 245 / .92); }
.card .label { display: block; font: 500 10px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
.card .num { display: block; margin: 6px 0 4px; font: 500 28px/1 var(--display); color: var(--amber); text-shadow: 0 0 12px oklch(0.80 0.15 75 / .6); }
.card .cap { font: 400 10.5px/1 var(--mono); color: oklch(0.97 0.01 220 / .6); }
.scan { inset: 0; background: repeating-linear-gradient(oklch(0 0 0 / .18) 0 1px, transparent 1px 3px); pointer-events: none; }
</style>
</head>
<body>
<div class="brackets frame"></div>
<div class="ruler"></div><div class="ruler b"></div>

<section class="copy brackets">
  <p class="eyebrow">01 <span>//</span> Introducing Keep</p>
  <h1>Make something<br>people keep</h1>
  <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
  <a class="cta brackets" href="#">Start a project</a>
</section>

<svg class="radar" viewBox="0 0 360 360" fill="none" aria-hidden="true">
  <defs><linearGradient id="sweep" x1="1" y1=".6" x2=".4" y2="0"><stop offset="0" stop-color="var(--cyan)" stop-opacity=".35"/><stop offset="1" stop-color="var(--cyan)" stop-opacity="0"/></linearGradient></defs>
  <g stroke="var(--dim)"><circle cx="180" cy="180" r="176"/><circle cx="180" cy="180" r="130" stroke-dasharray="2 6"/><circle cx="180" cy="180" r="90"/><path d="M180 0V120M180 240V360M0 180H120M240 180H360"/></g>
  <circle cx="180" cy="180" r="165" stroke="var(--cyan)" stroke-width="5" stroke-dasharray="1 7.64" opacity=".7"/>
  <circle cx="180" cy="180" r="165" stroke="var(--cyan)" stroke-width="12" stroke-dasharray="2 84.39"/>
  <circle cx="180" cy="180" r="146" stroke="var(--cyan)" stroke-width="3" stroke-dasharray="200 717" transform="rotate(-120 180 180)"/>
  <circle cx="180" cy="180" r="146" stroke="var(--cyan)" stroke-width="3" stroke-dasharray="40 877" transform="rotate(130 180 180)"/>
  <circle cx="180" cy="180" r="112" stroke="var(--amber)" stroke-width="2" stroke-dasharray="70 634" transform="rotate(20 180 180)"/>
  <path d="M180 180 L326 146 A150 150 0 0 0 276 65 Z" fill="url(#sweep)"/>
  <path d="M180 180 L326 146" stroke="var(--cyan)" stroke-width="1.5"/>
  <g stroke="var(--cyan)" stroke-width="1" transform="rotate(-18 180 180)">
    <circle cx="180" cy="180" r="44"/><ellipse cx="180" cy="180" rx="44" ry="13"/><ellipse cx="180" cy="180" rx="30" ry="44"/><ellipse cx="180" cy="180" rx="12" ry="44"/>
    <path d="M140 162 H220 M140 198 H220"/></g>
  <path d="M286 102 l6 -6 l6 6 l-6 6 Z" stroke="var(--amber)" stroke-width="1.5"/>
  <circle cx="104" cy="236" r="4" fill="var(--cyan)"/><circle cx="104" cy="236" r="10" stroke="var(--cyan)"/>
  <circle cx="244" cy="262" r="3.5" fill="var(--amber)"/><path d="M244 266 V330" stroke="var(--amber)" stroke-dasharray="2 3"/>
  <text class="deg" x="180" y="-8" text-anchor="middle">000</text><text class="deg" x="368" y="183">090</text><text class="deg" x="-8" y="183" text-anchor="end">270</text>
</svg>

<aside class="card brackets">
  <span class="label">Still in use</span>
  <span class="num">1,284</span>
  <span class="cap">projects made since 2019</span>
</aside>
<div class="scan"></div>
</body>
</html>
