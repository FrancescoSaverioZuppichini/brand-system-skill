<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalogue / e-commerce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(100% 0 0);
  --surface: oklch(97.6% 0.003 255);
  --line: oklch(91.5% 0.005 255);
  --fill: oklch(93% 0.005 255);
  --fill-2: oklch(87.5% 0.007 255);
  --text: oklch(23% 0.012 255);
  --muted: oklch(52% 0.012 255);
  --accent: oklch(56% 0.2 260);
  --accent-soft: oklch(95.5% 0.025 260);
  --radius: 8px;
  --sans: "Inter", sans-serif;
  --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body { color: var(--text); font-family: var(--sans); }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--fill-2); }
p { margin: 0; }

.top { height: 52px; padding: 0 32px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--text); }
.cats { display: flex; gap: 18px; margin: 0 auto; }
.cats i { width: 40px; height: 6px; border-radius: 3px; background: var(--fill-2); }
.cart { position: relative; width: 18px; height: 16px; border: 1.75px solid var(--text); border-radius: 2px 2px 5px 5px; }
.cart::after { content: ""; position: absolute; top: -9px; right: -9px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }

.head { padding: 18px 32px 16px; display: flex; align-items: flex-end; justify-content: space-between; }
.eyebrow { font: 500 11px/1 var(--mono); color: var(--accent); }
h1 { margin: 7px 0 5px; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; }
.sub { font-size: 12px; line-height: 1.45; color: var(--muted); }
.btn { padding: 9px 14px; border-radius: var(--radius); background: var(--text); color: white; font-size: 12.5px; font-weight: 500; }

/* [Agent] A filter column beside a 4-up product grid: the grid is the page, the products carry all the colour, and the second row runs off the bottom. */
.shop { display: grid; grid-template-columns: 136px 1fr; gap: 24px; padding: 0 32px; }
.filters { display: grid; gap: 10px; align-content: start; padding-top: 2px; }
.fh { width: 55%; height: 6px; margin-top: 8px; border-radius: 3px; background: var(--text); opacity: 0.7; }
.fh:first-child { margin-top: 0; }
.check { display: flex; align-items: center; gap: 8px; }
.check i { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--fill-2); }
.check.on i { border-color: var(--accent); background: var(--accent); }
.check .bar { background: var(--fill); }
.swatches { display: flex; gap: 7px; }
.swatches i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px oklch(0% 0 0 / 0.08); }
.range { position: relative; height: 3px; margin: 8px 0; border-radius: 2px; background: var(--fill); }
.range::before { content: ""; position: absolute; left: 18%; right: 30%; top: 0; bottom: 0; background: var(--accent); }
.range::after { content: ""; position: absolute; left: calc(70% - 6px); top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--accent); }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 16px; }
.item .img { position: relative; aspect-ratio: 4 / 5; border-radius: 4px; background: radial-gradient(120% 80% at 50% 100%, oklch(90% 0.006 255), var(--surface) 60%); }
.item .img::before { content: ""; position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); background: var(--obj); box-shadow: 0 14px 12px -8px oklch(30% 0.02 255 / 0.3); }
.bottle .img::before { width: 34px; height: 92px; border-radius: 12px 12px 6px 6px; --obj: linear-gradient(90deg, oklch(80% 0.04 262), oklch(93% 0.02 262) 40%, oklch(74% 0.06 262)); }
.bowl .img::before { width: 78px; height: 38px; border-radius: 4px 4px 40px 40px; --obj: linear-gradient(90deg, oklch(84% 0.01 255), oklch(96% 0.005 255) 45%, oklch(78% 0.01 255)); }
.sphere .img::before { width: 64px; height: 64px; border-radius: 50%; --obj: radial-gradient(circle at 35% 30%, oklch(98% 0 0), oklch(70% 0.012 255)); }
.box .img::before { width: 56px; height: 70px; border-radius: 4px; --obj: linear-gradient(90deg, oklch(42% 0.02 255), oklch(55% 0.02 255) 45%, oklch(36% 0.02 255)); }
.info { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; }
.info .bar:first-child { width: 58%; background: var(--fill-2); }
.info .bar:last-child { width: 24%; background: var(--text); opacity: 0.6; }
.dots { display: flex; gap: 4px; margin-top: 7px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--fill-2); }

.card { align-self: start; aspect-ratio: 4 / 5; padding: 14px; border-radius: 4px; background: var(--accent-soft); display: flex; flex-direction: column; justify-content: flex-end; }
.label, .cap { font-size: 11px; color: var(--muted); }
.num { margin: 4px 0 3px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="top">
  <span class="logo"></span>
  <nav class="cats" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></nav>
  <span class="cart" aria-hidden="true"></span>
</header>

<section class="head">
  <div>
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  </div>
  <span class="btn">Start a project</span>
</section>

<main class="shop">
  <aside class="filters" aria-hidden="true">
    <span class="fh"></span>
    <span class="check on"><i></i><span class="bar" style="width:62px"></span></span>
    <span class="check"><i></i><span class="bar" style="width:48px"></span></span>
    <span class="check"><i></i><span class="bar" style="width:70px"></span></span>
    <span class="fh" style="width:40%"></span>
    <span class="swatches"><i style="background:oklch(23% 0.012 255)"></i><i style="background:oklch(80% 0.04 262)"></i><i style="background:oklch(92% 0.005 255)"></i><i style="background:oklch(70% 0.012 255)"></i></span>
    <span class="fh" style="width:46%"></span>
    <span class="range"></span>
    <span class="fh" style="width:62%"></span>
    <span class="check"><i></i><span class="bar" style="width:54px"></span></span>
    <span class="check"><i></i><span class="bar" style="width:66px"></span></span>
  </aside>

  <section class="grid">
    <article class="item bottle"><div class="img"></div><div class="info"><span class="bar"></span><span class="bar"></span></div><div class="dots"><i style="background:oklch(80% 0.04 262)"></i><i></i></div></article>
    <article class="item bowl"><div class="img"></div><div class="info"><span class="bar"></span><span class="bar"></span></div><div class="dots"><i></i><i></i><i></i></div></article>
    <article class="card">
      <p class="label">Still in use</p>
      <p class="num">1,284</p>
      <p class="cap">projects made since 2019</p>
    </article>
    <article class="item box"><div class="img"></div><div class="info"><span class="bar"></span><span class="bar"></span></div><div class="dots"><i style="background:oklch(40% 0.02 255)"></i><i></i></div></article>
    <article class="item sphere"><div class="img"></div></article>
    <article class="item box"><div class="img"></div></article>
    <article class="item bottle"><div class="img"></div></article>
    <article class="item bowl"><div class="img"></div></article>
  </section>
</main>
</body>
</html>
