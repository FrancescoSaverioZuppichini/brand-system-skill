<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Psychedelic</title>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Righteous&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --orange: oklch(0.70 0.19 45);
  --blue: oklch(0.50 0.22 265);
  --magenta: oklch(0.60 0.26 345);
  --green: oklch(0.85 0.20 130);
  --ink: oklch(0.25 0.06 300);
  --display: "Shrikhand", serif;
  --text: "Righteous", sans-serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--magenta); }
body { position: relative; font-family: var(--text); color: var(--ink); }

/* [Agent] Op-art rings are a plain repeating radial gradient; the SVG turbulence filter bends them into the swirl. */
.rings {
  position: absolute; inset: -60px;
  background: repeating-radial-gradient(circle at 36% 50%, var(--magenta) 0 13px, var(--green) 13px 26px);
  filter: url(#swirl);
}
.poster { position: absolute; inset: 0; }

.panel {
  position: absolute; left: 532px; top: 34px; width: 236px; height: 432px; box-sizing: border-box; padding: 34px 26px;
  background: var(--green); border: 4px solid var(--ink);
  border-radius: 46% 54% 40% 60% / 22% 26% 74% 78%;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.eyebrow { margin: 6px 0 0; font: 22px/1 var(--text); color: var(--magenta); letter-spacing: .02em; }
.sub { margin: 14px 0 0; font: 15px/1.35 var(--text); }
.button {
  margin-top: 16px; padding: 11px 20px; border: 3px solid var(--ink); border-radius: 999px;
  background: var(--magenta); color: var(--green); font: 16px var(--text);
}
.card {
  margin-top: 18px; width: 170px; padding: 14px 10px 16px; background: var(--orange); border: 3px solid var(--ink);
  border-radius: 58% 42% 50% 50% / 50% 46% 54% 50%;
}
.card .label { font: 13px var(--text); }
.card .num { font: 38px/1.1 var(--display); color: var(--blue); }
.card .cap { font: 12px/1.2 var(--text); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="swirl" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".005" numOctaves="1" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="110" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- [Agent] Melt: low-frequency noise pushes the letter outlines around just enough to look hand-drawn and liquid. -->
    <filter id="melt" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="1" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="rings"></div>

  <!-- [Agent] Wes Wilson's trick: every line is stretched (textLength) to the width of the ellipse at its height, so the words fill the shape. -->
  <svg class="poster" viewBox="0 0 800 500" aria-label="Make something people keep" role="img">
    <ellipse cx="272" cy="250" rx="246" ry="226" fill="var(--blue)" stroke="var(--ink)" stroke-width="5" filter="url(#melt)"/>
    <g filter="url(#melt)" font-family="Shrikhand" fill="var(--orange)" text-anchor="middle" stroke="var(--ink)" stroke-width="2" paint-order="stroke">
      <text x="272" y="132" font-size="70" textLength="270" lengthAdjust="spacingAndGlyphs">MAKE</text>
      <text x="272" y="224" font-size="80" textLength="420" lengthAdjust="spacingAndGlyphs">SOMETHING</text>
      <text x="272" y="316" font-size="80" textLength="414" lengthAdjust="spacingAndGlyphs">PEOPLE</text>
      <text x="272" y="406" font-size="74" textLength="290" lengthAdjust="spacingAndGlyphs">KEEP</text>
    </g>
  </svg>

  <div class="panel">
    <p class="eyebrow">Introducing Keep</p>
    <p class="sub">Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
    <button class="button">Start a project</button>
    <div class="card">
      <div class="label">Still in use</div>
      <div class="num">1,284</div>
      <div class="cap">projects made since 2019</div>
    </div>
  </div>
</body>
</html>
