<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyberpunk</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Saira+Condensed:wght@800&family=Share+Tech+Mono&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@900&text=%E3%82%AD%E3%83%BC%E3%83%97&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --black: oklch(0.13 0.01 280);
  --yellow: oklch(0.92 0.19 105);
  --magenta: oklch(0.65 0.27 345);
  --cyan: oklch(0.86 0.14 200);
  --steel: oklch(0.45 0.02 260);
  --text: oklch(0.90 0.01 260);
  --display: "Chakra Petch", sans-serif;
  --condensed: "Saira Condensed", sans-serif;
  --mono: "Share Tech Mono", monospace;
  --kana: "Zen Kaku Gothic New", sans-serif;
  /* [Agent] 45-degree chamfers on two opposite corners, the signature cut of the genre. */
  --chamfer: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden;
  background: repeating-linear-gradient(104deg, transparent 0 46px, oklch(0.86 0.14 200 / .06) 46px 47px), var(--black); }
body { position: relative; font-family: var(--mono); color: var(--text); }
body > * { position: absolute; margin: 0; }

.tag { left: 40px; top: 42px; padding: 5px 22px 5px 10px; background: var(--magenta); color: var(--black); font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
  clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
.rule { left: 40px; top: 84px; width: 480px; height: 2px; background: var(--magenta); box-shadow: 0 0 10px var(--magenta); }
.rule::after { content: ""; position: absolute; right: 0; top: -5px; width: 60px; height: 12px; background: repeating-linear-gradient(90deg, var(--magenta) 0 4px, transparent 4px 8px); }

h1 { left: 36px; top: 106px; font: 800 70px/.88 var(--condensed); text-transform: uppercase; letter-spacing: .005em; color: var(--text);
  text-shadow: -3px 0 oklch(0.86 0.14 200 / .85), 3px 0 oklch(0.65 0.27 345 / .85); }
h1 em { font-style: normal; color: var(--yellow); }
/* [Agent] The glitch is a copy of the headline clipped to one thin band and shoved sideways. */
h1::after { content: attr(data-text); position: absolute; inset: 0; color: var(--cyan); text-shadow: none; white-space: pre; clip-path: inset(64% 0 25% 0); translate: 9px 0; opacity: .9; }
.sub { left: 40px; top: 270px; width: 440px; font-size: 13.5px; line-height: 1.6; color: oklch(0.80 0.02 260); }
.sub::before { content: ""; position: absolute; left: -14px; top: 4px; bottom: 4px; width: 3px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.cta { left: 40px; top: 352px; padding: 14px 34px 14px 22px; background: var(--yellow); color: var(--black); clip-path: var(--chamfer);
  font: 700 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
.cta-ghost { left: 46px; top: 358px; width: 223px; height: 43px; background: var(--cyan); clip-path: var(--chamfer); opacity: .55; }

.panel { left: 556px; top: 30px; width: 214px; height: 440px; background: var(--yellow); clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 34px 100%, 0 calc(100% - 34px)); }
.kana { left: 722px; top: 64px; writing-mode: vertical-rl; font: 900 40px/1 var(--kana); color: var(--black); letter-spacing: .06em; }
.code { left: 580px; top: 56px; width: 120px; height: 34px; }
.card { left: 580px; top: 196px; width: 176px; color: var(--black); }
.card .label { display: block; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.card .num { display: block; margin: 2px 0 4px; font: 700 56px/1 var(--display); letter-spacing: -0.02em; }
.card .cap { display: block; padding-top: 8px; border-top: 2px solid var(--black); font-size: 13px; }
.meter { left: 580px; top: 352px; width: 164px; height: 26px; background: repeating-linear-gradient(90deg, var(--black) 0 10px, transparent 10px 14px);
  -webkit-mask: linear-gradient(90deg, #000 72%, oklch(0 0 0 / .25) 72%); mask: linear-gradient(90deg, #000 72%, oklch(0 0 0 / .25) 72%); }
.hazard { left: 556px; top: 410px; width: 214px; height: 26px; background: repeating-linear-gradient(-45deg, var(--black) 0 12px, var(--yellow) 12px 24px); }
.scan { inset: 0; background: repeating-linear-gradient(oklch(0 0 0 / .22) 0 1px, transparent 1px 3px); pointer-events: none; }
</style>
</head>
<body>
<p class="tag">Introducing Keep</p>
<div class="rule"></div>
<h1 data-text="Make something&#10;people keep">Make something<br>people <em>keep</em></h1>
<p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<div class="cta-ghost"></div>
<a class="cta" href="#">Start a project</a>

<div class="panel"></div>
<svg class="code" viewBox="0 0 140 34" aria-hidden="true"><path fill="var(--black)" d="M0 0h3v34h-3zM6 0h1v34h-1zM10 0h4v34h-4zM17 0h2v34h-2zM22 0h1v34h-1zM26 0h5v34h-5zM34 0h1v34h-1zM38 0h3v34h-3zM44 0h1v34h-1zM48 0h2v34h-2zM53 0h4v34h-4zM60 0h1v34h-1zM64 0h3v34h-3zM70 0h1v34h-1zM74 0h2v34h-2zM79 0h5v34h-5zM87 0h1v34h-1zM91 0h2v34h-2zM96 0h3v34h-3zM102 0h1v34h-1zM106 0h4v34h-4zM113 0h1v34h-1zM117 0h2v34h-2zM122 0h3v34h-3zM128 0h1v34h-1zM132 0h4v34h-4z"/></svg>
<p class="kana">キープ</p>
<aside class="card">
  <span class="label">Still in use</span>
  <span class="num">1,284</span>
  <span class="cap">projects made since 2019</span>
</aside>
<div class="meter"></div>
<div class="hazard"></div>
<div class="scan"></div>
</body>
</html>
