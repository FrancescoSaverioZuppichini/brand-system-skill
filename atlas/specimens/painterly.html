<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Painterly public-domain art</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono&family=Inter:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --canvas: oklch(0.94 0.02 80);
  --varnish: oklch(0.35 0.05 60);
  --ochre: oklch(0.68 0.11 75);
  --green: oklch(0.35 0.05 150);
  --ink: oklch(0.18 0.01 60);
  --muted: oklch(0.45 0.02 60);
  --rule: oklch(0.82 0.02 75);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--canvas); }
body { font-family: "Inter", sans-serif; color: var(--ink); position: relative; }

.painting { position: absolute; left: 352px; top: 32px; width: 416px; height: 416px; }
.label { position: absolute; left: 352px; top: 458px; width: 416px; font: 400 10px/1.4 "DM Mono", monospace; color: var(--muted); display: flex; justify-content: space-between; }

.copy { position: absolute; left: 48px; top: 48px; width: 270px; }
.eyebrow { font: 400 11px/1 "DM Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--varnish); }
h1 { font: 500 52px/.98 "Cormorant Garamond", serif; letter-spacing: -.01em; margin: 18px 0 18px; }
h1 em { font-style: italic; color: var(--varnish); }
p { font-size: 13.5px; line-height: 1.6; color: var(--muted); margin: 0 0 24px; }
.btn { display: inline-block; font-size: 13px; font-weight: 500; background: var(--ink); color: var(--canvas); padding: 12px 20px; }

.card { position: absolute; left: 48px; bottom: 40px; width: 270px; border-top: 1px solid var(--rule); padding-top: 12px; display: flex; align-items: baseline; gap: 12px; }
.card b { font: 500 38px/1 "Cormorant Garamond", serif; }
.card small { display: block; font: 400 10px/1.3 "DM Mono", monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.card span { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<!-- [Agent] Stand-in for a public-domain oil: shapes pushed around by low-frequency noise (brush edges), a stretched-noise layer for directional strokes, a fine weave for the canvas, and a warm varnish over all. -->
<svg class="painting" viewBox="0 0 416 416" aria-hidden="true">
  <defs>
    <radialGradient id="ground" cx=".32" cy=".38" r=".85"><stop offset="0" stop-color="oklch(0.46 0.06 70)"/><stop offset=".55" stop-color="oklch(0.27 0.04 60)"/><stop offset="1" stop-color="oklch(0.15 0.02 50)"/></radialGradient>
    <linearGradient id="ledge" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.58 0.08 72)"/><stop offset="1" stop-color="oklch(0.42 0.06 65)"/></linearGradient>
    <linearGradient id="jug" x2="1"><stop offset="0" stop-color="oklch(0.96 0.02 90)"/><stop offset=".3" stop-color="oklch(0.88 0.03 85)"/><stop offset=".7" stop-color="oklch(0.55 0.04 70)"/><stop offset="1" stop-color="oklch(0.32 0.03 60)"/></linearGradient>
    <linearGradient id="bottle" x2="1"><stop offset="0" stop-color="oklch(0.30 0.05 150)"/><stop offset=".22" stop-color="oklch(0.55 0.08 145)"/><stop offset=".35" stop-color="oklch(0.32 0.05 150)"/><stop offset="1" stop-color="oklch(0.14 0.03 150)"/></linearGradient>
    <radialGradient id="peach" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="oklch(0.88 0.10 80)"/><stop offset=".45" stop-color="oklch(0.70 0.15 50)"/><stop offset="1" stop-color="oklch(0.38 0.10 35)"/></radialGradient>
    <radialGradient id="varnish" cx=".4" cy=".42" r=".75"><stop offset=".5" stop-color="oklch(0.15 0.02 50)" stop-opacity="0"/><stop offset="1" stop-color="oklch(0.15 0.02 50)" stop-opacity=".6"/></radialGradient>
    <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="strokes"><feTurbulence type="fractalNoise" baseFrequency=".012 .16" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="weave"><feTurbulence type="turbulence" baseFrequency=".9 .9" numOctaves="1" seed="2"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <g filter="url(#brush)">
    <rect x="-20" y="-20" width="456" height="456" fill="url(#ground)"/>
    <path d="M-20 286L436 270V436H-20z" fill="url(#ledge)"/>
    <path d="M-20 330L436 320V436H-20z" fill="oklch(0.30 0.04 60)"/>
    <path d="M300 300L420 300 440 314 300 318z" fill="oklch(0.25 0.03 55)" opacity=".7"/>
    <path d="M232 70h40v70c22 14 30 44 30 90 0 34-6 58-14 72h-72c-8-14-14-38-14-72 0-46 8-76 30-90z" fill="url(#bottle)"/>
    <path d="M190 300l140 4-20 14-120-4z" fill="oklch(0.22 0.03 55)" opacity=".6"/>
    <path d="M110 128c18-6 54-6 72 0l-6 16c26 22 40 56 40 96 0 34-12 54-26 64h-88c-14-10-26-30-26-64 0-40 14-74 40-96z" fill="url(#jug)"/>
    <path d="M206 164c34-6 40 50 6 78" stroke="oklch(0.62 0.04 70)" stroke-width="9" fill="none"/>
    <ellipse cx="146" cy="130" rx="36" ry="6" fill="oklch(0.40 0.04 60)"/>
    <circle cx="110" cy="300" r="26" fill="url(#peach)"/>
    <circle cx="156" cy="306" r="22" fill="url(#peach)"/>
    <path d="M86 284c-10-14 0-26 12-24" stroke="oklch(0.35 0.06 140)" stroke-width="7" fill="none"/>
    <g stroke-linecap="round" fill="none">
      <path d="M100 200c-2 30 2 56 10 78" stroke="oklch(0.98 0.02 90)" stroke-width="9" opacity=".8"/>
      <path d="M118 160c-6 10-10 22-12 34" stroke="oklch(0.98 0.02 90)" stroke-width="6" opacity=".7"/>
      <path d="M245 160c-4 30-4 70 0 120" stroke="oklch(0.70 0.08 140)" stroke-width="4" opacity=".7"/>
      <path d="M100 290c4-4 8-5 12-4M148 296c3-3 7-4 10-3" stroke="oklch(0.95 0.06 85)" stroke-width="5"/>
      <path d="M20 40c60 10 110 4 160 20M30 90c50 4 80 0 120 12" stroke="oklch(0.48 0.06 70)" stroke-width="16" opacity=".25"/>
    </g>
  </g>
  <rect width="416" height="416" filter="url(#strokes)" opacity=".4" style="mix-blend-mode:soft-light"/>
  <rect width="416" height="416" fill="oklch(0.70 0.10 75)" opacity=".16" style="mix-blend-mode:multiply"/>
  <rect width="416" height="416" fill="url(#varnish)"/>
  <rect width="416" height="416" filter="url(#weave)" opacity=".12" style="mix-blend-mode:overlay"/>
</svg>
<div class="label"><span>Still life with a jug and two peaches</span><span>Oil on canvas, detail</span></div>

<div class="copy">
  <div class="eyebrow">Introducing Keep</div>
  <h1>Make something <em>people keep</em></h1>
  <p>Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
  <span class="btn">Start a project</span>
</div>

<div class="card">
  <b>1,284</b>
  <div><small>Still in use</small><span>projects made since 2019</span></div>
</div>
</body>
</html>
