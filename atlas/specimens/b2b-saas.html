<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B2B SaaS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=block">
<style>
  :root {
    color-scheme: light;
    --white: oklch(1 0 0);
    --section: oklch(0.97 0.005 260);
    --ink: oklch(0.22 0.02 265);
    --muted: oklch(0.46 0.02 265);
    --primary: oklch(0.52 0.22 275);
    --primary-soft: oklch(0.95 0.03 275);
    --border: oklch(0.91 0.01 265);
    --skeleton: oklch(0.94 0.008 265);
    --shadow: 0 10px 30px oklch(0.22 0.02 265 / 0.12), 0 1px 3px oklch(0.22 0.02 265 / 0.06);
    --display: "Plus Jakarta Sans", sans-serif;
    --ui: "Inter", sans-serif;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
  body { position: relative; font-family: var(--ui); color: var(--ink); text-align: center; }
  body::before { content: ""; position: absolute; left: 0; right: 0; top: 300px; bottom: 0; background: var(--section); border-top: 1px solid var(--border); }
  .glow { position: absolute; left: 150px; top: 230px; width: 500px; height: 200px; border-radius: 50%; background: radial-gradient(closest-side, oklch(0.75 0.14 285 / 0.45), transparent); filter: blur(10px); }

  .hero { position: relative; padding-top: 34px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--white); font-size: 13px; font-weight: 500; color: var(--ink); }
  .pill b { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--primary-soft); box-shadow: inset 0 0 0 5px var(--primary-soft), inset 0 0 0 9px var(--primary); }
  h1 { font-family: var(--display); font-weight: 700; font-size: 48px; line-height: 1.08; letter-spacing: -0.035em; margin: 18px 0 14px; }
  h1 span { color: var(--primary); }
  p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--muted); }
  .cta { display: inline-block; margin-top: 22px; padding: 12px 20px; border-radius: 8px; background: var(--primary); color: var(--white); font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px oklch(0.30 0.15 275 / 0.3), inset 0 1px 0 oklch(1 0 0 / 0.2); }

  .window { position: absolute; left: 110px; top: 316px; width: 580px; height: 230px; border-radius: 12px; background: var(--white); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; text-align: left; }
  .bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--border); }
  .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .app { display: grid; grid-template-columns: 120px 1fr; height: 200px; }
  .side { background: var(--section); border-right: 1px solid var(--border); padding: 14px 12px; display: grid; gap: 10px; align-content: start; }
  .side s { height: 8px; border-radius: 4px; background: var(--skeleton); }
  .side s.on { background: var(--primary-soft); box-shadow: inset 3px 0 0 var(--primary); }
  .main { padding: 14px 16px; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .row s { height: 10px; border-radius: 5px; background: var(--skeleton); }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 80px; padding-left: 190px; }
  .bars i { flex: 1; border-radius: 4px 4px 0 0; background: var(--primary-soft); }
  .bars i.hi { background: var(--primary); }

  .card { position: absolute; left: 186px; top: 382px; width: 150px; padding: 14px 16px; border-radius: 12px; background: var(--white); border: 1px solid var(--border); box-shadow: var(--shadow); text-align: left; }
  .card .label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .card .num { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: -0.02em; margin: 2px 0; }
  .card .cap { font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="glow"></div>
  <section class="hero">
    <span class="pill"><b></b>Introducing Keep
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </span>
    <h1>Make something people <span>keep</span></h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project</span>
  </section>

  <div class="window">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="app">
      <div class="side"><s style="width:70%"></s><s class="on"></s><s style="width:80%"></s><s style="width:60%"></s><s style="width:75%"></s></div>
      <div class="main">
        <div class="row"><s style="width:120px; background: oklch(0.88 0.01 265)"></s><s style="width:60px; margin-left:auto"></s><s style="width:24px; background: var(--primary-soft)"></s></div>
        <div class="bars"><i style="height:40%"></i><i style="height:55%"></i><i style="height:48%"></i><i style="height:70%"></i><i style="height:62%"></i><i class="hi" style="height:90%"></i><i style="height:78%"></i></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made since 2019</div>
  </div>
</body>
</html>
