<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neobrutalism</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lexend:wght@400;500;700&family=Space+Mono:wght@700&display=block">
<style>
:root {
  color-scheme: light;
  --cream: oklch(0.96 0.03 90);
  --black: oklch(0.15 0 0);
  --yellow: oklch(0.88 0.17 95);
  --pink: oklch(0.78 0.14 350);
  --lime: oklch(0.88 0.18 130);
  --lilac: oklch(0.80 0.10 300);
  --white: oklch(1 0 0);
  --display: "Archivo Black", sans-serif;
  --text: "Lexend", sans-serif;
  --mono: "Space Mono", monospace;
  --line: 3px solid var(--black);
  --shadow: 5px 5px 0 var(--black);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cream); }
body { position: relative; font-family: var(--text); color: var(--black); background: radial-gradient(oklch(0.15 0 0 / .12) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--cream); }
p, h1 { margin: 0; }
svg { display: block; }

nav { position: absolute; left: 36px; right: 36px; top: 26px; display: flex; align-items: center; }
.logo { padding: 8px 14px; border: var(--line); border-radius: 8px; background: var(--white); box-shadow: 3px 3px 0 var(--black); font: 400 18px/1 var(--display); }
.dots { margin-left: auto; display: flex; gap: 10px; }
.dots i { width: 22px; height: 22px; border: var(--line); border-radius: 50%; }

.hero { position: absolute; left: 36px; top: 108px; width: 470px; }
.sticker { display: inline-block; padding: 8px 14px; border: var(--line); border-radius: 6px; background: var(--lime); box-shadow: 3px 3px 0 var(--black); font: 700 13px/1 var(--mono); text-transform: uppercase; transform: rotate(-3deg); }
h1 { margin: 22px 0 18px; font: 400 54px/1.04 var(--display); letter-spacing: -.02em; }
h1 mark { padding: 0 8px; border: var(--line); border-radius: 6px; background: var(--pink); color: inherit; box-shadow: var(--shadow); display: inline-block; transform: rotate(-1.5deg); line-height: 1.02; }
.sub { font: 400 16px/1.55 var(--text); }
.btn { display: inline-flex; align-items: center; gap: 12px; margin-top: 26px; padding: 15px 22px; border: var(--line); border-radius: 8px; background: var(--yellow); box-shadow: var(--shadow); font: 700 17px/1 var(--text); }

.card { position: absolute; left: 532px; top: 150px; width: 238px; padding: 20px 22px 22px; box-sizing: border-box; border: var(--line); border-radius: 10px; background: var(--white); box-shadow: 8px 8px 0 var(--black); transform: rotate(3deg); }
.card .label { display: inline-block; padding: 5px 8px; border: 2px solid var(--black); border-radius: 4px; background: var(--lilac); font: 700 12px/1 var(--mono); text-transform: uppercase; }
.card .num { margin: 14px 0 8px; font: 400 52px/1 var(--display); letter-spacing: -.02em; }
.card .cap { font: 500 14px/1.35 var(--text); }
.burst { position: absolute; left: 676px; top: 86px; }
.squiggle { position: absolute; left: 560px; top: 410px; }
</style>
</head>
<body>
  <nav>
    <span class="logo">Keep</span>
    <span class="dots"><i style="background:var(--pink)"></i><i style="background:var(--yellow)"></i><i style="background:var(--lime)"></i></span>
  </nav>

  <section class="hero">
    <span class="sticker">Introducing Keep</span>
    <h1>Make something people <mark>keep</mark></h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <a class="btn">Start a project<svg width="18" height="18"><path d="M2 9h13M9.5 3.5L15 9l-5.5 5.5" fill="none" stroke="oklch(0.15 0 0)" stroke-width="3"/></svg></a>
  </section>

  <aside class="card">
    <span class="label">Still in use</span>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
  </aside>

  <svg class="burst" width="96" height="96" viewBox="0 0 100 100"><path d="M50 4l9 20 21-9-7 22 22 6-19 12 13 18-22 1 2 22-19-12-12 19-7-21-21 7 9-20-19-12 22-6-6-22 21 9z" fill="oklch(0.88 0.17 95)" stroke="oklch(0.15 0 0)" stroke-width="3" stroke-linejoin="round"/></svg>
  <svg class="squiggle" width="170" height="40" viewBox="0 0 170 40"><path d="M4 20c14-22 28-22 40 0s28 22 40 0 28-22 40 0 28 22 40 0" fill="none" stroke="oklch(0.15 0 0)" stroke-width="4" stroke-linecap="round"/></svg>
</body>
</html>
