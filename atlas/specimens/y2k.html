<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Y2K</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Unbounded:wght@700;900&family=Inter:wght@500&display=block">
<style>
:root {
  color-scheme: light;
  --ice: oklch(0.93 0.03 230);
  --silver: oklch(0.82 0.01 250);
  --pink: oklch(0.85 0.08 350);
  --cyan: oklch(0.80 0.13 210);
  --lime: oklch(0.90 0.20 125);
  --grape: oklch(0.62 0.20 305);
  --navy: oklch(0.32 0.09 262);
  --display: "Michroma", sans-serif;
  --bubble: "Unbounded", sans-serif;
  --text: "Inter", sans-serif;
  /* [Agent] Chrome = sky above a hard horizon line, dark ground just below it, then a bright reflection. */
  --chrome: linear-gradient(180deg, oklch(1 0 0) 0%, oklch(0.88 0.03 235) 38%, oklch(0.42 0.06 255) 50%, oklch(0.62 0.08 230) 56%, oklch(0.97 0.02 220) 100%);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--ice); }
body {
  position: relative; text-align: center; font-family: var(--text); color: var(--navy);
  background:
    radial-gradient(60% 50% at 18% 20%, oklch(0.92 0.06 350 / .9), transparent 70%),
    radial-gradient(50% 60% at 88% 70%, oklch(0.90 0.07 200 / .9), transparent 70%),
    linear-gradient(180deg, oklch(0.97 0.015 230), var(--ice) 60%, var(--silver));
}
p, h1 { margin: 0; }

/* [Agent] A perspective grid floor: flat lines tilted back in 3D so they converge to the horizon. */
.floor {
  position: absolute; left: -200px; right: -200px; bottom: -120px; height: 300px;
  background:
    repeating-linear-gradient(90deg, oklch(0.70 0.14 220 / .55) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(0deg, oklch(0.70 0.14 220 / .55) 0 1px, transparent 1px 48px);
  transform: perspective(260px) rotateX(62deg); transform-origin: 50% 0;
  -webkit-mask-image: linear-gradient(180deg, transparent, black 40%);
}
.orb { position: absolute; border-radius: 50%; }
.orb.chrome {
  background: radial-gradient(circle at 35% 28%, white 0 8%, oklch(0.90 0.02 240) 20%, oklch(0.55 0.05 255) 52%, oklch(0.85 0.04 220) 72%, oklch(0.40 0.06 260) 100%);
  box-shadow: 0 14px 24px oklch(0.4 0.06 260 / .25);
}
.orb.bubble {
  background: radial-gradient(circle at 32% 26%, white 0 9%, oklch(0.90 0.10 350 / .5) 22%, oklch(0.75 0.16 340 / .35) 65%, oklch(0.95 0.06 340 / .9) 100%);
  box-shadow: inset 0 0 0 1px oklch(1 0 0 / .8);
}
.o1 { width: 74px; height: 74px; left: 70px; top: 54px; }
.o2 { width: 34px; height: 34px; left: 150px; top: 140px; }
.o3 { width: 96px; height: 96px; left: 650px; top: 36px; }
.o4 { width: 40px; height: 40px; left: 720px; top: 150px; }
.spark { position: absolute; }

.hero { position: relative; padding-top: 70px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px 7px 10px; border-radius: 999px;
  font: 400 11px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--navy);
  background: linear-gradient(180deg, oklch(1 0 0 / .9), oklch(0.92 0.02 240 / .7));
  box-shadow: inset 0 0 0 1px oklch(1 0 0), 0 0 0 1px var(--silver), 0 4px 10px oklch(0.5 0.05 250 / .15);
}
.eyebrow i { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, white, var(--lime) 45%, oklch(0.65 0.18 130)); }
h1 {
  margin: 20px auto 16px; font: 900 56px/60px var(--bubble); letter-spacing: -.02em; text-transform: lowercase;
  background: var(--chrome) 0 4px / 100% 60px repeat-y;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1.2px var(--navy);
  filter: drop-shadow(0 3px 0 oklch(0.55 0.06 255 / .5)) drop-shadow(0 0 14px oklch(1 0 0));
}
.sub { font: 500 15px/1.6 var(--text); }
.btn {
  position: relative; display: inline-block; margin-top: 24px; padding: 15px 30px; border-radius: 999px; overflow: hidden;
  font: 400 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: white;
  text-shadow: 0 1px 1px oklch(0.35 0.12 230);
  background: linear-gradient(180deg, oklch(0.88 0.10 210), var(--cyan) 48%, oklch(0.62 0.15 225) 50%, oklch(0.78 0.14 210));
  box-shadow: 0 0 0 1px oklch(0.50 0.12 235), inset 0 -3px 6px oklch(0.95 0.08 200 / .8), 0 8px 18px oklch(0.6 0.14 220 / .45);
}
.btn::before {
  content: ""; position: absolute; left: 10px; right: 10px; top: 2px; height: 46%; border-radius: 999px;
  background: linear-gradient(180deg, oklch(1 0 0 / .95), oklch(1 0 0 / .15));
}
.btn span { position: relative; }

/* iMac G3 "grape" translucent plastic */
.card {
  position: absolute; right: 44px; bottom: 34px; width: 188px; padding: 18px 18px 20px; box-sizing: border-box;
  border-radius: 34px; transform: rotate(-7deg); color: white; text-align: left;
  background: linear-gradient(150deg, oklch(0.80 0.12 310 / .65), oklch(0.58 0.21 300 / .82));
  backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px oklch(1 0 0 / .7), inset 0 -10px 20px oklch(0.40 0.18 300 / .5), 0 16px 30px oklch(0.45 0.18 300 / .35);
  overflow: hidden;
}
.card::before {
  content: ""; position: absolute; left: 10px; right: 10px; top: 5px; height: 40%; border-radius: 28px 28px 50% 50%;
  background: linear-gradient(180deg, oklch(1 0 0 / .7), oklch(1 0 0 / 0));
}
.card > * { position: relative; }
.card .label { font: 400 9px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; }
.card .num { margin: 8px 0 4px; font: 900 38px/1 var(--bubble); text-shadow: 0 2px 0 oklch(0.40 0.18 300 / .6); }
.card .cap { font: 500 12px/1.3 var(--text); }
</style>
</head>
<body>
  <div class="floor"></div>
  <i class="orb chrome o1"></i><i class="orb bubble o2"></i><i class="orb bubble o3"></i><i class="orb chrome o4"></i>
  <svg class="spark" style="left:190px;top:60px" width="34" height="34" viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="oklch(0.80 0.13 210)"/></linearGradient></defs><path d="M20 0C21 14 26 19 40 20 26 21 21 26 20 40 19 26 14 21 0 20 14 19 19 14 20 0Z" fill="url(#g)"/></svg>
  <svg class="spark" style="left:600px;top:150px" width="24" height="24" viewBox="0 0 40 40"><path d="M20 0C21 14 26 19 40 20 26 21 21 26 20 40 19 26 14 21 0 20 14 19 19 14 20 0Z" fill="url(#g)"/></svg>
  <svg class="spark" style="left:96px;top:330px" width="40" height="40" viewBox="0 0 40 40"><path d="M20 0C21 14 26 19 40 20 26 21 21 26 20 40 19 26 14 21 0 20 14 19 19 14 20 0Z" fill="oklch(0.85 0.08 350)"/></svg>

  <main class="hero">
    <p class="eyebrow"><i></i>Introducing Keep</p>
    <h1>make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <a class="btn"><span>Start a project</span></a>
  </main>

  <aside class="card">
    <p class="label">Still in use</p>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
  </aside>
</body>
</html>
