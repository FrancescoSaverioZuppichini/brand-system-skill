<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isometric</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Inter:wght@400;600;700&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(0.97 0.005 250);
  --top: oklch(0.85 0.07 255);
  --left: oklch(0.65 0.13 258);
  --right: oklch(0.48 0.15 262);
  --accent: oklch(0.75 0.15 60);
  --accent-left: oklch(0.65 0.15 55);
  --accent-right: oklch(0.56 0.14 50);
  --deck-top: oklch(0.93 0.01 255);
  --deck-left: oklch(0.84 0.015 255);
  --deck-right: oklch(0.75 0.02 255);
  --ink: oklch(0.24 0.03 260);
  --muted: oklch(0.48 0.03 260);
  --grid: oklch(0.90 0.01 255);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
/* [Agent] Two hairline sets at +30 and -30 degrees give the isometric graph paper the drawing sits on. */
body { font-family: "Inter", sans-serif; color: var(--ink); position: relative;
  background-image: repeating-linear-gradient(30deg, var(--grid) 0 1px, transparent 1px 26px), repeating-linear-gradient(-30deg, var(--grid) 0 1px, transparent 1px 26px); }

.copy { position: absolute; left: 52px; top: 76px; width: 330px; padding: 24px 0; background: var(--bg); box-shadow: 0 0 0 24px var(--bg); }
.eyebrow { font: 500 12px/1 "IBM Plex Mono", monospace; color: var(--right); letter-spacing: .04em; }
.eyebrow::before { content: "\25C6  "; color: var(--accent); }
h1 { font: 700 44px/1.06 "Inter", sans-serif; letter-spacing: -.03em; margin: 16px 0 16px; }
p { font: 400 15px/1.55 "IBM Plex Sans", sans-serif; color: var(--muted); margin: 0 0 26px; }
.btn { display: inline-block; font: 600 14px/1 "IBM Plex Sans", sans-serif; color: var(--bg); background: var(--right); padding: 14px 20px; border-radius: 4px; box-shadow: 4px 4px 0 var(--left); }

.art { position: absolute; left: 372px; top: 48px; width: 420px; height: 323px; }
.nt { fill: var(--deck-top); } .nl { fill: var(--deck-left); } .nr { fill: var(--deck-right); }
.bt { fill: var(--top); } .bl { fill: var(--left); } .br { fill: var(--right); }
.at { fill: var(--accent); } .al { fill: var(--accent-left); } .ar { fill: var(--accent-right); }
.art polygon { stroke: var(--bg); stroke-width: .6; stroke-linejoin: round; }
.slot { stroke: var(--left); stroke-width: 2; }
.led { fill: var(--accent); }
.pipe { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 2 6; stroke-linecap: round; }

.card { position: absolute; right: 48px; bottom: 36px; width: 220px; background: oklch(1 0 0); border: 1px solid var(--grid); border-radius: 4px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: end; }
.card small { grid-column: 1 / -1; font: 500 11px/1 "IBM Plex Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.card b { font: 700 30px/1 "Inter", sans-serif; letter-spacing: -.02em; }
.card span { font: 400 11px/1.3 "IBM Plex Mono", monospace; color: var(--muted); }
</style>
</head>
