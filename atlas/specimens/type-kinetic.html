<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinetic variable · type-kinetic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&display=block">
<style>
:root {
  color-scheme: light;
  --paper: oklch(0.99 0 0);
  --ink: oklch(0.14 0 0);
  --grey: oklch(0.50 0 0);
  --accent: oklch(0.70 0.22 140);
  --rule: oklch(0.14 0 0);
  --card: transparent;
  --button: var(--accent);
  --on-button: var(--ink);
  --sans: "Anybody", sans-serif;
  --radius: 0;
}

html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--paper); color: var(--ink); }
body { position: relative; -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; font-weight: inherit; }
.eyebrow { position: absolute; left: 56px; top: 52px; color: var(--accent); }
.specimen { position: absolute; right: 56px; top: 46px; text-align: right; }
.glyphs { display: block; color: var(--ink); }
.names { display: block; margin-top: 8px; color: var(--grey); }
/* [Agent] The headline hangs from its last line, so every voice ends at the same y whatever its size and leading. */
h1 { position: absolute; left: 56px; bottom: 214px; width: 688px; white-space: nowrap; }
.sub { position: absolute; left: 56px; top: 318px; color: var(--grey); white-space: nowrap; }
.button { position: absolute; left: 56px; bottom: 56px; display: flex; align-items: center; height: 48px; padding: 0 24px; box-sizing: border-box; border-radius: var(--radius); background: var(--button); color: var(--on-button); text-decoration: none; }
.card { position: absolute; right: 56px; bottom: 56px; width: 224px; box-sizing: border-box; padding: 16px 20px 18px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--card); }
.num { margin: 6px 0 4px; color: var(--ink); }
.cap { color: var(--grey); }

/* [Agent] Everything above is the shared layout; everything below is the voice. Swap only this part to change voice. */
body { font-family: var(--sans); }
.eyebrow { font: 700 13px/1 var(--sans); font-stretch: 150%; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
.glyphs { font: 700 24px/1 var(--sans); }
.names { font: 500 11px/1 var(--sans); }
h1 { font: 800 70px/1.06 var(--sans); text-transform: uppercase; }
/* [Agent] Each letter gets its own point on the width and weight axes (--t, 0..1 along the line), so one face stretches from compressed-light to expanded-black. */
.ramp span { font-stretch: calc(62% + var(--t) * 88%); font-weight: calc(500 + var(--t) * 400); }
.glyphs .ramp span { font-stretch: calc(80% + var(--t) * 70%); }
@media (prefers-reduced-motion: no-preference) {
  .ramp span { animation: stretch 2.4s ease-in-out calc(var(--t) * -2.4s) infinite alternate; }
  @keyframes stretch { to { font-stretch: 100%; font-weight: 600; } }
}
.sub { font: 400 16px/1.55 var(--sans); }
.button { font: 800 14px/1 var(--sans); font-stretch: 140%; letter-spacing: 0.04em; text-transform: uppercase; }
.card { border-width: 2px; }
.label { font: 700 11px/1 var(--sans); font-stretch: 150%; letter-spacing: 0.08em; text-transform: uppercase; }
.num { font: 900 60px/1 var(--sans); font-stretch: 50%; }
.cap { font: 400 13px/1.3 var(--sans); }
</style>
</head>
<body>
<p class="eyebrow">Introducing Keep</p>
<p class="specimen"><span class="glyphs"><span class="ramp">Aa 0123456789</span></span><span class="names">Anybody · wdth 62–150 · wght 500–900</span></p>
<h1><span class="ramp">Make something</span><br><span class="ramp">people keep</span></h1>
<p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<a class="button" href="#">Start a project</a>
<div class="card">
  <p class="label">Still in use</p>
  <p class="num">1,284</p>
  <p class="cap">projects made since 2019</p>
</div>
<script>
// [Agent] Split each .ramp line into letters and give each its position (0..1) along the line as --t.
for (const line of document.querySelectorAll(".ramp")) {
  const chars = [...line.textContent];
  line.innerHTML = chars.map((c, i) => `<span style="--t:${(i / (chars.length - 1)).toFixed(3)}">${c === " " ? "&nbsp;" : c}</span>`).join("");
}
</script>
</body>
</html>
