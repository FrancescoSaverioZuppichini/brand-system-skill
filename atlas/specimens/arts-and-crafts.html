<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arts &amp; Crafts</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --linen: oklch(0.93 0.025 85);
  --indigo: oklch(0.33 0.09 265);
  --madder: oklch(0.48 0.14 28);
  --willow: oklch(0.55 0.08 135);
  --weld: oklch(0.80 0.12 95);
  --ink: oklch(0.20 0.02 60);
  --display: "IM Fell English", serif;
  --text: "Libre Caslon Text", serif;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--indigo); }
body { position: relative; font-family: var(--text); color: var(--ink); }
.field { position: absolute; inset: 0; }

.page {
  position: absolute; left: 166px; top: 66px; width: 468px; height: 368px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.eyebrow { margin: 18px 0 0; font: 400 13px var(--text); letter-spacing: .26em; text-transform: uppercase; color: var(--madder); }
h1 { margin: 12px 0 0; font: 400 52px/1 var(--display); color: var(--ink); }
h1 em { color: var(--madder); }
.leaf { margin: 14px 0 12px; width: 60px; height: 14px; }
.sub { margin: 0; font-size: 15px; line-height: 1.6; }
.foot { display: flex; align-items: center; gap: 26px; margin-top: 22px; }
.button {
  padding: 11px 22px; border: 0; background: var(--madder); color: var(--linen);
  font: 400 15px var(--text); font-variant: small-caps; letter-spacing: .1em;
}
.card { border-left: 1px solid var(--ink); padding-left: 26px; text-align: left; }
.card .label { font: 400 11px var(--text); letter-spacing: .22em; text-transform: uppercase; color: var(--willow); filter: brightness(.7); }
.card .num { font: 400 34px/1.05 var(--display); color: var(--indigo); }
.card .cap { font: italic 13px var(--text); }
</style>
</head>
<body>
  <svg class="field" viewBox="0 0 800 500" aria-hidden="true">
    <defs>
      <!-- [Agent] One ogee tile, mirrored about its centre line like a Morris block: S-curved stems make the net, a flower sits in each cell. -->
      <g id="bloom">
        <g fill="var(--madder)">
          <ellipse cy="-10" rx="6" ry="11"/><ellipse cy="-10" rx="6" ry="11" transform="rotate(60)"/><ellipse cy="-10" rx="6" ry="11" transform="rotate(120)"/>
          <ellipse cy="-10" rx="6" ry="11" transform="rotate(180)"/><ellipse cy="-10" rx="6" ry="11" transform="rotate(240)"/><ellipse cy="-10" rx="6" ry="11" transform="rotate(300)"/>
        </g>
        <circle r="7" fill="var(--weld)"/>
        <g fill="var(--madder)"><circle cx="0" cy="-3" r="1.4"/><circle cx="2.6" cy="1.5" r="1.4"/><circle cx="-2.6" cy="1.5" r="1.4"/></g>
      </g>
      <g id="bud">
        <g fill="var(--weld)">
          <ellipse cy="-8" rx="5" ry="9" transform="rotate(45)"/><ellipse cy="-8" rx="5" ry="9" transform="rotate(135)"/>
          <ellipse cy="-8" rx="5" ry="9" transform="rotate(225)"/><ellipse cy="-8" rx="5" ry="9" transform="rotate(315)"/>
        </g>
        <circle r="4" fill="var(--madder)"/>
      </g>
      <path id="willow" d="M0 0 C8 -7 22 -7 32 0 C22 6 8 6 0 0Z"/>
      <pattern id="morris" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="scale(.78)">
        <rect width="120" height="120" fill="var(--indigo)"/>
        <g fill="none" stroke="var(--willow)" stroke-width="3.2">
          <path d="M60 0 C60 30 0 30 0 60 C0 90 60 90 60 120"/>
          <path d="M60 0 C60 30 120 30 120 60 C120 90 60 90 60 120"/>
        </g>
        <g fill="var(--willow)">
          <use href="#willow" transform="translate(30 30) rotate(-135)"/>
          <use href="#willow" transform="translate(90 30) rotate(-45)"/>
          <use href="#willow" transform="translate(30 90) rotate(135)"/>
          <use href="#willow" transform="translate(90 90) rotate(45)"/>
          <use href="#willow" transform="translate(60 60) rotate(-62) scale(.8)"/>
          <use href="#willow" transform="translate(60 60) rotate(-118) scale(.8)"/>
          <use href="#willow" transform="translate(60 60) rotate(62) scale(.8)"/>
          <use href="#willow" transform="translate(60 60) rotate(118) scale(.8)"/>
        </g>
        <g fill="none" stroke="var(--linen)" stroke-width=".8" opacity=".7">
          <path d="M30 30 l-14 -14 M90 30 l14 -14 M30 90 l-14 14 M90 90 l14 14"/>
        </g>
        <use href="#bloom" x="60" y="60"/>
        <use href="#bud" x="0" y="0"/><use href="#bud" x="120" y="0"/><use href="#bud" x="0" y="120"/><use href="#bud" x="120" y="120"/>
        <g fill="var(--willow)">
          <use href="#willow" transform="translate(52 12) rotate(-160) scale(.55)"/>
          <use href="#willow" transform="translate(68 12) rotate(-20) scale(.55)"/>
          <use href="#willow" transform="translate(52 108) rotate(160) scale(.55)"/>
          <use href="#willow" transform="translate(68 108) rotate(20) scale(.55)"/>
          <use href="#willow" transform="translate(8 48) rotate(-110) scale(.55)"/>
          <use href="#willow" transform="translate(112 48) rotate(-70) scale(.55)"/>
          <use href="#willow" transform="translate(8 72) rotate(110) scale(.55)"/>
          <use href="#willow" transform="translate(112 72) rotate(70) scale(.55)"/>
        </g>
        <g fill="var(--linen)" opacity=".85">
          <circle cx="60" cy="0" r="3"/><circle cx="60" cy="120" r="3"/><circle cx="0" cy="60" r="3"/><circle cx="120" cy="60" r="3"/>
        </g>
      </pattern>
      <!-- [Agent] Kelmscott border: a white-line vine cut into a black block, tiled along each side. -->
      <pattern id="vine" width="28" height="20" patternUnits="userSpaceOnUse">
        <rect width="28" height="20" fill="var(--ink)"/>
        <path d="M0 10 C7 2 14 2 14 10 C14 18 21 18 28 10" fill="none" stroke="var(--linen)" stroke-width="1.6"/>
        <path d="M7 5 C9 1 13 0 15 1 C13 4 10 5 7 5Z M21 15 C19 19 15 20 13 19 C15 16 18 15 21 15Z" fill="var(--linen)"/>
      </pattern>
      <pattern id="vine-v" href="#vine" patternTransform="rotate(90)"/>
    </defs>

    <rect width="800" height="500" fill="url(#morris)"/>
    <rect x="140" y="40" width="520" height="420" fill="var(--linen)"/>
    <rect x="140" y="40" width="520" height="20" fill="url(#vine)"/>
    <rect x="140" y="440" width="520" height="20" fill="url(#vine)"/>
    <rect x="140" y="40" width="20" height="420" fill="url(#vine-v)"/>
    <rect x="640" y="40" width="20" height="420" fill="url(#vine-v)"/>
    <rect x="140" y="40" width="520" height="420" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <rect x="160" y="60" width="480" height="380" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
    <rect x="166" y="66" width="468" height="368" fill="none" stroke="var(--ink)" stroke-width=".6"/>
  </svg>

  <div class="page">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something<br>people <em>keep</em></h1>
    <svg class="leaf" viewBox="0 0 60 14" aria-hidden="true">
      <path d="M0 7 H22 M38 7 H60" stroke="var(--ink)" stroke-width="1"/>
      <path d="M30 1 C36 3 38 7 30 13 C22 7 24 3 30 1Z" fill="var(--willow)"/>
    </svg>
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <div class="foot">
      <button class="button">Start a project</button>
      <div class="card">
        <div class="label">Still in use</div>
        <div class="num">1,284</div>
        <div class="cap">projects made since 2019</div>
      </div>
    </div>
  </div>
</body>
</html>
