<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Index / list site</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(100% 0 0);
  --surface: oklch(97.6% 0.003 255);
  --line: oklch(91.5% 0.005 255);
  --fill: oklch(93% 0.005 255);
  --fill-2: oklch(87.5% 0.007 255);
  --text: oklch(23% 0.012 255);
  --muted: oklch(52% 0.012 255);
  --accent: oklch(56% 0.2 260);
  --accent-soft: oklch(95.5% 0.025 260);
  --radius: 8px;
  --sans: "Inter", sans-serif;
  --mono: "JetBrains Mono", monospace;
  --cols: 48px 1.6fr 1fr 1fr 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--bg); }
body { position: relative; padding: 0 32px; color: var(--text); font-family: var(--sans); font-size: 14px; }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--fill-2); }
p { margin: 0; }

.top { height: 46px; display: flex; align-items: center; gap: 16px; }
.eyebrow { margin-right: auto; font: 500 12px/1 var(--mono); color: var(--muted); }
.top i { width: 38px; height: 6px; border-radius: 3px; background: var(--fill-2); }

.intro { display: grid; grid-template-columns: var(--cols); column-gap: 20px; padding: 14px 0 26px; }
h1 { grid-column: 1 / 3; margin: 0; font-size: 26px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.side { grid-column: 3 / 6; }
.sub { font-size: 13px; line-height: 1.5; color: var(--muted); }
.btn { display: inline-block; margin-top: 12px; padding: 8px 13px; border-radius: var(--radius); background: var(--text); color: white; font-size: 12.5px; font-weight: 500; }

/* [Agent] The page is a table: one row height, hairline rules, hierarchy only by column position, with no cards and no radius. */
.row { display: grid; grid-template-columns: var(--cols); column-gap: 20px; align-items: center; height: 37px; border-top: 1px solid var(--line); }
.row.th { height: 30px; border-top: 1px solid var(--text); }
.row.th .bar { width: 36px; height: 5px; background: var(--muted); opacity: 0.5; }
.n { font: 12px/1 var(--mono); color: var(--muted); }
.row .t { background: var(--text); opacity: 0.75; }
.row .c, .row .y { background: var(--fill-2); }
.row .y { justify-self: end; width: 34px; }
.row.hover .n, .row.hover .t { color: var(--accent); background: var(--accent); opacity: 1; }
.row.hover .n { background: none; }
.row.hover { border-top-color: var(--accent); }
.row.hover + .row { border-top-color: var(--accent); }

/* [Agent] The hover preview follows the cursor; here it is frozen beside the pointer over row 03. */
.preview { position: absolute; left: 318px; top: 300px; width: 196px; border-radius: 2px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 40px -12px oklch(30% 0.04 260 / 0.35); }
.preview .img { height: 78px; background: linear-gradient(130deg, oklch(94% 0.02 250), oklch(82% 0.06 262)); }
.card { padding: 10px 12px 12px; }
.label, .cap { font-size: 11px; color: var(--muted); }
.num { margin: 3px 0 2px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.cursor { position: absolute; left: 300px; top: 282px; width: 16px; height: 20px; }
</style>
</head>
<body>
<header class="top"><span class="eyebrow">Introducing Keep</span><i></i><i></i><i></i></header>

<section class="intro">
  <h1>Make something people keep</h1>
  <div class="side">
    <p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="btn">Start a project</span>
  </div>
</section>

<main aria-hidden="true">
  <div class="row th"><span class="bar" style="width:16px"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar" style="justify-self:end;width:28px"></span></div>
  <div class="row"><span class="n">01</span><span class="bar t" style="width:62%"></span><span class="bar c" style="width:58%"></span><span class="bar c" style="width:42%"></span><span class="bar y"></span></div>
  <div class="row"><span class="n">02</span><span class="bar t" style="width:44%"></span><span class="bar c" style="width:70%"></span><span class="bar c" style="width:36%"></span><span class="bar y"></span></div>
  <div class="row hover"><span class="n">03</span><span class="bar t" style="width:74%"></span><span class="bar c" style="width:48%"></span><span class="bar c" style="width:52%"></span><span class="bar y"></span></div>
  <div class="row"><span class="n">04</span><span class="bar t" style="width:52%"></span><span class="bar c" style="width:62%"></span><span class="bar c" style="width:40%"></span><span class="bar y"></span></div>
  <div class="row"><span class="n">05</span><span class="bar t" style="width:66%"></span><span class="bar c" style="width:40%"></span><span class="bar c" style="width:56%"></span><span class="bar y"></span></div>
  <div class="row"><span class="n">06</span><span class="bar t" style="width:38%"></span><span class="bar c" style="width:66%"></span><span class="bar c" style="width:34%"></span><span class="bar y"></span></div>
  <div class="row"><span class="n">07</span><span class="bar t" style="width:58%"></span><span class="bar c" style="width:52%"></span><span class="bar c" style="width:46%"></span><span class="bar y"></span></div>
  <div class="row"><span class="n">08</span><span class="bar t" style="width:48%"></span><span class="bar c" style="width:44%"></span><span class="bar c" style="width:50%"></span><span class="bar y"></span></div>
</main>

<svg class="cursor" viewBox="0 0 16 20" aria-hidden="true"><path d="M1 1v15l4-4 3 7 3-1.4-3-6.6h5.5z" fill="oklch(23% 0.012 255)" stroke="white" stroke-width="1.2" stroke-linejoin="round"/></svg>
<aside class="preview">
  <div class="img"></div>
  <div class="card">
    <p class="label">Still in use</p>
    <p class="num">1,284</p>
    <p class="cap">projects made since 2019</p>
  </div>
</aside>
</body>
</html>
