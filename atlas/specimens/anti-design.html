<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anti-design</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Serif:ital@0;1&family=Rubik+Glitch&family=VT323&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --blue: oklch(0.45 0.31 264);
  --green: oklch(0.87 0.29 142);
  --magenta: oklch(0.70 0.32 328);
  --yellow: oklch(0.97 0.19 110);
  --white: oklch(1 0 0);
  --black: oklch(0 0 0);
  --red: oklch(0.63 0.26 29);
  --button-face: oklch(0.95 0 0);
  --button-edge: oklch(0.55 0 0);
  --arial: "Archivo", sans-serif;
  --times: "Instrument Serif", serif;
  --glitch: "Rubik Glitch", sans-serif;
  --pixel: "VT323", monospace;
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--white); }
body { position: relative; font-family: var(--arial); color: var(--black); }
body > * { position: absolute; margin: 0; }

.block { left: -40px; top: 268px; width: 560px; height: 300px; background: var(--blue); rotate: -3deg; }
.ball { left: 622px; top: -96px; width: 260px; height: 260px; border-radius: 50%; background: var(--green); }
.star { left: 690px; top: 28px; width: 72px; image-rendering: pixelated; shape-rendering: crispEdges; rotate: 14deg; }

h1 { inset: 0; font-size: inherit; font-weight: 400; }
h1 span { position: absolute; white-space: nowrap; }
.eyebrow { left: 26px; top: 20px; font: 400 26px/1 var(--times); color: var(--blue); text-decoration: underline; }
/* [Agent] Stretch the default sans vertically from its top edge so the layout box stays where the eye expects it. */
.make { left: 20px; top: 52px; font-size: 62px; font-weight: 900; font-variation-settings: "wdth" 62; letter-spacing: -0.03em; line-height: 1;
  transform: scale(1.05, 2.2); transform-origin: 0 0; text-shadow: 5px 4px 0 var(--green); }
.people { left: 530px; top: 104px; font: italic 400 84px/1 var(--times); color: var(--magenta); rotate: 9deg; }
.keep { left: 30px; top: 276px; font: 400 156px/1 var(--glitch); color: var(--yellow); rotate: -3deg; text-shadow: 9px 9px 0 var(--magenta); }

.sub { left: 452px; top: 198px; width: 344px; font-size: 14px; line-height: 1.3; }
.sub mark { background: var(--yellow); }

.cta { left: 540px; top: 282px; padding: 3px 9px; font: 400 13.3px var(--arial); background: var(--button-face); border: 1px solid var(--button-edge); border-radius: 2px;
  transform: scale(1.7) rotate(-8deg); transform-origin: 0 0; }
.cursor { left: 704px; top: 286px; width: 26px; }
.scribble { left: 498px; top: 244px; width: 230px; height: 120px; overflow: visible; }

.card { left: 566px; top: 356px; width: 196px; padding: 10px 14px 12px; background: var(--green); rotate: 7deg; box-shadow: 8px 8px 0 var(--magenta); }
.card .label { font: 400 20px/1 var(--times); text-decoration: underline; }
.card .num { display: block; font: 400 76px/0.8 var(--pixel); color: var(--blue); }
.card .cap { display: block; font-size: 12px; font-variation-settings: "wdth" 125; font-weight: 700; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="block"></div>
<div class="ball"></div>
<svg class="star" viewBox="0 0 9 9"><path fill="var(--black)" d="M4 0h1v2h2v1h2v1h-1v1h-1v2h1v2h-1v-1h-2v-1h-1v1h-2v1h-1v-2h1v-2h-1v-1h-1v-1h2v-1h2z"/><path fill="var(--yellow)" d="M4 2h1v1h2v1h-1v2h-1v-1h-1v1h-1v-2h-1v-1h2z"/></svg>

<a class="eyebrow" href="#">Introducing Keep</a>
<h1>
  <span class="make">Make something</span>
  <span class="people">people</span>
  <span class="keep">keep</span>
</h1>
<p class="sub">Tools for small teams who make things <mark>slowly and well.</mark><br>Plan it, ship it, and look after it for years.</p>

<button class="cta">Start a project</button>
<svg class="scribble" viewBox="0 0 230 120"><path d="M30 64 C 26 20, 150 2, 206 30 C 240 50, 214 104, 120 108 C 40 112, 6 84, 22 54 C 34 30, 90 18, 140 20" fill="none" stroke="var(--red)" stroke-width="5" stroke-linecap="round"/></svg>
<svg class="cursor" viewBox="0 0 12 19" shape-rendering="crispEdges"><path d="M0 0v16l4-4 3 7 2-1-3-7h6z" fill="var(--white)" stroke="var(--black)" stroke-width="1"/></svg>

<aside class="card">
  <span class="label">Still in use</span>
  <span class="num">1,284</span>
  <span class="cap">projects made since 2019</span>
</aside>
</body>
</html>
