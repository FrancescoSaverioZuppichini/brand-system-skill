<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wellness / organic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..500,0..100,0..1&family=Figtree:wght@400;500;600&display=block">
<style>
  :root {
    color-scheme: light;
    --oat: oklch(0.95 0.02 85);
    --sand: oklch(0.90 0.035 75);
    --sage: oklch(0.70 0.05 140);
    --sage-soft: oklch(0.86 0.035 140);
    --terracotta: oklch(0.62 0.12 45);
    --olive: oklch(0.42 0.05 120);
    --bark: oklch(0.30 0.03 60);
    --serif: "Fraunces", serif;
    --sans: "Figtree", sans-serif;
  }
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--oat); }
  body { position: relative; font-family: var(--sans); color: var(--bark); }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; }

  .arch { position: absolute; left: 168px; top: 30px; width: 444px; height: 470px; border-radius: 222px 222px 0 0; background: var(--sand); text-align: center; }
  .sun { position: absolute; left: 50%; top: 52px; width: 76px; height: 76px; margin-left: -38px; border-radius: 50%; background: var(--terracotta); }
  .sun::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 1px solid oklch(0.62 0.12 45 / 0.45); }
  .eyebrow { margin-top: 158px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--olive); }
  h1 { font-family: var(--serif); font-weight: 300; font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 96; font-size: 50px; line-height: 1.04; letter-spacing: -0.015em; margin: 12px 0 16px; }
  h1 em { font-style: normal; color: var(--terracotta); }
  p { margin: 0; font-size: 14.5px; line-height: 1.6; white-space: nowrap; }
  .cta { display: inline-block; margin-top: 24px; padding: 13px 28px; border-radius: 999px; background: var(--olive); color: var(--oat); font-size: 14.5px; font-weight: 500; }

  .card { position: absolute; left: 638px; top: 318px; width: 116px; padding: 20px 14px 18px; border-radius: 62px 62px 18px 18px; background: var(--sage-soft); text-align: center; }
  .card .label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--olive); }
  .card .num { font-family: var(--serif); font-weight: 400; font-variation-settings: "SOFT" 100, "opsz" 72; font-size: 34px; line-height: 1.2; }
  .card .cap { font-size: 11.5px; line-height: 1.35; }
</style>
</head>
<body>
  <!-- [Agent] Botanical line drawing and pebbles sit behind the arch so the centre stays calm. -->
  <svg width="800" height="500" viewBox="0 0 800 500" style="position:absolute;inset:0">
    <g fill="none" stroke="var(--olive)" stroke-width="1.4" stroke-linecap="round">
      <path d="M96 470 C 92 380 100 290 128 200 C 140 160 150 130 158 104"/>
      <path d="M100 410 C 70 400 52 372 50 342 C 78 350 96 372 100 410 Z"/>
      <path d="M104 352 C 132 336 146 306 142 276 C 118 290 104 318 104 352 Z"/>
      <path d="M112 290 C 82 280 66 254 66 226 C 92 236 108 260 112 290 Z"/>
      <path d="M126 222 C 150 206 160 180 156 154 C 136 168 126 192 126 222 Z"/>
      <path d="M140 170 C 118 160 106 140 108 118 C 128 128 140 148 140 170 Z"/>
      <path d="M100 410 L 76 372 M104 352 L 128 300 M112 290 L 84 248 M126 222 L 146 178 M140 170 L 120 136" stroke-width="1"/>
    </g>
    <path d="M10 500 C 6 452 52 430 96 440 C 140 450 160 480 156 500 Z" fill="var(--sage)"/>
    <ellipse cx="170" cy="488" rx="34" ry="22" fill="var(--terracotta)" opacity="0.85"/>
    <path d="M680 120 C 690 80 740 66 770 92 C 796 116 784 160 748 166 C 712 172 672 156 680 120 Z" fill="var(--sage)" opacity="0.55"/>
    <circle cx="660" cy="200" r="12" fill="var(--olive)" opacity="0.5"/>
    <path d="M640 290 C 660 270 700 262 730 270" fill="none" stroke="var(--terracotta)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M650 306 C 670 290 704 284 728 290" fill="none" stroke="var(--terracotta)" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  </svg>

  <div class="arch">
    <div class="sun"></div>
    <div class="eyebrow">Introducing Keep</div>
    <h1>Make something<br>people <em>keep</em></h1>
    <p>Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
    <span class="cta">Start a project</span>
  </div>

  <div class="card">
    <div class="label">Still in use</div>
    <div class="num">1,284</div>
    <div class="cap">projects made<br>since 2019</div>
  </div>

  <svg class="grain" width="800" height="500"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.18 0"/></filter><rect width="800" height="500" filter="url(#n)"/></svg>
</body>
</html>
