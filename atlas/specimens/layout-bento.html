<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bento grid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
:root {
  color-scheme: light;
  --bg: oklch(100% 0 0);
  --surface: oklch(97.6% 0.003 255);
  --line: oklch(91.5% 0.005 255);
  --fill: oklch(93% 0.005 255);
  --fill-2: oklch(87.5% 0.007 255);
  --text: oklch(23% 0.012 255);
  --muted: oklch(52% 0.012 255);
  --accent: oklch(56% 0.2 260);
  --accent-soft: oklch(95.5% 0.025 260);
  --radius: 8px;
  --tile-radius: 18px;
  --gap: 12px;
  --sans: "Inter", sans-serif;
  --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--surface); }
body { color: var(--text); font-family: var(--sans); }
.bar { display: block; height: 7px; border-radius: 4px; background: var(--fill); }

/* [Agent] Four equal columns and three rows; every tile is a span (2×2, 1×2, 2×1, 1×1), never a free size, so the gaps stay identical. */
.bento { height: 100%; padding: 20px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: var(--gap); }
.tile { position: relative; overflow: hidden; padding: 22px; border-radius: var(--tile-radius); background: var(--bg); border: 1px solid var(--line); }
.w2 { grid-column: span 2; }
.h2 { grid-row: span 2; }

.lead { display: flex; flex-direction: column; justify-content: flex-end; padding: 28px; }
.eyebrow { margin: 0 0 12px; font: 500 12px/1 var(--mono); color: var(--accent); }
h1 { margin: 0; font-size: 38px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; }
.sub { margin: 14px 0 22px; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
.btn { align-self: flex-start; padding: 10px 16px; border-radius: var(--radius); background: var(--accent); color: white; font-size: 13px; font-weight: 500; }

.card { display: flex; flex-direction: column; justify-content: space-between; background: var(--accent-soft); border-color: oklch(56% 0.2 260 / 0.15); }
.card p { margin: 0; }
.label { font-size: 12px; color: var(--muted); }
.num { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
.cap { margin-top: 6px !important; font-size: 11.5px; color: var(--muted); }

.tall { padding: 0; background: linear-gradient(160deg, oklch(94% 0.02 250), oklch(84% 0.05 262)); border: 0; }
.tall .bar { position: absolute; left: 20px; bottom: 22px; width: 60%; background: oklch(100% 0 0 / 0.7); }
.tall .bar + .bar { bottom: 38px; width: 36%; height: 10px; }

.icon { display: block; width: 34px; height: 34px; margin-bottom: 30px; border-radius: 50%; border: 7px solid var(--fill-2); }
.stack { display: grid; gap: 9px; }

.chart { display: flex; align-items: flex-end; gap: 8px; height: 70px; margin-top: 18px; }
.chart i { flex: 1; border-radius: 4px 4px 0 0; background: var(--fill-2); }
.chart i:nth-child(6) { background: var(--accent); opacity: 0.6; }

.img { position: absolute; inset: 0 0 0 46%; background:
  linear-gradient(to top right, transparent calc(50% - 0.7px), var(--fill-2) 50%, transparent calc(50% + 0.7px)),
  linear-gradient(to bottom right, transparent calc(50% - 0.7px), var(--fill-2) 50%, transparent calc(50% + 0.7px)),
  var(--surface); border-left: 1px solid var(--line); }
</style>
</head>
<body>
<main class="bento">
  <section class="tile w2 h2 lead">
    <p class="eyebrow">Introducing Keep</p>
    <h1>Make something<br>people keep</h1>
    <p class="sub">Tools for small teams who make things slowly and well. Plan it, ship it, and look after it for years.</p>
    <span class="btn">Start a project</span>
  </section>

  <section class="tile card">
    <p class="label">Still in use</p>
    <div><p class="num">1,284</p><p class="cap">projects made since 2019</p></div>
  </section>

  <section class="tile h2 tall"><span class="bar"></span><span class="bar"></span></section>

  <section class="tile">
    <span class="icon"></span>
    <div class="stack"><span class="bar" style="width:70%;background:var(--fill-2)"></span><span class="bar" style="width:90%"></span></div>
  </section>

  <section class="tile w2">
    <div class="stack"><span class="bar" style="width:34%;background:var(--fill-2)"></span><span class="bar" style="width:52%"></span></div>
    <div class="chart"><i style="height:30%"></i><i style="height:46%"></i><i style="height:38%"></i><i style="height:62%"></i><i style="height:55%"></i><i style="height:92%"></i><i style="height:70%"></i><i style="height:80%"></i></div>
  </section>

  <section class="tile w2">
    <div class="stack" style="width:40%"><span class="bar" style="width:80%;background:var(--fill-2)"></span><span class="bar"></span><span class="bar" style="width:70%"></span></div>
    <div class="img"></div>
  </section>
</main>
</body>
</html>
