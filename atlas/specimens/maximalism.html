<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maximalism</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@500&family=Instrument+Serif:ital@1&family=Shrikhand&display=block" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --pink: oklch(0.66 0.25 355);
  --orange: oklch(0.72 0.19 50);
  --cobalt: oklch(0.48 0.22 262);
  --lime: oklch(0.88 0.20 128);
  --purple: oklch(0.45 0.20 300);
  --cream: oklch(0.95 0.03 90);
  --ink: oklch(0.20 0.03 290);
  --grotesk: "Bricolage Grotesque", sans-serif;
  --script: "Shrikhand", serif;
  --serif: "Instrument Serif", serif;
  --mono: "DM Mono", monospace;
  /* [Agent] One stroke and one hard shadow for every object: the shared rule that keeps the collage art-directed. */
  --stroke: 3px solid var(--ink);
  --shadow: 6px 6px 0 var(--ink);
}
html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: var(--cream); }
body { position: relative; font-family: var(--grotesk); color: var(--ink); }
body > * { position: absolute; margin: 0; }

.dots { left: 560px; top: -150px; width: 380px; height: 380px; border-radius: 50%; border: var(--stroke);
  background: radial-gradient(circle, var(--pink) 0 5px, transparent 5.5px) 0 0 / 24px 24px, var(--cobalt); }
.arch { left: 640px; top: 236px; width: 200px; height: 300px; border: var(--stroke); border-radius: 100px 100px 0 0;
  background: repeating-linear-gradient(90deg, var(--lime) 0 12px, var(--purple) 12px 24px); }
.half { left: -70px; top: 400px; width: 220px; height: 220px; border: var(--stroke); border-radius: 50%; background: var(--orange); }
.checks { left: 0; right: 0; bottom: 0; height: 22px; border-top: var(--stroke);
  background: repeating-conic-gradient(var(--ink) 0 25%, var(--cream) 0 50%) 0 0 / 22px 22px; }
.squiggle { left: 268px; top: 22px; width: 200px; height: 40px; }

.tape { left: 34px; top: 28px; padding: 6px 14px; background: var(--lime); border: var(--stroke); box-shadow: var(--shadow); rotate: -4deg;
  font: 500 13px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }

h1 { left: 30px; top: 66px; font-weight: 800; line-height: .86; }
h1 span { display: inline-block; }
.make { font-size: 124px; font-variation-settings: "wdth" 75; letter-spacing: -0.03em; color: var(--cobalt); }
.something { font: italic 400 112px/1 var(--serif); color: var(--purple); margin-left: 6px; padding: 0 14px 4px; background: var(--cream); border: var(--stroke); box-shadow: var(--shadow); }
.people { font: 400 92px/1 var(--script); color: var(--pink); text-shadow: 5px 5px 0 var(--ink); margin-top: 6px; }
.keep { margin-left: 18px; padding: 2px 16px 10px; font-size: 104px; font-variation-settings: "wdth" 100; letter-spacing: -0.04em; color: var(--cream);
  background: var(--orange); border: var(--stroke); box-shadow: var(--shadow); rotate: 3deg; }

.sub { left: 36px; top: 322px; padding: 12px 16px; background: var(--cream); border: var(--stroke);
  font-size: 15px; font-weight: 500; line-height: 1.45; }
.cta { left: 40px; top: 410px; padding: 13px 26px; border: var(--stroke); border-radius: 999px; box-shadow: var(--shadow); rotate: -2deg;
  background: var(--pink); color: var(--cream); font-size: 18px; font-weight: 800; text-decoration: none; }

.sticker { left: 486px; top: 268px; width: 224px; height: 224px; rotate: -10deg; display: grid; place-content: center; text-align: center; }
.sticker svg { position: absolute; inset: 0; z-index: -1; filter: drop-shadow(6px 6px 0 var(--ink)); }
.sticker .label { font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.sticker .num { font: 400 50px/1.1 var(--script); color: var(--cobalt); }
.sticker .cap { font: italic 400 17px/1 var(--serif); }
</style>
</head>
<body>
<div class="dots"></div>
<div class="arch"></div>
<div class="half"></div>
<svg class="squiggle" viewBox="0 0 200 40"><path d="M4 20 Q 16 2 29 20 T 54 20 T 79 20 T 104 20 T 129 20 T 154 20 T 179 20 T 196 14" fill="none" stroke="var(--cobalt)" stroke-width="7" stroke-linecap="round"/></svg>
<div class="checks"></div>

<p class="tape">Introducing Keep</p>
<h1><span class="make">Make</span><span class="something">something</span><br><span class="people">people</span><span class="keep">keep</span></h1>
<p class="sub">Tools for small teams who make things slowly and well.<br>Plan it, ship it, and look after it for years.</p>
<a class="cta" href="#">Start a project</a>

<aside class="sticker">
  <svg viewBox="0 0 100 100"><polygon fill="var(--lime)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round" points="50,1 56,13 67,4 69,17 82,12 79,25 93,25 85,36 98,42 87,50 98,58 85,64 93,75 79,75 82,88 69,83 67,96 56,87 50,99 44,87 33,96 31,83 18,88 21,75 7,75 15,64 2,58 13,50 2,42 15,36 7,25 21,25 18,12 31,17 33,4 44,13"/></svg>
  <span class="label">Still in use</span>
  <span class="num">1,284</span>
  <span class="cap">projects made since 2019</span>
</aside>
</body>
</html>
